<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Chess RPG</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#060913}
#root{height:100%}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:8px;gap:6px;color:#f1f5f9;font-family:system-ui,sans-serif}

/* ── BARRE ── */
.top-bar{flex-shrink:0;height:40px;display:flex;gap:6px;align-items:center}
.mode-btn{flex:1;height:100%;background:#0b0f19;border:1px solid #1e293b;color:#94a3b8;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.mode-btn.active{color:#030712!important}
.flip-btn{flex-shrink:0;padding:0 12px;height:100%;background:#1e293b;border:none;color:#94a3b8;border-radius:8px;font-size:13px;cursor:pointer}

/* ── PLAYER ROW ── */
.player-row{flex-shrink:0;height:48px;display:flex;gap:8px;align-items:center}
.player-label{flex:1;height:100%;background:#0b0f19;border:1px solid #1e293b;border-radius:10px;display:flex;flex-direction:column;justify-content:center;padding:0 12px;overflow:hidden}
.player-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px}
.last-move-hint{font-size:10px;color:#475569;margin-top:1px;letter-spacing:.05em}
.thinking-dot{flex-shrink:0;width:7px;height:7px;border-radius:50%;background:#38bdf8;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
.energy-badge{flex-shrink:0;width:58px;height:100%;background:#0b0f19;border:1px solid #1e293b;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900}

/* ── BOARD ── */
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.board{
  --side:min(calc(100vw - 16px),calc(100vh - 310px));
  width:var(--side);height:var(--side);
  display:grid;grid-template-columns:repeat(8,1fr);
  border-radius:4px;overflow:hidden;
  border:3px solid #4b3220;
  box-shadow:0 0 0 5px #6b4423,0 6px 24px rgba(0,0,0,.6)
}
.cell{position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--side,300px)/8*.72);cursor:pointer;aspect-ratio:1/1}
.cell.light{background:#f0d9b5}
.cell.dark {background:#b58863}
.cell.last-from.light,.cell.last-to.light{background:#f6f669}
.cell.last-from.dark, .cell.last-to.dark {background:#c8b400}
.cell.sel{outline:3px solid #a855f7;outline-offset:-3px;background:#2d1f4e!important}

/* ── PEZZI ── */
.piece{font-family:"Segoe UI Symbol","Noto Sans Symbols",sans-serif;display:inline-block;line-height:1;user-select:none}
.piece-w{color:#fef9f0;-webkit-text-stroke:1.8px #1a0a00;filter:drop-shadow(0 2px 4px rgba(0,0,0,.75))}
.piece-b{color:#0f0800;-webkit-text-stroke:.5px rgba(255,255,255,.1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.evo2{filter:drop-shadow(0 0 5px #eab308) drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.evo3{filter:drop-shadow(0 0 10px #a855f7) drop-shadow(0 0 22px #a855f7)}
.lm{position:absolute;top:2px;right:3px;font-size:9px;font-weight:800;pointer-events:none}
.lm2{color:#eab308;text-shadow:0 0 5px #eab308}
.lm3{color:#a855f7;text-shadow:0 0 8px #a855f7}

/* ── PANEL ── */
.panel{flex-shrink:0;height:88px;background:#0b0f19;border:1px solid #1e293b;border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:7px}
.charge-row{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:#94a3b8}
.charge-track{width:100%;height:5px;background:#1e293b;border-radius:3px;overflow:hidden;margin-top:4px}
.panel-bottom{display:flex;align-items:center;gap:8px;flex:1}
.piece-label{flex:1;font-size:12px;min-width:0}
.evolve-btn{flex-shrink:0;padding:6px 10px;border:none;border-radius:7px;font-weight:800;font-size:11px;cursor:pointer;white-space:nowrap}
.turn-pill{flex-shrink:0;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;background:#1e293b}

@keyframes lvlup{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="root"></div>

<!-- Ordine di caricamento importante: chess.js → evolutions.js → omega-ai.js → React -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="evolutions.js"></script>
<script src="omega-ai.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;
const Chess=window.Chess;
const ICONS={w:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};

const PERSONALITIES={
  human:   { name:'Umano',         ai:false, color:'#94a3b8' },
  omega:   { name:'Stockfish Omega',ai:true,  color:'#eab308' },
};

// ── GAME HELPERS ──────────────────────────────────────────────────────────────
function buildInitialState(g){
  const pd={},sm={};
  g.board().forEach((row,r)=>row.forEach((cell,c)=>{
    if(cell){const sq='abcdefgh'[c]+(8-r);const id=`${cell.color}${cell.type}_${sq}`;
    pd[id]={id,type:cell.type,color:cell.color,level:1};sm[sq]=id;}
  }));
  return{pd,sm};
}

function execAbilityMove(game,from,to){
  const piece=game.get(from),captured=game.get(to)||null;
  const g=new Chess(game.fen());
  g.remove(from);if(captured)g.remove(to);g.put(piece,to);
  const parts=g.fen().split(' ');const wasW=parts[1]==='w';
  parts[1]=wasW?'b':'w';if(!wasW)parts[5]=String(parseInt(parts[5])+1);parts[3]='-';
  const ng=new Chess();ng.load(parts.join(' '));
  return{newGame:ng,capturedPiece:captured};
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const[game,setGame]   =useState(()=>new Chess());
  const[pd,setPd]       =useState({});
  const[sm,setSm]       =useState({});
  const[sel,setSel]     =useState(null);
  const[stdMoves,setStd]=useState([]);
  const[abilMoves,setAbl]=useState([]);
  const[lvlUpSq,setLvlUp]=useState(null);
  const[pts,setPts]     =useState({w:0,b:0});
  const[whiteAI,setWhiteAI]=useState('human');
  const[blackAI,setBlackAI]=useState('omega');
  const[thinking,setThinking]=useState(false);
  const[lastMove,setLastMove]=useState(null);
  const[flipped,setFlipped]=useState(false);
  const aiTimer=useRef(null);
  const aiGen=useRef(0);

  useEffect(()=>{const s=buildInitialState(game);setPd(s.pd);setSm(s.sm);},[]);

  // Auto-flip: se l'umano gioca col nero, ruota la board
  useEffect(()=>{
    const humanBlack=!PERSONALITIES[blackAI].ai&&PERSONALITIES[whiteAI].ai;
    setFlipped(humanBlack);
  },[whiteAI,blackAI]);

  const getMovesFor=useCallback(sq=>{
    const piece=game.get(sq);if(!piece)return{std:[],abil:[]};
    const std=game.moves({square:sq,verbose:true});
    const id=sm[sq];const data=pd[id];const evo=EVOLUTIONS[piece.type];
    const abil=evo&&data?evo.getAbilityMoves(sq,game,data.level,piece.color):[];
    return{std,abil};
  },[game,sm,pd]);

  const makeMove=useCallback((from,to,isAbility=false)=>{
    const turn=game.turn();let newGame,cap=null;
    if(isAbility){
      const res=execAbilityMove(game,from,to);newGame=res.newGame;cap=res.capturedPiece;
    }else{
      newGame=new Chess(game.fen());
      const mv=newGame.move({from,to,promotion:'q'});
      if(!mv)return;
      if(mv.captured)cap={type:mv.captured};
      if(mv.flags?.includes('e'))cap={type:'p',_sq:to[0]+from[1]};
    }
    const mid=sm[from];const nsm={...sm};const npd={...pd};
    if(cap){const cSq=cap._sq??to;const cId=nsm[cSq];delete npd[cId];delete nsm[cSq];}
    const np=newGame.get(to);let isPromo=false;
    if(np&&np.type!==pd[mid]?.type){npd[mid]={...npd[mid],type:np.type,level:1};isPromo=true;}
    delete nsm[from];nsm[to]=mid;
    let p=1;if(cap)p++;if(newGame.in_check())p++;if(isPromo)p+=2;
    setPts(ps=>({...ps,[turn]:ps[turn]+p}));
    setGame(newGame);setPd(npd);setSm(nsm);
    setSel(null);setStd([]);setAbl([]);
    setLastMove({from,to});
  },[game,sm,pd]);

  const doEvolve=useCallback(sq=>{
    if(!sq)return;const turn=game.turn();
    const piece=game.get(sq);if(!piece||piece.color!==turn)return;
    if(pts[turn]<2)return;
    const id=sm[sq];const d=pd[id];
    if(!d||d.level>=3||!EVOLUTIONS[d.type])return;
    setPd(prev=>({...prev,[id]:{...d,level:d.level+1}}));
    setPts(prev=>({...prev,[turn]:prev[turn]-2}));
    setLvlUp(sq);setTimeout(()=>setLvlUp(null),900);
    setSel(null);setStd([]);setAbl([]);
  },[game,pts,sm,pd]);

  // ── CLICK UMANO ──────────────────────────────────────────────────────────────
  const handleClick=useCallback(sq=>{
    const turn=game.turn();
    const isHuman=turn==='w'?!PERSONALITIES[whiteAI].ai:!PERSONALITIES[blackAI].ai;
    if(!isHuman||thinking)return;
    const piece=game.get(sq);
    if(sel){
      const sM=stdMoves.find(m=>m.to===sq);const aM=abilMoves.find(m=>m.to===sq);
      if(sM||aM){makeMove(sel,sq,!!aM);return;}
      if(piece?.color===turn){setSel(sq);const{std,abil}=getMovesFor(sq);setStd(std);setAbl(abil);return;}
      setSel(null);setStd([]);setAbl([]);return;
    }
    if(piece?.color===turn){setSel(sq);const{std,abil}=getMovesFor(sq);setStd(std);setAbl(abil);}
  },[game,sel,stdMoves,abilMoves,getMovesFor,makeMove,whiteAI,blackAI,thinking]);

  // ── AI TURN ───────────────────────────────────────────────────────────────────
  useEffect(()=>{
    const turn=game.turn();
    const aiType=turn==='w'?whiteAI:blackAI;
    if(!PERSONALITIES[aiType].ai||game.game_over())return;
    aiGen.current+=1;const myGen=aiGen.current;
    clearTimeout(aiTimer.current);
    aiTimer.current=setTimeout(async()=>{
      setThinking(true);
      // OMEGA_AI è definito in omega-ai.js, disponibile come globale
      const action=await OMEGA_AI.chooseAction(game,pd,sm,pts,turn);
      if(aiGen.current!==myGen){setThinking(false);return;}
      setThinking(false);
      if(!action)return;
      if(action.type==='evolve') doEvolve(action.sq);
      else makeMove(action.from,action.to,action.type==='ability');
    },350+Math.random()*200);
    return()=>clearTimeout(aiTimer.current);
  },[game,pd,sm,pts,whiteAI,blackAI,makeMove,doEvolve]);

  // ── RENDER ────────────────────────────────────────────────────────────────────
  const rawBoard=game.board();
  const boardData=flipped?[...rawBoard].reverse().map(r=>[...r].reverse()):rawBoard;
  const turn=game.turn();
  const selId=sel?sm[sel]:null;const selData=selId?pd[selId]:null;
  const selPiece=sel?game.get(sel):null;
  const evo=selPiece?EVOLUTIONS[selPiece.type]:null;
  const lvlInfo=evo&&selData?evo.levels[selData.level-1]:null;
  const curPts=pts[turn];const chargePct=Math.min(curPts/2*100,100);
  const canEvolve=!!(evo&&selData&&selData.level<3&&selPiece?.color===turn&&curPts>=2);
  const showEvolveBtn=!!(evo&&selData&&selData.level<3);
  const isAITurn=PERSONALITIES[turn==='w'?whiteAI:blackAI].ai;

  const resetGame=()=>{
    const g=new Chess();const s=buildInitialState(g);
    setGame(g);setPd(s.pd);setSm(s.sm);setPts({w:0,b:0});
    setSel(null);setStd([]);setAbl([]);setThinking(false);setLastMove(null);
    if(sfWorker)sfWorker.postMessage('ucinewgame');
  };

  const AIBar=({forColor,current,onChange})=>(
    <div className="top-bar">
      {Object.entries(PERSONALITIES).map(([k,v])=>(
        <button key={k}
          className={`mode-btn ${current===k?'active':''}`}
          style={current===k?{background:v.color,borderColor:v.color}:{}}
          onClick={()=>{onChange(k);resetGame();}}>
          {forColor==='w'?'⬜':'⬛'} {v.name}
        </button>
      ))}
      {forColor==='w'&&(
        <button className="flip-btn" onClick={()=>setFlipped(f=>!f)} title="Ruota scacchiera">🔄</button>
      )}
    </div>
  );

  return(
    <div className="app">

      <AIBar forColor="w" current={whiteAI} onChange={setWhiteAI}/>

      {/* Nero */}
      <div className="player-row">
        <div className="player-label" style={{borderLeft:`3px solid ${PERSONALITIES[blackAI].color}`}}>
          <div className="player-name">
            {thinking&&turn==='b'&&<div className="thinking-dot"/>}
            ⬛ {PERSONALITIES[blackAI].name}
          </div>
          {lastMove&&<div className="last-move-hint">{lastMove.from} → {lastMove.to}</div>}
        </div>
        <div className="energy-badge" style={{borderLeft:'3px solid #f43f5e',color:pts.b>=2?'#22c55e':'#94a3b8'}}>
          <span style={{fontSize:16}}>⚡</span><span style={{fontSize:11}}>{pts.b}</span>
        </div>
      </div>

      {/* Board */}
      <div className="board-wrap">
        <div className="board">
          {boardData.map((row,r)=>row.map((cell,c)=>{
            const fi=flipped?7-c:c;const ri=flipped?r:7-r;
            const sq='abcdefgh'[fi]+(ri+1);
            // Colore corretto: (file+rank) dispari = chiaro (h1=chiaro: 7+0=7 dispari ✓)
            const isLight=(fi+ri)%2!==0;
            const isSel=sel===sq;
            const isStd=stdMoves.some(m=>m.to===sq);const isAbil=abilMoves.some(m=>m.to===sq);
            const isAny=isStd||isAbil;const id=sm[sq];const data=id?pd[id]:null;
            const level=data?.level??1;const isLvlUp=lvlUpSq===sq;
            const evoClass=level===2?'evo2':level===3?'evo3':'';
            const isLastFrom=lastMove?.from===sq;const isLastTo=lastMove?.to===sq;

            return(
              <div key={sq} onClick={()=>handleClick(sq)}
                className={`cell ${isLight?'light':'dark'} ${isSel?'sel':''} ${isLastFrom?'last-from':''} ${isLastTo?'last-to':''}`}>
                {isAny&&!cell&&(<div style={{position:'absolute',width:'30%',height:'30%',borderRadius:'50%',background:isAbil?'#f59e0b':'#22c55e',boxShadow:`0 0 10px ${isAbil?'#f59e0b':'#22c55e'}`}}/>)}
                {isAny&&cell&&(<div style={{position:'absolute',inset:0,border:`3px solid ${isAbil?'#f59e0b':'#f43f5e'}`,borderRadius:'3px'}}/>)}
                {cell&&(
                  <span className={`piece piece-${cell.color} ${evoClass}`}
                    style={{transform:isLvlUp?'scale(1.5)':'scale(1)',transition:'transform .15s',animation:isLvlUp?'lvlup 1s ease':undefined}}>
                    {ICONS[cell.color][cell.type]}
                  </span>
                )}
                {cell&&EVOLUTIONS[cell.type]&&level>1&&(
                  <>
                    <div style={{position:'absolute',inset:'2px',border:`2px solid ${level===2?'#eab308':'#a855f7'}`,borderRadius:'2px',pointerEvents:'none'}}/>
                    <div className={`lm ${level===2?'lm2':'lm3'}`}>{'●'.repeat(level-1)}</div>
                  </>
                )}
              </div>
            );
          }))}
        </div>
      </div>

      {/* Bianco */}
      <div className="player-row">
        <div className="player-label" style={{borderLeft:`3px solid ${PERSONALITIES[whiteAI].color}`}}>
          <div className="player-name">
            {thinking&&turn==='w'&&<div className="thinking-dot"/>}
            ⬜ {PERSONALITIES[whiteAI].name}
            {thinking&&turn==='w'&&isAITurn&&<span style={{fontSize:10,color:'#38bdf8',marginLeft:4}}>Omega...</span>}
          </div>
          {lastMove&&<div className="last-move-hint">{lastMove.from} → {lastMove.to}</div>}
        </div>
        <div className="energy-badge" style={{borderLeft:'3px solid #38bdf8',color:pts.w>=2?'#22c55e':'#94a3b8'}}>
          <span style={{fontSize:16}}>⚡</span><span style={{fontSize:11}}>{pts.w}</span>
        </div>
      </div>

      {/* Panel */}
      <div className="panel">
        <div>
          <div className="charge-row">
            <span>🔋 {turn==='w'?'BIANCO':'NERO'}{isAITurn&&thinking?' · calcolo in corso...':''}</span>
            <span style={{color:curPts>=2?'#22c55e':'#38bdf8'}}>{curPts}/2{curPts>=2?' • PRONTO':''}</span>
          </div>
          <div className="charge-track">
            <div style={{width:`${chargePct}%`,height:'100%',background:curPts>=2?'#22c55e':'#38bdf8',transition:'width .3s',borderRadius:'3px'}}/>
          </div>
        </div>
        <div className="panel-bottom">
          <div className="piece-label">
            {selData&&evo?(
              <span style={{fontWeight:700,color:lvlInfo.color}}>
                {ICONS[selPiece.color][selPiece.type]} {lvlInfo.name} Lv.{selData.level}
                {abilMoves.length>0&&<span style={{color:'#f59e0b',marginLeft:4}}>🟡{abilMoves.length}</span>}
              </span>
            ):(<span style={{color:'#475569'}}>Seleziona un pezzo</span>)}
          </div>
          <button className="evolve-btn" onClick={()=>doEvolve(sel)}
            style={{
              visibility:showEvolveBtn?'visible':'hidden',
              background:canEvolve?(lvlInfo?.color||'#38bdf8'):'#1e293b',
              color:canEvolve?'#030712':'#475569',
              cursor:canEvolve?'pointer':'default',
            }}>
            ⚡ EVOLVI
          </button>
          <div className="turn-pill" style={{color:turn==='w'?'#38bdf8':'#f43f5e'}}>
            {game.in_check()?'SCACCO!':turn==='w'?'⬜':'⬛'}
          </div>
        </div>
      </div>

      <AIBar forColor="b" current={blackAI} onChange={setBlackAI}/>

      {game.game_over()&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.9)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',zIndex:99,gap:14,backdropFilter:'blur(8px)'}}>
          <div style={{fontSize:26,fontWeight:900,color:'#f1f5f9'}}>
            {game.in_checkmate()?(turn==='w'?'⬛ Nero vince!':'⬜ Bianco vince!'):'🤝 Pareggio'}
          </div>
          <div style={{fontSize:12,color:'#64748b',letterSpacing:'.15em',textTransform:'uppercase'}}>
            {game.in_checkmate()?'Scacco matto':'Patta'}
          </div>
          <button onClick={resetGame} style={{padding:'12px 40px',background:'#38bdf8',border:'none',borderRadius:9,fontWeight:800,fontSize:15,cursor:'pointer',marginTop:6}}>
            RIVINCITA
          </button>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
