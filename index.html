<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Chess RPG - Boss Battles</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#060913}
#root{height:100%}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:8px;gap:6px;color:#f1f5f9;font-family:system-ui,sans-serif}
.top-bar{flex-shrink:0;height:44px;display:flex;gap:6px;align-items:center;overflow-x:auto}
.mode-btn{flex:1;min-width:80px;height:100%;background:#0b0f19;border:1px solid #1e293b;color:#94a3b8;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.mode-btn.active{background:#38bdf8;color:#030712;border-color:#38bdf8}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.board{--side:min(calc(100vw - 16px),calc(100vh - 200px));width:var(--side);height:var(--side);display:grid;grid-template-columns:repeat(8,1fr);border-radius:4px;overflow:hidden;border:3px solid #4b3220;box-shadow:0 0 5px #6b4423,0 6px 24px rgba(0,0,0,.6)}
.cell{position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--side)/8*0.7);cursor:pointer;aspect-ratio:1/1}
.cell.light{background:#f0d9b5}.cell.dark{background:#b58863}.cell.sel{outline:3px solid #a855f7;outline-offset:-3px;background:#2d1f4e!important}
.piece{font-family:"Segoe UI Symbol",sans-serif;display:inline-block;line-height:1;user-select:none}
.piece-w{color:#fef9f0;-webkit-text-stroke:1.8px #1a0a00;filter:drop-shadow(0 2px 4px rgba(0,0,0,.75))}
.piece-b{color:#0f0800;-webkit-text-stroke:.5px rgba(255,255,255,.1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.evo2{filter:drop-shadow(0 5px #eab308) drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.evo3{filter:drop-shadow(0 10px #a855f7) drop-shadow(0 0 22px #a855f7)}
.level-mark{position:absolute;top:2px;right:3px;font-size:9px;font-weight:800}
.lm2{color:#eab308;text-shadow:0 0 5px #eab308}.lm3{color:#a855f7;text-shadow:0 0 8px #a855f7}
.player-row{flex-shrink:0;height:46px;display:flex;gap:8px;align-items:center}
.player-label{flex:1;height:100%;background:#0b0f19;border:1px solid #1e293b;border-radius:10px;display:flex;align-items:center;padding:0 12px;font-size:12px;font-weight:600}
.energy-badge{flex-shrink:0;width:58px;height:100%;background:#0b0f19;border:1px solid #1e293b;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:800;font-size:11px}
.panel{flex-shrink:0;height:86px;background:#0b0f19;border:1px solid #1e293b;border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.charge-row{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:#94a3b8}
.charge-track{width:100%;height:5px;background:#1e293b;border-radius:3px;overflow:hidden}
.panel-bottom{display:flex;align-items:center;gap:8px;flex:1}
.piece-label{flex:1;font-size:11px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.evolve-btn{flex-shrink:0;padding:6px 10px;border:none;border-radius:7px;font-weight:800;font-size:11px;cursor:pointer;background:#38bdf8;color:#030712}
.evolve-btn:disabled{background:#1e293b;color:#475569;cursor:not-allowed}
.turn-pill{flex-shrink:0;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700;background:#1e293b}
@keyframes lvlup{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="evolutions.js"></script>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;
const Chess=window.Chess;
const ICONS={w:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};

const PERSONALITIES = {
  human: { name: 'Umano', ai: false },
  necromante: { name: 'Necromante', ai: true, depth: 2 },
  cavaliere: { name: 'Cavaliere', ai: true, depth: 2 },
  berserker: { name: 'Berserker', ai: true, depth: 2 },
  imperatore: { name: 'Imperatore', ai: true, depth: 3 }
};

const AI = {
  pieceValues: { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 },
  evaluate(game, pd, pts, col, pers) {
    let s = 0;
    game.board().forEach((row,r)=>row.forEach((p,c)=>{
      if(!p)return;
      let base = AI.pieceValues[p.type]||0;
      if(pers==='necromante'&&p.type==='p')base+=100;
      if(pers==='cavaliere'&&p.type==='n')base+=280;
      const sq='abcdefgh'[c]+(8-r);
      const id=Object.keys(pd).find(k=>pd[k].color===p.color&&pd[k].type===p.type&&k.endsWith('_'+sq));
      const lv=id?pd[id].level:1;
      let v=base+(lv-1)*150;
      if(pers==='necromante'&&p.type==='p')v+=(lv-1)*80;
      const dist=Math.abs(r-3.5)+Math.abs(c-3.5);
      if(p.type!=='r'&&p.type!=='k')v+=(7-dist)*5;
      if(pers==='imperatore'&&p.type==='k'&&p.color===col&&dist<3)v-=150;
      s+=p.color===col?v:-v;
    }));
    const o=col==='w'?'b':'w';
    s+=(pts[col]>=2?80:pts[col]*20)-(pts[o]>=2?80:pts[o]*20);
    if(pers==='berserker')s+=100;
    return s;
  },
  getAllMoves(game,pd,sm,col,pts){
    const m=[];
    Object.entries(sm).forEach(([sq,id])=>{
      const p=game.get(sq);if(!p||p.color!==col)return;
      const d=pd[id];const canEvo=pts[col]>=2&&d.level<3&&window.EVOLUTIONS&&EVOLUTIONS[p.type];
      game.moves({square:sq,verbose:true}).forEach(mv=>{
        m.push({from:mv.from,to:mv.to,type:'normal',captured:mv.captured});
        if(canEvo)m.push({from:mv.from,to:mv.to,type:'normal',captured:mv.captured,evolveSq:sq});
      });
      if(EVOLUTIONS&&EVOLUTIONS[p.type]&&d){
        EVOLUTIONS[p.type].getAbilityMoves(sq,game,d.level,col).forEach(a=>{
          m.push({from:a.from,to:a.to,type:'ability',captured:game.get(a.to)?true:false});
          if(canEvo)m.push({from:a.from,to:a.to,type:'ability',captured:game.get(a.to)?true:false,evolveSq:sq});
        });
      }
    });
    return m.sort((a,b)=>(b.captured?1:0)-(a.captured?1:0));
  },
  simulate(game,pd,sm,pts,mv,turn){
    const ng=new Chess(game.fen());const npd={...pd};const nsm={...sm};const npts={...pts};
    if(mv.evolveSq){const id=nsm[mv.evolveSq];if(id){npd[id]={...npd[id],level:npd[id].level+1};npts[turn]-=2;}}
    let cap=null;
    if(mv.type==='ability'){const p=ng.get(mv.from);cap=ng.get(mv.to);ng.remove(mv.from);if(cap)ng.remove(mv.to);ng.put(p,mv.to);const t=ng.fen().split(' ');t[1]=t[1]==='w'?'b':'w';t[3]='-';ng.load(t.join(' '));}
    else{const r=ng.move({from:mv.from,to:mv.to,promotion:'q'});if(r?.captured)cap={type:r.captured};}
    const mid=nsm[mv.from];if(cap){const cs=mv.to;const cid=nsm[cs];delete npd[cid];delete nsm[cs];}
    const np=ng.get(mv.to);if(np&&npd[mid]&&np.type!==npd[mid].type){npd[mid]={...npd[mid],type:np.type,level:1};}
    delete nsm[mv.from];nsm[mv.to]=mid;
    let earn=1;if(cap)earn++;if(ng.in_check())earn++;if(np&&npd[mid]&&np.type!==pd[mid]?.type)earn+=2;
    npts[turn]+=earn;
    return{game:ng,pieceData:npd,squareMap:nsm,points:npts};
  },
  minimax(state,depth,alpha,beta,max,col,pers){
    if(depth===0||state.game.game_over())return AI.evaluate(state.game,state.pieceData,state.points,col,pers);
    const turn=state.game.turn();const moves=AI.getAllMoves(state.game,state.pieceData,state.squareMap,turn,state.points);
    if(max){let v=-Infinity;for(let m of moves.slice(0,18)){const ns=AI.simulate(state.game,state.pieceData,state.squareMap,state.points,m,turn);let ev=AI.minimax(ns,depth-1,alpha,beta,false,col,pers);if(pers==='berserker'&&m.captured)ev+=200;v=Math.max(v,ev);alpha=Math.max(alpha,ev);if(beta<=alpha)break;}return v;}
    else{let v=Infinity;for(let m of moves.slice(0,12)){const ns=AI.simulate(state.game,state.pieceData,state.squareMap,state.points,m,turn);const ev=AI.minimax(ns,depth-1,alpha,beta,true,col,pers);v=Math.min(v,ev);beta=Math.min(beta,ev);if(beta<=alpha)break;}return v;}
  },
  choose(game,pd,sm,pts,col,pers){
    const moves=AI.getAllMoves(game,pd,sm,col,pts);if(!moves.length)return null;
    const prof=PERSONALITIES[pers];let best=null,bs=-Infinity;
    for(let m of moves){const ns=AI.simulate(game,pd,sm,pts,m,col);let sc=AI.minimax(ns,prof.depth-1,-Infinity,Infinity,false,col,pers);if(pers==='berserker'&&m.captured)sc+=200;m.score=sc;if(sc>bs){bs=sc;best=m;}}
    const tops=moves.filter(m=>m.score>=bs-10);return tops[Math.floor(Math.random()*tops.length)];
  }
};

function buildInitial(game){const pd={},sm={};game.board().forEach((r,ri)=>r.forEach((c,ci)=>{if(c){const sq='abcdefgh'[ci]+(8-ri);const id=`${c.color}${c.type}_${sq}`;pd[id]={id,type:c.type,color:c.color,level:1};sm[sq]=id;}}));return{pd,sm};}

function App(){
  const[game,setGame]=useState(()=>new Chess());
  const[pd,setPd]=useState({});
  const[sm,setSm]=useState({});
  const[sel,setSel]=useState(null);
  const[std,setStd]=useState([]);
  const[abl,setAbl]=useState([]);
  const[lvl,setLvl]=useState(null);
  const[pts,setPts]=useState({w:0,b:0});
  const[wAI,setWAI]=useState('human');
  const[bAI,setBAI]=useState('necromante');
  const timer=useRef();

  useEffect(()=>{const s=buildInitial(game);setPd(s.pd);setSm(s.sm);},[]);

  const getMoves=useCallback(sq=>{const p=game.get(sq);if(!p)return{std:[],abl:[]};const std=game.moves({square:sq,verbose:true});const id=sm[sq];const d=pd[id];const evo=window.EVOLUTIONS&&EVOLUTIONS[p.type];const abl=evo&&d?EVOLUTIONS[p.type].getAbilityMoves(sq,game,d.level,p.color):[];return{std,abl};},[game,sm,pd]);

  const makeMove=useCallback((from,to,isAb)=>{const t=game.turn();let ng=new Chess(game.fen());let cap=null;if(isAb){const p=ng.get(from);cap=ng.get(to);ng.remove(from);if(cap)ng.remove(to);ng.put(p,to);const f=ng.fen().split(' ');f[1]=f[1]==='w'?'b':'w';f[3]='-';ng.load(f.join(' '));}else{const mv=ng.move({from,to,promotion:'q'});if(mv?.captured)cap={type:mv.captured};}const mid=sm[from];const nsm={...sm};const npd={...pd};if(cap){const cid=nsm[to];delete npd[cid];delete nsm[to];}const np=ng.get(to);const promo=np&&npd[mid]&&np.type!==npd[mid].type;if(promo){npd[mid]={...npd[mid],type:np.type,level:1};}delete nsm[from];nsm[to]=mid;let earn=1;if(cap)earn++;if(ng.in_check())earn++;if(promo)earn+=2;setPts(p=>({...p,[t]:p[t]+earn}));setGame(ng);setPd(npd);setSm(nsm);setSel(null);},[game,sm,pd]);

  const evolve=useCallback(sq=>{if(!sq)return;const t=game.turn();if(pts[t]<2)return;const id=sm[sq];const d=pd[id];if(!d||d.level>=3||!EVOLUTIONS[game.get(sq)?.type])return;setPd(p=>({...p,[id]:{...d,level:d.level+1}}));setPts(p=>({...p,[t]:p[t]-2}));setLvl(sq);setTimeout(()=>setLvl(null),800);},[game,sm,pd,pts]);

  useEffect(()=>{const turn=game.turn();const ai=turn==='w'?PERSONALITIES[wAI]:PERSONALITIES[bAI];if(!ai.ai||game.game_over())return;clearTimeout(timer.current);timer.current=setTimeout(()=>{const mv=AI.choose(game,pd,sm,pts,turn,turn==='w'?wAI:bAI);if(mv){if(mv.evolveSq){evolve(mv.evolveSq);setTimeout(()=>makeMove(mv.from,mv.to,mv.type==='ability'),400);}else{makeMove(mv.from,mv.to,mv.type==='ability');}}},700);},[game,pd,sm,pts,wAI,bAI,makeMove,evolve]);

  const board=game.board();const turn=game.turn();const selId=sel?sm[sel]:null;const selD=selId?pd[selId]:null;const selP=sel?game.get(sel):null;const canEvo=selD&&selD.level<3&&selP?.color===turn&&pts[turn]>=2&&EVOLUTIONS[selP?.type];

  const click=sq=>{const human=(turn==='w'&&!PERSONALITIES[wAI].ai)||(turn==='b'&&!PERSONALITIES[bAI].ai);if(!human)return;const pc=game.get(sq);if(sel){const s=std.find(m=>m.to===sq);const a=abl.find(m=>m.to===sq);if(s||a){makeMove(sel,sq,!!a);return;}if(pc?.color===turn){setSel(sq);const m=getMoves(sq);setStd(m.std);setAbl(m.abl);}else setSel(null);}else if(pc?.color===turn){setSel(sq);const m=getMoves(sq);setStd(m.std);setAbl(m.abl);}};

  return(
    <div className="app">
      <div className="top-bar">{Object.keys(PERSONALITIES).map(k=><button key={'w'+k} className={`mode-btn ${wAI===k?'active':''}`} onClick={()=>setWAI(k)}>{k}</button>)}</div>
      <div className="player-row"><div className="player-label">Nero: {PERSONALITIES[bAI].name}<div className="energy-badge"><span>⚡</span><span>{pts.b}</span></div></div>
      <div className="board-wrap"><div className="board">{board.map((r,ri)=>r.map((c,ci)=>{const sq='abcdefgh'[ci]+(8-ri);const selc=sel===sq;const isS=std.some(m=>m.to===sq);const isA=abl.some(m=>m.to===sq);const id=sm[sq];const d=id?pd[id]:null;const lv=d?.level||1;return<div key={sq} onClick={()=>click(sq)} className={`cell ${(ri+ci)%2?'light':'dark'} ${selc?'sel':''}`}>{(isS||isA)&&!c&&<div style={{position:'absolute',width:'28%',height:'28%',borderRadius:'50%',background:isA?'#f59e0b':'#22c55e'}}/>}{c&&<span className={`piece piece-${c.color} ${lv===2?'evo2':lv===3?'evo3':''}`} style={{transform:lvl===sq?'scale(1.4)':'scale(1)'}}>{ICONS[c.color][c.type]}</span>}{c&&lv>1&&<div className={`level-mark ${lv===2?'lm2':'lm3'}`}>{'●'.repeat(lv-1)}</div>}</div>}))}</div></div>
      <div className="player-row"><div className="player-label">Bianco: {PERSONALITIES[wAI].name}<div className="energy-badge"><span>⚡</span><span>{pts.w}</span></div></div></div>
      <div className="panel"><div className="charge-row"><span>{turn==='w'?'Bianco':'Nero'}</span><span>{pts[turn]}/2</span></div><div className="charge-track"><div style={{width:`${Math.min(pts[turn]/2*100,100)}%`,height:'100%',background:pts[turn]>=2?'#22c55e':'#38bdf8'}}/></div><div className="panel-bottom"><div className="piece-label">{selD?`Lv${selD.level}`:'-'}</div><button className="evolve-btn" disabled={!canEvo} onClick={()=>evolve(sel)}>EVOLVI</button><div className="turn-pill">{game.in_check()?'SCACCO':''}</div></div></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
