<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Chess RPG</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#060913}

#root{height:100%}

.app{
  height:100%;
  max-width:560px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  padding:8px;
  gap:6px;
  color:#f1f5f9;
  font-family:system-ui,sans-serif;
}

/* ── PLAYER ROW ── */
.player-row{
  flex-shrink:0;
  height:50px;
  display:flex;
  gap:8px;
  align-items:center;
}
.player-input{
  flex:1;height:100%;
  background:#0b0f19;border:1px solid #1e293b;
  color:#f1f5f9;padding:0 12px;
  border-radius:10px;font-size:13px;font-weight:600;
}
.player-input:focus{outline:none;border-color:#38bdf8}
.player-input::placeholder{color:#475569}

.energy-badge{
  flex-shrink:0;width:62px;height:100%;
  background:#0b0f19;border:1px solid #1e293b;
  border-radius:10px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:1px;font-weight:800;
}

/* ── BOARD WRAP ── */
.board-wrap{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:0; /* critical for flex shrink */
}

/* Board quadrata: prende il minore tra larghezza e altezza disponibile */
.board{
  --side: min(
    calc(100vw - 16px),
    calc(100vh - 50px*2 - 90px - 6px*4 - 16px)
  );
  width: var(--side);
  height: var(--side);
  display:grid;
  grid-template-columns:repeat(8,1fr);
  border-radius:4px;
  overflow:hidden;
  border:3px solid #4b3220;
  box-shadow:0 0 0 5px #6b4423, 0 6px 24px rgba(0,0,0,.6);
  flex-shrink:0;
}

.cell{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  /* font-size proporzionale al lato della board */
  font-size:calc(var(--side,320px) / 8 * 0.72);
  cursor:pointer;
  aspect-ratio:1/1;
}
.cell.light{background:#f0d9b5}
.cell.dark {background:#b58863}
.cell.sel  {outline:3px solid #a855f7;outline-offset:-3px;background:#2d1f4e!important}

/* ── PEZZI ── */
.piece{
  font-family:"Segoe UI Symbol","Noto Sans Symbols","Apple Color Emoji",sans-serif;
  display:inline-block;line-height:1;
  user-select:none;-webkit-user-select:none;
}
.piece-w{
  color:#fef9f0;
  -webkit-text-stroke:1.8px #1a0a00;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.75));
}
.piece-b{
  color:#0f0800;
  -webkit-text-stroke:0.5px rgba(255,255,255,.1);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));
}
.evo2{filter:drop-shadow(0 0 5px #eab308) drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.evo3{filter:drop-shadow(0 0 10px #a855f7) drop-shadow(0 0 22px #a855f7)}

.level-mark{
  position:absolute;top:2px;right:3px;
  font-size:9px;font-weight:800;
  pointer-events:none;line-height:1;
}
.lm2{color:#eab308;text-shadow:0 0 5px #eab308}
.lm3{color:#a855f7;text-shadow:0 0 8px #a855f7}

/* ── PANEL — ALTEZZA FISSA, no layout shift ── */
.panel{
  flex-shrink:0;
  height:90px;           /* ← FISSO: non cambia mai */
  background:#0b0f19;
  border:1px solid #1e293b;
  border-radius:12px;
  padding:8px 12px;
  display:flex;flex-direction:column;gap:7px;
}
.charge-row{
  display:flex;justify-content:space-between;
  font-size:11px;font-weight:800;color:#94a3b8;
}
.charge-track{
  width:100%;height:5px;
  background:#1e293b;border-radius:3px;overflow:hidden;
  margin-top:4px;
}
.panel-bottom{
  display:flex;align-items:center;gap:8px;flex:1;
}
.piece-label{flex:1;font-size:12px;min-width:0}

.evolve-btn{
  flex-shrink:0;
  padding:6px 10px;border:none;border-radius:7px;
  font-weight:800;font-size:11px;
  cursor:pointer;transition:all .2s;
  white-space:nowrap;
}
.turn-pill{
  flex-shrink:0;
  padding:5px 10px;border-radius:20px;
  font-size:12px;font-weight:700;background:#1e293b;
}

@keyframes lvlup{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="evolutions.js"></script>
<script type="text/babel">
const {useState,useEffect,useCallback}=React;
const Chess=window.Chess;

// Glifhi pieni per entrambi i colori — differenziati solo da CSS
const ICONS={
  w:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'},
  b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'},
};

function buildInitialState(game){
  const pieceData={},squareMap={};
  game.board().forEach((row,r)=>row.forEach((cell,c)=>{
    if(cell){
      const sq='abcdefgh'[c]+(8-r);
      const id=`${cell.color}${cell.type}_${sq}`;
      pieceData[id]={id,type:cell.type,color:cell.color,level:1};
      squareMap[sq]=id;
    }
  }));
  return{pieceData,squareMap};
}

function execAbilityMove(game,from,to){
  const piece=game.get(from);
  const captured=game.get(to)||null;
  const g=new Chess(game.fen());
  g.remove(from);if(captured)g.remove(to);g.put(piece,to);
  const parts=g.fen().split(' ');
  const wasW=parts[1]==='w';
  parts[1]=wasW?'b':'w';
  if(!wasW)parts[5]=String(parseInt(parts[5])+1);
  parts[3]='-';
  const ng=new Chess();ng.load(parts.join(' '));
  return{newGame:ng,capturedPiece:captured};
}

function App(){
  const[game,setGame]=useState(()=>new Chess());
  const[pieceData,setPieceData]=useState({});
  const[squareMap,setSquareMap]=useState({});
  const[sel,setSel]=useState(null);
  const[stdMoves,setStdMoves]=useState([]);
  const[abilMoves,setAbilMoves]=useState([]);
  const[levelUpSq,setLevelUpSq]=useState(null);
  const[points,setPoints]=useState({w:0,b:0});
  const[playerW,setPlayerW]=useState('');
  const[playerB,setPlayerB]=useState('');

  useEffect(()=>{
    const{pieceData:pd,squareMap:sm}=buildInitialState(game);
    setPieceData(pd);setSquareMap(sm);
  },[]);

  const getMovesFor=useCallback((sq)=>{
    const piece=game.get(sq);if(!piece)return{std:[],abil:[]};
    const std=game.moves({square:sq,verbose:true});
    const id=squareMap[sq];const data=pieceData[id];
    const evo=EVOLUTIONS[piece.type];
    const abil=(evo&&data)?evo.getAbilityMoves(sq,game,data.level,piece.color):[];
    return{std,abil};
  },[game,squareMap,pieceData]);

  const handleClick=useCallback((sq)=>{
    const piece=game.get(sq);
    if(sel){
      const stdMv=stdMoves.find(m=>m.to===sq);
      const abilMv=abilMoves.find(m=>m.to===sq);
      if(stdMv||abilMv){
        let newGame,capturedPiece=null;
        const movingId=squareMap[sel];
        const currentTurn=game.turn();
        if(abilMv){
          const res=execAbilityMove(game,sel,sq);
          newGame=res.newGame;capturedPiece=res.capturedPiece;
        }else{
          newGame=new Chess(game.fen());
          const mv=newGame.move({from:sel,to:sq,promotion:'q'});
          if(mv?.captured)capturedPiece={type:mv.captured};
          if(mv?.flags?.includes('e'))capturedPiece={type:'p',_sq:sq[0]+sel[1]};
        }
        const newSM={...squareMap};const newPD={...pieceData};
        if(capturedPiece){
          const capSq=capturedPiece._sq??sq;
          const cId=newSM[capSq];delete newPD[cId];delete newSM[capSq];
        }
        const newPieceOnSq=newGame.get(sq);
        let isPromotion=false;
        if(newPieceOnSq&&newPieceOnSq.type!==pieceData[movingId]?.type){
          newPD[movingId]={...newPD[movingId],type:newPieceOnSq.type,level:1};
          isPromotion=true;
        }
        delete newSM[sel];newSM[sq]=movingId;
        let pts=1;
        if(capturedPiece)pts+=1;
        if(newGame.in_check())pts+=1;
        if(isPromotion)pts+=2;
        setPoints(prev=>({...prev,[currentTurn]:prev[currentTurn]+pts}));
        setGame(newGame);setPieceData(newPD);setSquareMap(newSM);
        setSel(null);setStdMoves([]);setAbilMoves([]);
        return;
      }
      if(piece?.color===game.turn()){
        setSel(sq);const{std,abil}=getMovesFor(sq);
        setStdMoves(std);setAbilMoves(abil);return;
      }
      setSel(null);setStdMoves([]);setAbilMoves([]);return;
    }
    if(piece?.color===game.turn()){
      setSel(sq);const{std,abil}=getMovesFor(sq);
      setStdMoves(std);setAbilMoves(abil);
    }
  },[game,sel,stdMoves,abilMoves,squareMap,pieceData,getMovesFor]);

  const handleEvolve=useCallback(()=>{
    if(!sel)return;
    const turn=game.turn();
    const selPiece=game.get(sel);
    if(!selPiece||selPiece.color!==turn||points[turn]<2)return;
    const selId=squareMap[sel];const data=pieceData[selId];
    if(!data||data.level>=3)return;
    const newPD={...pieceData};
    newPD[selId]={...data,level:data.level+1};
    setPoints(prev=>({...prev,[turn]:prev[turn]-2}));
    setPieceData(newPD);
    setLevelUpSq(sel);setTimeout(()=>setLevelUpSq(null),1000);
    setSel(null);setStdMoves([]);setAbilMoves([]);
  },[sel,squareMap,pieceData,points,game]);

  const board=game.board();
  const turn=game.turn();
  const selId=sel?squareMap[sel]:null;
  const selData=selId?pieceData[selId]:null;
  const selPiece=sel?game.get(sel):null;
  const evo=selPiece?EVOLUTIONS[selPiece.type]:null;
  const lvlInfo=evo&&selData?evo.levels[selData.level-1]:null;
  const currentPts=points[turn];
  const chargePct=Math.min((currentPts/2)*100,100);
  // canEvolve: ha evo, ha pezzi, ha punti, è il suo turno, non è già al max
  const canEvolve=!!(evo&&selData&&selData.level<3&&selPiece?.color===turn&&currentPts>=2);
  // showEvolveBtn: mostra il bottone (ma forse invisibile) se ha evo e non è al max
  const showEvolveBtn=!!(evo&&selData&&selData.level<3);

  const EnergyBadge=({color,pts})=>(
    <div className="energy-badge" style={{
      borderLeft:`3px solid ${color==='w'?'#38bdf8':'#f43f5e'}`,
      color:pts>=2?'#22c55e':'#94a3b8'
    }}>
      <span style={{fontSize:18,lineHeight:1}}>⚡</span>
      <span style={{fontSize:12}}>{pts} PT</span>
    </div>
  );

  return(
    <div className="app">

      {/* ── Giocatore Nero (top) ── */}
      <div className="player-row">
        <input className="player-input" type="text"
          placeholder="Giocatore Nero..."
          value={playerB} onChange={e=>setPlayerB(e.target.value)}
          style={{borderLeft:'3px solid #f43f5e'}}/>
        <EnergyBadge color="b" pts={points.b}/>
      </div>

      {/* ── Scacchiera ── */}
      <div className="board-wrap">
        <div className="board">
          {board.map((row,r)=>row.map((cell,c)=>{
            const sq='abcdefgh'[c]+(8-r);
            const isLight=(r+c)%2===1;
            const isSel=sel===sq;
            const isStd=stdMoves.some(m=>m.to===sq);
            const isAbil=abilMoves.some(m=>m.to===sq);
            const isAny=isStd||isAbil;
            const id=squareMap[sq];
            const data=id?pieceData[id]:null;
            const level=data?.level??1;
            const isLvlUp=levelUpSq===sq;
            const evoClass=level===2?'evo2':level===3?'evo3':'';

            return(
              <div key={sq} onClick={()=>handleClick(sq)}
                className={`cell ${isLight?'light':'dark'} ${isSel?'sel':''}`}>

                {isAny&&!cell&&(
                  <div style={{position:'absolute',width:'30%',height:'30%',
                    borderRadius:'50%',
                    background:isAbil?'#f59e0b':'#22c55e',
                    boxShadow:`0 0 10px ${isAbil?'#f59e0b':'#22c55e'}`}}/>
                )}
                {isAny&&cell&&(
                  <div style={{position:'absolute',inset:0,
                    border:`3px solid ${isAbil?'#f59e0b':'#f43f5e'}`,
                    borderRadius:'3px'}}/>
                )}

                {cell&&(
                  <span className={`piece piece-${cell.color} ${evoClass}`}
                    style={{
                      transform:isLvlUp?'scale(1.5)':'scale(1)',
                      transition:'transform .15s',
                      animation:isLvlUp?'lvlup 1s ease':undefined,
                    }}>
                    {ICONS[cell.color][cell.type]}
                  </span>
                )}

                {cell&&EVOLUTIONS[cell.type]&&level>1&&(
                  <>
                    <div style={{position:'absolute',inset:'2px',
                      border:`2px solid ${level===2?'#eab308':'#a855f7'}`,
                      borderRadius:'2px',pointerEvents:'none'}}/>
                    <div className={`level-mark ${level===2?'lm2':'lm3'}`}>
                      {'●'.repeat(level-1)}
                    </div>
                  </>
                )}
              </div>
            );
          }))}
        </div>
      </div>

      {/* ── Giocatore Bianco (bottom) ── */}
      <div className="player-row">
        <input className="player-input" type="text"
          placeholder="Giocatore Bianco..."
          value={playerW} onChange={e=>setPlayerW(e.target.value)}
          style={{borderLeft:'3px solid #38bdf8'}}/>
        <EnergyBadge color="w" pts={points.w}/>
      </div>

      {/* ── Panel — altezza FISSA 90px ── */}
      <div className="panel">

        {/* Barra carica */}
        <div>
          <div className="charge-row">
            <span>🔋 CARICA ({turn==='w'?'BIANCO':'NERO'})</span>
            <span style={{color:currentPts>=2?'#22c55e':'#38bdf8'}}>
              {currentPts}/2{currentPts>=2?' • PRONTO!':''}
            </span>
          </div>
          <div className="charge-track">
            <div style={{
              width:`${chargePct}%`,height:'100%',
              background:currentPts>=2?'#22c55e':'#38bdf8',
              boxShadow:currentPts>=2?'0 0 8px #22c55e':'none',
              transition:'width .3s',borderRadius:'3px'
            }}/>
          </div>
        </div>

        {/* Riga info — altezza fissa, evolve button SEMPRE nello spazio ── */}
        <div className="panel-bottom">

          <div className="piece-label">
            {selData&&evo?(
              <span style={{fontWeight:700,fontSize:13,color:lvlInfo.color,
                display:'inline-flex',alignItems:'center',gap:5}}>
                {/* QUI C'È LA CORREZIONE: calcoliamo la classe in base a selData.level */}
                <span className={selData.level === 2 ? 'evo2' : selData.level === 3 ? 'evo3' : ''}>
                  {ICONS[selPiece.color][selPiece.type]}
                </span>
                {lvlInfo.name} Lv.{selData.level}
                {abilMoves.length>0&&
                  <span style={{color:'#f59e0b',fontSize:10,marginLeft:2}}>
                    🟡{abilMoves.length}
                  </span>
                }
              </span>
            ):(
              <span style={{color:'#475569',fontSize:12}}>Seleziona un pezzo</span>
            )}
          </div>

          <button className="evolve-btn" onClick={handleEvolve}
            style={{
              visibility: showEvolveBtn ? 'visible' : 'hidden',
              background: canEvolve ? (lvlInfo?.color||'#38bdf8') : '#1e293b',
              color: canEvolve ? '#030712' : '#475569',
              boxShadow: canEvolve ? `0 0 10px ${lvlInfo?.color}` : 'none',
              cursor: canEvolve ? 'pointer' : 'default',
            }}>
            ⚡ {(canEvolve&&evo)?`→ ${evo.levels[selData.level].name}`:'EVOLVI'} −2PT
          </button>

          <div className="turn-pill"
            style={{color:turn==='w'?'#38bdf8':'#f43f5e'}}>
            {turn==='w'?'⬜':'⬛'} {turn==='w'?'Bianco':'Nero'}
          </div>
        </div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
