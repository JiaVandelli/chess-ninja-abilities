<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Chess RPG - AI Boss Battles</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#060913}
#root{height:100%}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:8px;gap:6px;color:#f1f5f9;font-family:system-ui,sans-serif}
.top-bar{flex-shrink:0;height:44px;display:flex;gap:6px;align-items:center}
.mode-btn{flex:1;height:100%;background:#0b0f19;border:1px solid #1e293b;color:#94a3b8;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer}
.mode-btn.active{background:#38bdf8;color:#030712;border-color:#38bdf8}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.board{--side:min(calc(100vw - 16px),calc(100vh - 44px - 50px*2 - 90px - 24px));width:var(--side);height:var(--side);display:grid;grid-template-columns:repeat(8,1fr);border-radius:4px;overflow:hidden;border:3px solid #4b3220;box-shadow:0 0 0 5px #6b4423,0 6px 24px rgba(0,0,0,.6)}
.cell{position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--side,320px)/8*0.72);cursor:pointer;aspect-ratio:1/1}
.cell.light{background:#f0d9b5}.cell.dark{background:#b58863}.cell.sel{outline:3px solid #a855f7;outline-offset:-3px;background:#2d1f4e!important}
.piece{font-family:"Segoe UI Symbol","Noto Sans Symbols",sans-serif;display:inline-block;line-height:1;user-select:none}
.piece-w{color:#fef9f0;-webkit-text-stroke:1.8px #1a0a00;filter:drop-shadow(0 2px 4px rgba(0,0,0,.75))}
.piece-b{color:#0f0800;-webkit-text-stroke:.5px rgba(255,255,255,.1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.evo2{filter:drop-shadow(0 0 5px #eab308) drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.evo3{filter:drop-shadow(0 0 10px #a855f7) drop-shadow(0 0 22px #a855f7)}
.level-mark{position:absolute;top:2px;right:3px;font-size:9px;font-weight:800;pointer-events:none}
.lm2{color:#eab308;text-shadow:0 0 5px #eab308}.lm3{color:#a855f7;text-shadow:0 0 8px #a855f7}
.player-row{flex-shrink:0;height:50px;display:flex;gap:8px;align-items:center}
.player-label{flex:1;height:100%;background:#0b0f19;border:1px solid #1e293b;border-radius:10px;display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:600}
.energy-badge{flex-shrink:0;width:62px;height:100%;background:#0b0f19;border:1px solid #1e293b;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:800}
.panel{flex-shrink:0;height:90px;background:#0b0f19;border:1px solid #1e293b;border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:7px}
.charge-row{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:#94a3b8}
.charge-track{width:100%;height:5px;background:#1e293b;border-radius:3px;overflow:hidden;margin-top:4px}
.panel-bottom{display:flex;align-items:center;gap:8px;flex:1}
.piece-label{flex:1;font-size:12px;min-width:0}
.evolve-btn{flex-shrink:0;padding:6px 10px;border:none;border-radius:7px;font-weight:800;font-size:11px;cursor:pointer;white-space:nowrap}
.turn-pill{flex-shrink:0;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700;background:#1e293b}
@keyframes lvlup{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="evolutions.js"></script>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;
const Chess=window.Chess;
const ICONS={w:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};

// ── BOSS PROFILES ──
const PERSONALITIES = {
  human: { name: 'Umano', ai: false, depth: 0 },
  necromante: { name: 'Necromante', ai: true, depth: 2, desc: 'Buff pedoni, evolve molto' },
  cavaliere: { name: 'Cavaliere', ai: true, depth: 2, desc: 'Cavalli iper-aggressivi' },
  berserker: { name: 'Berserker', ai: true, depth: 2, desc: 'Sacrifica per uccidere' },
  imperatore: { name: 'Imperatore', ai: true, depth: 3, desc: 'Difesa centrale, 3 Mosse' }
};

// ── AI ENGINE: THE BOSSES ──
const AI = {
  pieceValues: { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 },

  evaluate(game, pieceData, points, color, personality) {
    let score = 0;
    
    game.board().forEach((row, r) => row.forEach((p, c) => {
      if (p) {
        let base = AI.pieceValues[p.type] || 0;
        
        // Asimmetria Boss: Valori Base
        if (personality === 'necromante' && p.type === 'p') base += 100;
        if (personality === 'cavaliere' && p.type === 'n') base += 280;

        const sq = 'abcdefgh'[c] + (8 - r);
        const id = Object.keys(pieceData).find(k => pieceData[k].color === p.color && pieceData[k].type === p.type && k.endsWith('_' + sq));
        const lvl = id ? pieceData[id].level : 1;
        
        let val = base + (lvl - 1) * 150;
        
        // Asimmetria Boss: Bonus Livelli
        if (personality === 'necromante' && p.type === 'p') val += (lvl - 1) * 80;

        // Valutazione Posizionale Standard
        const distToCenter = Math.abs(r - 3.5) + Math.abs(c - 3.5);
        if (p.type !== 'r' && p.type !== 'k') val += (7 - distToCenter) * 5;

        // Asimmetria Boss: Difesa Imperatore
        if (personality === 'imperatore' && p.type === 'k' && p.color === color) {
          if (distToCenter < 3) val -= 150; // Re al centro = Male
        }

        score += p.color === color ? val : -val;
      }
    }));
    
    // Asimmetria Boss: Berserker se ne frega del danno, valuta solo i suoi pezzi abbassati (gioca YOLO)
    if (personality === 'berserker') score += 100; 

    // Valutazione Energia
    const myPts = points[color];
    const oppPts = points[color === 'w' ? 'b' : 'w'];
    score += (myPts >= 2 ? 80 : myPts * 20);
    score -= (oppPts >= 2 ? 80 : oppPts * 20);
    
    return score;
  },

  getAllMoves(game, pieceData, squareMap, color, points) {
    const moves = [];
    Object.entries(squareMap).forEach(([sq, id]) => {
      const piece = game.get(sq);
      if (!piece || piece.color !== color) return;
      const data = pieceData[id];
      const canEvolve = points[color] >= 2 && data.level < 3 && EVOLUTIONS[piece.type];

      // Standard & Abilities
      const legalMoves = game.moves({ square: sq, verbose: true });
      let abilMoves = [];
      if (EVOLUTIONS[piece.type] && data) {
        abilMoves = EVOLUTIONS[piece.type].getAbilityMoves(sq, game, data.level, color);
      }

      // Popola l'array, sdoppiando le mosse se c'è un'evoluzione disponibile
      const addMoveVariants = (m, type) => {
        moves.push({ from: m.from, to: m.to, type, captured: m.captured || null });
        if (canEvolve) {
          moves.push({ from: m.from, to: m.to, type, captured: m.captured || null, evolveSq: m.from });
        }
      };

      legalMoves.forEach(m => addMoveVariants(m, 'normal'));
      abilMoves.forEach(a => addMoveVariants({ from: a.from, to: a.to, captured: game.get(a.to) ? true : false }, 'ability'));
    });

    // Move Ordering: Ottimizzazione massiccia per il Minimax (catture ed evoluzioni prima)
    moves.sort((a, b) => {
      let scoreA = (a.captured ? 10 : 0) + (a.evolveSq ? 5 : 0) + (a.type === 'ability' ? 3 : 0);
      let scoreB = (b.captured ? 10 : 0) + (b.evolveSq ? 5 : 0) + (b.type === 'ability' ? 3 : 0);
      return scoreB - scoreA;
    });

    return moves;
  },

  // Nuova simulazione: Legale al 100% (Arrocco, En Passant, Evoluzioni incluse)
  simulateFullState(game, pd, sm, pts, move, turn) {
    let ng = new Chess(game.fen());
    let npd = { ...pd };
    let nsm = { ...sm };
    let npts = { ...pts };

    // 1. Simula Evoluzione
    if (move.evolveSq) {
      const id = nsm[move.evolveSq];
      if (id) {
        npd[id] = { ...npd[id], level: npd[id].level + 1 };
        npts[turn] -= 2;
      }
    }

    let capturedPiece = null;
    let isPromo = false;

    // 2. Esegui Mossa
    if (move.type === 'ability') {
      const p = ng.get(move.from);
      capturedPiece = ng.get(move.to) || null;
      ng.remove(move.from);
      if (capturedPiece) ng.remove(move.to);
      ng.put(p, move.to);
      
      let tokens = ng.fen().split(' ');
      tokens[1] = tokens[1] === 'w' ? 'b' : 'w';
      tokens[3] = '-';
      ng.load(tokens.join(' '));
    } else {
      const res = ng.move({ from: move.from, to: move.to, promotion: 'q' });
      if (res?.captured) capturedPiece = { type: res.captured };
      if (res?.flags?.includes('e')) capturedPiece = { type: 'p', _sq: move.to[0] + move.from[1] };
    }

    // 3. Aggiorna Dati RPG
    const movingId = nsm[move.from];
    if (capturedPiece) {
      const capSq = capturedPiece._sq ?? move.to;
      const cId = nsm[capSq];
      delete npd[cId];
      delete nsm[capSq];
    }
    const newPiece = ng.get(move.to);
    if (newPiece && movingId && npd[movingId] && newPiece.type !== npd[movingId].type) {
      npd[movingId] = { ...npd[movingId], type: newPiece.type, level: 1 };
      isPromo = true;
    }
    delete nsm[move.from];
    nsm[move.to] = movingId;

    let earned = 1;
    if (capturedPiece) earned++;
    if (ng.in_check()) earned++;
    if (isPromo) earned += 2;
    npts[turn] += earned;

    return { game: ng, pieceData: npd, squareMap: nsm, points: npts };
  },

  // Minimax Ricorsivo con Alpha-Beta Pruning
  minimax(state, depth, alpha, beta, isMaximizing, aiColor, personalityObj) {
    if (depth === 0 || state.game.game_over()) {
      return AI.evaluate(state.game, state.pieceData, state.points, aiColor, personalityObj);
    }
    const turn = state.game.turn();
    const moves = AI.getAllMoves(state.game, state.pieceData, state.squareMap, turn, state.points);

    if (isMaximizing) {
      let maxEval = -Infinity;
      for (let m of moves) {
        const nextState = AI.simulateFullState(state.game, state.pieceData, state.squareMap, state.points, m, turn);
        let ev = AI.minimax(nextState, depth - 1, alpha, beta, false, aiColor, personalityObj);
        
        // Berserker Bonus in fase di massimizzazione
        if (personalityObj === 'berserker' && m.captured) ev += 200;

        maxEval = Math.max(maxEval, ev);
        alpha = Math.max(alpha, ev);
        if (beta <= alpha) break;
      }
      return maxEval;
    } else {
      let minEval = Infinity;
      // Per ottimizzare il browser, l'avversario calcola meno diramazioni a depth alte
      const limit = depth > 1 ? 15 : moves.length; 
      for (let i = 0; i < Math.min(moves.length, limit); i++) {
        const m = moves[i];
        const nextState = AI.simulateFullState(state.game, state.pieceData, state.squareMap, state.points, m, turn);
        const ev = AI.minimax(nextState, depth - 1, alpha, beta, true, aiColor, personalityObj);
        minEval = Math.min(minEval, ev);
        beta = Math.min(beta, ev);
        if (beta <= alpha) break;
      }
      return minEval;
    }
  },

  chooseMove(game, pieceData, squareMap, points, color, personalityId) {
    const turn = game.turn();
    const moves = AI.getAllMoves(game, pieceData, squareMap, turn, points);
    if (moves.length === 0) return null;

    const profile = PERSONALITIES[personalityId];
    let bestMove = null;
    let bestScore = -Infinity;

    for (let m of moves) {
      const nextState = AI.simulateFullState(game, pieceData, squareMap, points, m, turn);
      let score = AI.minimax(nextState, profile.depth - 1, -Infinity, Infinity, false, color, personalityId);
      
      // Bonus finale per le kill del Berserker alla radice
      if (personalityId === 'berserker' && m.captured) score += 200;

      m.score = score;
      if (score > bestScore) {
        bestScore = score;
        bestMove = m;
      }
    }

    const topMoves = moves.filter(m => m.score >= bestScore - 10);
    return topMoves[Math.floor(Math.random() * topMoves.length)];
  }
};

function buildInitialState(game){
  const pieceData={},squareMap={};
  game.board().forEach((row,r)=>row.forEach((cell,c)=>{
    if(cell){
      const sq='abcdefgh'[c]+(8-r);
      const id=`${cell.color}${cell.type}_${sq}`;
      pieceData[id]={id,type:cell.type,color:cell.color,level:1};
      squareMap[sq]=id;
    }
  }));
  return{pieceData,squareMap};
}

function execAbilityMove(game,from,to){
  const piece=game.get(from);
  const captured=game.get(to)||null;
  const g=new Chess(game.fen());
  g.remove(from);if(captured)g.remove(to);g.put(piece,to);
  const parts=g.fen().split(' ');
  const wasW=parts[1]==='w';parts[1]=wasW?'b':'w';
  if(!wasW)parts[5]=String(parseInt(parts[5])+1);
  parts[3]='-';
  const ng=new Chess();ng.load(parts.join(' '));
  return{newGame:ng,capturedPiece:captured};
}

function App(){
  const[game,setGame]=useState(()=>new Chess());
  const[pieceData,setPieceData]=useState({});
  const[squareMap,setSquareMap]=useState({});
  const[sel,setSel]=useState(null);
  const[stdMoves,setStdMoves]=useState([]);
  const[abilMoves,setAbilMoves]=useState([]);
  const[levelUpSq,setLevelUpSq]=useState(null);
  const[points,setPoints]=useState({w:0,b:0});
  const[whiteAI,setWhiteAI]=useState('human');
  const[blackAI,setBlackAI]=useState('necromante');
  const aiTimer = useRef(null);

  useEffect(()=>{
    const{pieceData:pd,squareMap:sm}=buildInitialState(game);
    setPieceData(pd);setSquareMap(sm);
  },[]);

  const getMovesFor=useCallback((sq)=>{
    const piece=game.get(sq);if(!piece)return{std:[],abil:[]};
    const std=game.moves({square:sq,verbose:true});
    const id=squareMap[sq];const data=pieceData[id];
    const evo=EVOLUTIONS[piece.type];
    const abil=(evo&&data)?evo.getAbilityMoves(sq,game,data.level,piece.color):[];
    return{std,abil};
  },[game,squareMap,pieceData]);

  const makeMove = useCallback((from,to,isAbility=false)=>{
    const currentTurn=game.turn();
    let newGame,capturedPiece=null;
    if(isAbility){
      const res=execAbilityMove(game,from,to);
      newGame=res.newGame;capturedPiece=res.capturedPiece;
    }else{
      newGame=new Chess(game.fen());
      const mv=newGame.move({from,to,promotion:'q'});
      if(mv?.captured)capturedPiece={type:mv.captured};
      if(mv?.flags?.includes('e'))capturedPiece={type:'p',_sq:to[0]+from[1]};
    }
    const movingId=squareMap[from];
    const newSM={...squareMap};const newPD={...pieceData};
    if(capturedPiece){
      const capSq=capturedPiece._sq??to;
      const cId=newSM[capSq];delete newPD[cId];delete newSM[capSq];
    }
    const newPiece=newGame.get(to);
    let isPromo=false;
    if(newPiece&&newPiece.type!==pieceData[movingId]?.type){
      newPD[movingId]={...newPD[movingId],type:newPiece.type,level:1};isPromo=true;
    }
    delete newSM[from];newSM[to]=movingId;
    let pts=1;if(capturedPiece)pts+=1;if(newGame.in_check())pts+=1;if(isPromo)pts+=2;
    setPoints(p=>({...p,[currentTurn]:p[currentTurn]+pts}));
    setGame(newGame);setPieceData(newPD);setSquareMap(newSM);
    setSel(null);setStdMoves([]);setAbilMoves([]);
  },[game,squareMap,pieceData]);

  const handleEvolveSq=useCallback((sq)=>{
    if(!sq)return;
    const turn=game.turn();const p=game.get(sq);
    if(!p||p.color!==turn)return;
    const id=squareMap[sq];const data=pieceData[id];
    if(!data||data.level>=3)return;
    
    setPieceData(prev => {
        const next = {...prev};
        next[id] = {...data, level: data.level + 1};
        return next;
    });
    setPoints(prev=>({...prev,[turn]:prev[turn]-2}));
    setLevelUpSq(sq);setTimeout(()=>setLevelUpSq(null),900);
    setSel(null);setStdMoves([]);setAbilMoves([]);
  },[game,squareMap,pieceData]);

  const handleClick=useCallback((sq)=>{
    const turn=game.turn();
    const isHuman = (turn==='w'?!PERSONALITIES[whiteAI].ai :!PERSONALITIES[blackAI].ai);
    if(!isHuman) return;
    const piece=game.get(sq);
    if(sel){
      const stdMv=stdMoves.find(m=>m.to===sq);
      const abilMv=abilMoves.find(m=>m.to===sq);
      if(stdMv||abilMv){makeMove(sel,sq,!!abilMv);return;}
      if(piece?.color===turn){setSel(sq);const{std,abil}=getMovesFor(sq);setStdMoves(std);setAbilMoves(abil);return;}
      setSel(null);setStdMoves([]);setAbilMoves([]);return;
    }
    if(piece?.color===turn){setSel(sq);const{std,abil}=getMovesFor(sq);setStdMoves(std);setAbilMoves(abil);}
  },[game,sel,stdMoves,abilMoves,getMovesFor,makeMove,whiteAI,blackAI]);

  // AI TURN
  useEffect(()=>{
    const turn=game.turn();
    const aiType = turn==='w'? whiteAI : blackAI;
    const personality = PERSONALITIES[aiType];
    if(!personality.ai || game.game_over()) return;
    
    clearTimeout(aiTimer.current);
    aiTimer.current = setTimeout(()=>{
      const move = AI.chooseMove(game, pieceData, squareMap, points, turn, aiType);
      if(move){
        if(move.evolveSq){
           setSel(move.evolveSq);
           handleEvolveSq(move.evolveSq);
           // Attende l'animazione di level up prima di muovere
           setTimeout(()=> makeMove(move.from, move.to, move.type==='ability'), 600);
        } else {
           makeMove(move.from, move.to, move.type==='ability');
        }
      }
    }, 700 + Math.random()*300);
  },[game,pieceData,squareMap,points,whiteAI,blackAI,makeMove,handleEvolveSq]);

  const board=game.board();const turn=game.turn();
  const selId=sel?squareMap[sel]:null;const selData=selId?pieceData[selId]:null;
  const selPiece=sel?game.get(sel):null;const evo=selPiece?EVOLUTIONS[selPiece.type]:null;
  const lvlInfo=evo&&selData?evo.levels[selData.level-1]:null;
  const currentPts=points[turn];
  const chargePct=Math.min((currentPts/2)*100,100);
  const canEvolve=!!(evo&&selData&&selData.level<3&&selPiece?.color===turn&&currentPts>=2);
  const showEvolveBtn=!!(evo&&selData&&selData.level<3);

  return(
    <div className="app">
      <div className="top-bar">
        {Object.entries(PERSONALITIES).map(([k,v])=>(
          <button key={'w'+k} className={`mode-btn ${whiteAI===k?'active':''}`} onClick={()=>setWhiteAI(k)} title={v.desc}>W:{v.name}</button>
        ))}
      </div>

      <div className="player-row">
        <div className="player-label" style={{borderLeft:'3px solid #f43f5e'}}>Nero: {PERSONALITIES[blackAI].name}</div>
        <div className="energy-badge" style={{borderLeft:'3px solid #f43f5e',color:points.b>=2?'#22c55e':'#94a3b8'}}>
          <span style={{fontSize:18}}>⚡</span><span style={{fontSize:12}}>{points.b}</span>
        </div>
      </div>

      <div className="board-wrap">
        <div className="board">
          {board.map((row,r)=>row.map((cell,c)=>{
            const sq='abcdefgh'[c]+(8-r);const isLight=(r+c)%2===1;const isSel=sel===sq;
            const isStd=stdMoves.some(m=>m.to===sq);const isAbil=abilMoves.some(m=>m.to===sq);
            const isAny=isStd||isAbil;const id=squareMap[sq];const data=id?pieceData[id]:null;
            const level=data?.level??1;const isLvlUp=levelUpSq===sq;const evoClass=level===2?'evo2':level===3?'evo3':'';
            return(
              <div key={sq} onClick={()=>handleClick(sq)} className={`cell ${isLight?'light':'dark'} ${isSel?'sel':''}`}>
                {isAny&&!cell&&(<div style={{position:'absolute',width:'30%',height:'30%',borderRadius:'50%',background:isAbil?'#f59e0b':'#22c55e',boxShadow:`0 0 10px ${isAbil?'#f59e0b':'#22c55e'}`}}/>)}
                {isAny&&cell&&(<div style={{position:'absolute',inset:0,border:`3px solid ${isAbil?'#f59e0b':'#f43f5e'}`,borderRadius:'3px'}}/>)}
                {cell&&(<span className={`piece piece-${cell.color} ${evoClass}`} style={{transform:isLvlUp?'scale(1.5)':'scale(1)',transition:'transform.15s',animation:isLvlUp?'lvlup 1s ease':undefined}}>{ICONS[cell.color][cell.type]}</span>)}
                {cell&&EVOLUTIONS[cell.type]&&level>1&&(<><div style={{position:'absolute',inset:'2px',border:`2px solid ${level===2?'#eab308':'#a855f7'}`,borderRadius:'2px',pointerEvents:'none'}}/><div className={`level-mark ${level===2?'lm2':'lm3'}`}>{'●'.repeat(level-1)}</div></>)}
              </div>
            );
          }))}
        </div>
      </div>

      <div className="player-row">
        <div className="player-label" style={{borderLeft:'3px solid #38bdf8'}}>Bianco: {PERSONALITIES[whiteAI].name}</div>
        <div className="energy-badge" style={{borderLeft:'3px solid #38bdf8',color:points.w>=2?'#22c55e':'#94a3b8'}}>
          <span style={{fontSize:18}}>⚡</span><span style={{fontSize:12}}>{points.w}</span>
        </div>
      </div>

      <div className="panel">
        <div>
          <div className="charge-row"><span>🔋 {turn==='w'?'BIANCO':'NERO'}</span><span style={{color:currentPts>=2?'#22c55e':'#38bdf8'}}>{currentPts}/2{currentPts>=2?' • PRONTO':''}</span></div>
          <div className="charge-track"><div style={{width:`${chargePct}%`,height:'100%',background:currentPts>=2?'#22c55e':'#38bdf8',transition:'width.3s'}}/></div>
        </div>
        <div className="panel-bottom">
          <div className="piece-label">{selData&&evo?(<span style={{fontWeight:700,color:lvlInfo.color}}>{ICONS[selPiece.color][selPiece.type]} {lvlInfo.name} Lv.{selData.level}{abilMoves.length>0&&<span style={{color:'#f59e0b',marginLeft:4}}>🟡{abilMoves.length}</span>}</span>):(<span style={{color:'#475569'}}>Seleziona</span>)}</div>
          <button className="evolve-btn" onClick={()=>handleEvolveSq(sel)} style={{visibility:showEvolveBtn?'visible':'hidden',background:canEvolve?(lvlInfo?.color||'#38bdf8'):'#1e293b',color:canEvolve?'#030712':'#475569',cursor:canEvolve?'pointer':'default'}}>⚡ EVOLVI</button>
          <div className="turn-pill" style={{color:turn==='w'?'#38bdf8':'#f43f5e'}}>{turn==='w'?'⬜':'⬛'}</div>
        </div>
      </div>

      <div className="top-bar" style={{height:'36px'}}>
        {Object.entries(PERSONALITIES).map(([k,v])=>(
          <button key={'b'+k} className={`mode-btn ${blackAI===k?'active':''}`} onClick={()=>setBlackAI(k)} title={v.desc}>B:{v.name}</button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
