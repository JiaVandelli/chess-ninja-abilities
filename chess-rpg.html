<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Chess RPG – L'Esercito dell'Anima v4.3 (Final)</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;margin:0;overflow:hidden;background:#060913}
    #root{height:100%}
    .app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:8px;gap:6px;color:#f1f5f9;font-family:system-ui,sans-serif}
    .top-bar{flex-shrink:0;height:40px;display:flex;gap:6px;align-items:center;justify-content:flex-end}
    .flip-btn{padding:0 12px;height:100%;background:#1e293b;border:none;color:#94a3b8;border-radius:8px;font-size:13px;cursor:pointer}
    .prestige-badge{flex-shrink:0;padding:0 12px;height:100%;background:#1e293b;border:none;color:#eab308;border-radius:8px;font-size:12px;display:flex;align-items:center;gap:4px;font-weight:700}
    .player-row{flex-shrink:0;height:48px;display:flex;gap:8px;align-items:center}
    .player-label{flex:1;height:100%;background:#0b0f19;border:1px solid #1e293b;border-radius:10px;display:flex;flex-direction:column;justify-content:center;padding:0 12px;overflow:hidden}
    .player-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px}
    .last-move-hint{font-size:10px;color:#475569;margin-top:1px}
    .energy-badge{flex-shrink:0;width:58px;height:100%;background:#0b0f19;border:1px solid #1e293b;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900}
    .board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
    .board{--side:min(calc(100vw - 16px),calc(100vh - 280px));width:var(--side);height:var(--side);display:grid;grid-template-columns:repeat(8,1fr);border-radius:4px;overflow:hidden;border:3px solid #4b3220;box-shadow:0 0 0 5px #6b4423,0 6px 24px rgba(0,0,0,.6)}
    .cell{position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--side)/8*.72);cursor:pointer;aspect-ratio:1/1}
    .cell.light{background:#f0d9b5}.cell.dark{background:#b58863}
    .cell.last-from.light,.cell.last-to.light{background:#f6f669}
    .cell.last-from.dark,.cell.last-to.dark{background:#c8b400}
    .cell.sel{outline:3px solid #a855f7;outline-offset:-3px;background:#2d1f4e!important}
    .cell.aura-cell{box-shadow:inset 0 0 12px rgba(239,68,68,0.7)}
    .cell.stunned-piece{box-shadow:inset 0 0 12px rgba(99,102,241,0.8)}
    .cell.immune-highlight{outline:2px solid #fbbf24;outline-offset:-2px}
    .cell.ghost-march-ally{box-shadow:inset 0 0 15px #22c55e;background:rgba(34,197,94,.2)!important}
    .piece{font-family:"Segoe UI Symbol","Noto Sans Symbols",sans-serif;line-height:1;user-select:none;z-index:2}
    .piece-w{color:#fff;text-shadow:0 0 0 #000,0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.7))}
    .piece-b{color:#000;text-shadow:0 0 0 #fff,0 1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff,0 -1px 0 #fff;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.5))}
    .evo2{filter:drop-shadow(0 0 4px #a855f7)!important}
    .panel{flex-shrink:0;min-height:90px;background:#0b0f19;border:1px solid #1e293b;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:5px}
    .charge-row{display:flex;justify-content:space-between;font-size:10px;font-weight:800;color:#94a3b8}
    .charge-track{width:100%;height:4px;background:#1e293b;border-radius:2px;overflow:hidden;margin-top:2px}
    .panel-bottom{display:flex;align-items:center;gap:6px}
    .piece-label{flex:1;font-size:11px;min-width:0}
    .turn-pill{flex-shrink:0;padding:3px 8px;border-radius:16px;font-size:11px;font-weight:700;background:#1e293b}
    .btn-row{display:flex;gap:4px;flex-wrap:wrap}
    .ability-btn{flex:1;min-width:80px;padding:5px 6px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid #334155;background:#0f172a;color:#cbd5e1;text-align:center}
    .ability-btn:disabled{opacity:0.4;cursor:not-allowed}
    .pass-btn{padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer;border:none;background:#1e3a5f;color:#93c5fd;font-size:13px;margin-top:4px}
    @keyframes lvlup{0%{transform:scale(1)}40%{transform:scale(1.8) rotate(10deg)}100%{transform:scale(1)}}
    .lvlup-anim{animation:lvlup .9s ease}
    .hint-text{font-size:10px;color:#475569;font-style:italic}
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef,useMemo} = React;
const Chess = window.Chess;

// ── Icone e costanti ────────────────────────────────────────────────────────
const ICONS = {w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},
               b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};
const EVO_NAMES = {p:'Assaltatore',n:'Destriero',b:'Spettro',r:'Alchimista',q:'Imperatrice',k:'Re'};
const EVO_COST  = {p:2, n:2, b:2, r:3, q:5};
const PRESTIGE  = {p:1, n:2, b:2, r:3, q:4};
const ABILITY_BASE_COST = { ghostMarch:3, frenzyCharge:2, spectralStep:2, elixir:2, royalCommand:4 };

let _id = 0;
const nextId = () => ++_id;

// ── Utility ─────────────────────────────────────────────────────────────────
const SQ = (f,r) => f>=0&&f<=7&&r>=1&&r<=8 ? String.fromCharCode(97+f)+r : null;
const FILE = sq => sq.charCodeAt(0)-97;
const RANK = sq => parseInt(sq[1]);
const knightJumps = sq => {
  const f=FILE(sq), r=RANK(sq);
  return [[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]]
    .map(([df,dr]) => SQ(f+df,r+dr)).filter(Boolean);
};
const DIAG_DIRS = [[1,1],[1,-1],[-1,1],[-1,-1]];
const STRAIGHT_DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

function buildState(g) {
  const pd={}, sm={};
  g.board().forEach((row,r) => row.forEach((cell,c) => {
    if (!cell) return;
    const sq = 'abcdefgh'[c]+(8-r);
    const id = `${cell.color}${cell.type}_${nextId()}`;
    pd[id] = {type:cell.type, color:cell.color, level:1};
    sm[sq] = id;
  }));
  return {pd, sm};
}

function applyStd(game, from, to, promotion='q') {
  const g = new Chess(game.fen());
  const mv = g.move({from, to, promotion});
  if (!mv) return null;
  let cap = null; // FIX: rimosso '@'
  if (mv.captured) cap = mv.flags?.includes('e') ? {type:mv.captured, _sq: to[0]+from[1]} : {type:mv.captured};
  return {game:g, captured:cap, castleK:mv.flags?.includes('k'), castleQ:mv.flags?.includes('q')};
}

// ── Rilevamento scacco esteso (include pezzi evoluti) ─────────────────────
function kingInCheck(game, color, pd, sm, stunnedSet, ghostMarchColor) {
  const fen = game.fen().split(' ');
  fen[1] = color; fen[3] = '-';
  if (new Chess(fen.slice(0,4).join(' ')+' 0 1').in_check()) return true;

  const opp = color==='w'?'b':'w';
  let kSq = null;
  game.board().forEach((row,r) => row.forEach((p,c) => {
    if (p && p.type==='k' && p.color===color) kSq = 'abcdefgh'[c]+(8-r);
  }));
  if (!kSq) return false;

  // Imperatrice Lv2 (mossa cavallo)
  for (const [sq,id] of Object.entries(sm)) {
    const p = game.get(sq);
    if (!p || p.color !== opp || stunnedSet?.has(id)) continue;
    const d = pd[id];
    if (!d || d.level < 2) continue;
    if (p.type === 'q' && knightJumps(sq).includes(kSq)) return true;
  }

  // Spettro Lv2 (alfiere che salta un pezzo)
  for (const [sq,id] of Object.entries(sm)) {
    const p = game.get(sq);
    if (!p || p.color !== opp || stunnedSet?.has(id) || p.type !== 'b') continue;
    const d = pd[id];
    if (!d || d.level < 2) continue;
    const df = Math.sign(FILE(kSq) - FILE(sq));
    const dr = Math.sign(RANK(kSq) - RANK(sq));
    if (Math.abs(FILE(kSq)-FILE(sq)) !== Math.abs(RANK(kSq)-RANK(sq)) || df===0) continue;
    let jumped = false;
    let f = FILE(sq)+df, r = RANK(sq)+dr;
    while (f !== FILE(kSq) || r !== RANK(kSq)) {
      const midSq = SQ(f,r);
      if (!midSq) break;
      const midPiece = game.get(midSq);
      if (midPiece) {
        if (jumped) { jumped = false; break; }
        jumped = true;
      }
      f += df; r += dr;
    }
    if (jumped) return true;
  }

  // Assaltatore Lv2 (pedone che attacca in tre direzioni frontali)
  for (const [sq,id] of Object.entries(sm)) {
    const p = game.get(sq);
    if (!p || p.color !== opp || stunnedSet?.has(id) || p.type !== 'p') continue;
    const d = pd[id];
    if (!d || d.level < 2) continue;
    const dir = opp === 'w' ? 1 : -1;
    const pf = FILE(sq), pr = RANK(sq);
    const attacks = [[pf-1, pr+dir], [pf, pr+dir], [pf+1, pr+dir]];
    for (const [af, ar] of attacks) {
      if (af === FILE(kSq) && ar === RANK(kSq)) return true;
    }
  }

  // Torri/Regine che sfruttano Marcia Fantasma per attraversare pedoni alleati
  if (ghostMarchColor === opp) {
    for (const [sq,id] of Object.entries(sm)) {
      const p = game.get(sq);
      if (!p || p.color !== opp || stunnedSet?.has(id)) continue;
      if (p.type !== 'r' && p.type !== 'q') continue;
      const df = Math.sign(FILE(kSq) - FILE(sq));
      const dr = Math.sign(RANK(kSq) - RANK(sq));
      if ((p.type === 'r' && df !== 0 && dr !== 0) || (p.type === 'q' && df === 0 && dr === 0)) continue;
      if (p.type === 'q' && Math.abs(FILE(kSq)-FILE(sq)) !== Math.abs(RANK(kSq)-RANK(sq)) && df !== 0 && dr !== 0) continue;
      let f = FILE(sq)+df, r = RANK(sq)+dr;
      let blocked = false;
      while (f !== FILE(kSq) || r !== RANK(kSq)) {
        const midSq = SQ(f,r);
        if (!midSq) break;
        const midPiece = game.get(midSq);
        if (midPiece) {
          const midId = sm[midSq];
          if (midPiece.color === opp && midPiece.type === 'p' && pd[midId]?.level === 2) {
            f += df; r += dr;
            continue;
          }
          blocked = true;
          break;
        }
        f += df; r += dr;
      }
      if (!blocked) return true;
    }
  }

  return false;
}

// ═══════════════════════════════════════════════════════════════════════════
function App() {
  const [game, setGame] = useState(() => new Chess());
  const [pd, setPd] = useState({});
  const [sm, setSm] = useState({});
  const [sel, setSel] = useState(null);
  const [moves, setMoves] = useState([]);
  const [pts, setPts] = useState({w:0,b:0});
  const [last, setLast] = useState(null);
  const [flipped, setFlip] = useState(false);
  const [stunned, setStunned] = useState(new Set());
  const [immune, setImmune] = useState(null);
  const [ghostMarch, setGhostMarch] = useState(null);
  const [gameOver, setGameOver] = useState(null);
  const [lvlUpSq, setLvlUpSq] = useState(null);

  const [hasMoved, setHasMoved] = useState(false);
  const [actualTurn, setActualTurn] = useState('w');

  const [cmdMode, setCmdMode] = useState(false);
  const [cmdCost, setCmdCost] = useState(4);
  const [cmdSrc, setCmdSrc] = useState(null);
  const [cmdDiscount, setCmdDiscount] = useState(false);

  const [elixMode, setElixMode] = useState(false);
  const [elixCost, setElixCost] = useState(2);
  const [elixSrc, setElixSrc] = useState(null);

  const [frenzyMode, setFrenzyMode] = useState(false);
  const [spectralMode, setSpectralMode] = useState(false);

  const [auraGained, setAuraGained] = useState({w:0,b:0});
  const lvlTimer = useRef(null);

  useEffect(() => { const s=buildState(game); setPd(s.pd); setSm(s.sm); }, []);

  // ── Aura e livello effettivo ──────────────────────────────────────────────
  const inEnemyAura = useCallback((sq, myColor) => {
    const opp = myColor==='w'?'b':'w';
    for (const [osq,oid] of Object.entries(sm)) {
      const p=game.get(osq);
      if (p&&p.color===opp&&p.type==='n'&&pd[oid]?.level===2) {
        if (knightJumps(osq).includes(sq)) return true;
      }
    }
    return false;
  }, [game,sm,pd]);

  const effLevel = useCallback((sq, id, color) => {
    const d = pd[id];
    if (!d) return 1;
    if (d.level===2 && inEnemyAura(sq, color)) return 1;
    return d.level;
  }, [pd, inEnemyAura]);

  const calcPrestige = useCallback((color) => {
    let total=0;
    for (const [sq,id] of Object.entries(sm)) {
      const p=game.get(sq);
      if (p&&p.color===color && effLevel(sq,id,color)===2) total+=PRESTIGE[p.type]||0;
    }
    return total;
  }, [game,sm,pd,effLevel]);

  const activeColor = actualTurn;
  const prestige = calcPrestige(activeColor);
  const pdDiscount = prestige>=15 ? 1 : 0;
  const pdBonusEnergy = prestige>=10;
  const pdCanDevolve = prestige>=5;

  const isImmune = useCallback((sq) => {
    if (!immune||immune.sq!==sq) return false;
    const rookSq = Object.entries(sm).find(([,id])=>id===immune.rookId)?.[0];
    if (!rookSq) return false;
    return FILE(rookSq)===FILE(sq)||RANK(rookSq)===RANK(sq);
  }, [immune,sm]);

  const getActualCost = useCallback((baseCost) => Math.max(1, baseCost - pdDiscount), [pdDiscount]);
  const getEvoCost = useCallback((type) => Math.max(1, (EVO_COST[type]||99) - pdDiscount), [pdDiscount]);

  // ── Generatore mosse ──────────────────────────────────────────────────────
  const getMoves = useCallback((sq, isCommandTurn = false, wasOppInCheck = false, specialMode = null) => {
    const p = game.get(sq);
    if (!p) return [];
    const color = p.color;
    const id = sm[sq];
    if (!id || stunned.has(id)) return [];
    const d = pd[id];
    const evo2 = effLevel(sq, id, color) === 2;
    const result = [];

    if (!specialMode || specialMode==='normal') {
      for (const m of game.moves({square:sq, verbose:true})) {
        if (m.promotion && m.promotion!=='q') continue;
        const g2 = new Chess(game.fen());
        if (!g2.move({from:m.from, to:m.to, promotion:m.promotion||'q'})) continue;
        const nsm = {...sm}; nsm[m.to]=nsm[m.from]; delete nsm[m.from];
        if (m.captured) { const cs=m.flags?.includes('e')?m.to[0]+sq[1]:m.to; if(isImmune(cs)) continue; delete nsm[cs]; }
        if (kingInCheck(g2,color,pd,nsm,stunned,ghostMarch)) continue;
        if (isCommandTurn && (g2.in_checkmate() || (wasOppInCheck && g2.in_check()))) continue;
        result.push({type:'std', from:sq, to:m.to, promo:m.promotion});
      }
    }

    if (!evo2) return result;

    if (specialMode === 'frenzyCharge' && p.type==='n') {
      const visited=new Set([sq]);
      for (const mid of knightJumps(sq)) {
        for (const tsq of knightJumps(mid)) {
          if (visited.has(tsq)) continue;
          visited.add(tsq);
          const tp=game.get(tsq);
          if (tp&&tp.color===color) continue;
          const g2=new Chess(game.fen()); g2.remove(sq); if(tp)g2.remove(tsq); g2.put({type:'n',color},tsq);
          const nsm={...sm}; delete nsm[sq]; if(tp)delete nsm[tsq]; nsm[tsq]=id;
          if (!kingInCheck(g2,color,pd,nsm,stunned,ghostMarch))
            result.push({type:'frenzy_charge', from:sq, to:tsq});
        }
      }
      return result;
    }

    if (specialMode === 'spectralStep' && p.type==='b') {
      for (const [df,dr] of DIAG_DIRS) {
        let cf=FILE(sq)+df, cr=RANK(sq)+dr;
        while (cf>=0&&cf<=7&&cr>=1&&cr<=8) {
          const tsq=SQ(cf,cr);
          if (!game.get(tsq)) {
            const g2=new Chess(game.fen()); g2.remove(sq); g2.put({type:'b',color},tsq);
            const nsm={...sm}; nsm[tsq]=id; delete nsm[sq];
            if (!kingInCheck(g2,color,pd,nsm,stunned,ghostMarch))
              result.push({type:'spectral_step', from:sq, to:tsq});
          }
          cf+=df; cr+=dr;
        }
      }
      return result;
    }

    if (p.type==='p') {
      const dir = color==='w'?1:-1;
      const f=FILE(sq), r=RANK(sq);
      for (const df of [-1,0,1]) {
        const tsq=SQ(f+df, r+dir);
        if (!tsq || result.some(m=>m.to===tsq)) continue;
        const tp=game.get(tsq);
        if (df===0 && tp) continue;
        if (df!==0 && tp && tp.color===color) continue;
        const g2=new Chess(game.fen()); g2.remove(sq); if(tp)g2.remove(tsq); g2.put({type:'p',color},tsq);
        const nsm={...sm}; delete nsm[sq]; if(tp)delete nsm[tsq]; nsm[tsq]=id;
        if (!kingInCheck(g2,color,pd,nsm,stunned,ghostMarch)) result.push({type:'std', from:sq, to:tsq});
      }
    }
    if (p.type==='b') {
      for (const [df,dr] of DIAG_DIRS) {
        let cf=FILE(sq)+df, cr=RANK(sq)+dr;
        let first=null, firstSq=null;
        while (cf>=0&&cf<=7&&cr>=1&&cr<=8) {
          const tsq=SQ(cf,cr); if(!tsq) break;
          const tp=game.get(tsq);
          if(!first) { if(tp){first=tp;firstSq=tsq;} }
          else {
            if(!tp){
              const g2=new Chess(game.fen()); g2.remove(sq); g2.put({type:'b',color},tsq);
              const nsm={...sm}; nsm[tsq]=id; delete nsm[sq];
              if(!kingInCheck(g2,color,pd,nsm,stunned,ghostMarch)) result.push({type:'bishop_jump', from:sq, to:tsq, jumped:firstSq, jumpedId:sm[firstSq], jumpedColor:first.color});
            } else {
              if(tp.color!==color){
                const g2=new Chess(game.fen()); g2.remove(sq); g2.remove(tsq); g2.put({type:'b',color},tsq);
                const nsm={...sm}; delete nsm[sq]; delete nsm[tsq]; nsm[tsq]=id;
                if(!kingInCheck(g2,color,pd,nsm,stunned,ghostMarch)) result.push({type:'bishop_jump', from:sq, to:tsq, jumped:firstSq, jumpedId:sm[firstSq], jumpedColor:first.color, capture:true});
              }
              break;
            }
          }
          cf+=df; cr+=dr;
        }
      }
    }
    if (p.type==='q') {
      for (const tsq of knightJumps(sq)) {
        if (result.some(m=>m.to===tsq)) continue;
        const tp=game.get(tsq);
        if (tp&&tp.color===color) continue;
        const g2=new Chess(game.fen()); g2.remove(sq); if(tp)g2.remove(tsq); g2.put({type:'q',color},tsq);
        const nsm={...sm}; delete nsm[sq]; if(tp)delete nsm[tsq]; nsm[tsq]=id;
        if(!kingInCheck(g2,color,pd,nsm,stunned,ghostMarch)) result.push({type:'std', from:sq, to:tsq});
      }
    }
    if (p.type==='r') {
      const f=FILE(sq), r=RANK(sq);
      for (const [osq,oid] of Object.entries(sm)) {
        if (osq===sq) continue;
        const op=game.get(osq);
        if (!op||op.color!==color||op.type==='k') continue;
        const of_=FILE(osq), or_=RANK(osq);
        if (f!==of_ && r!==or_) continue;
        let clear=true;
        if (f===of_) { for (let rr=Math.min(r,or_)+1;rr<Math.max(r,or_);rr++) if(game.get(SQ(f,rr))){clear=false;break;} }
        else { for (let ff=Math.min(f,of_)+1;ff<Math.max(f,of_);ff++) if(game.get(SQ(ff,r))){clear=false;break;} }
        if (clear) result.push({type:'swap', from:sq, to:osq});
      }
    }
    if (ghostMarch===color && (p.type==='r'||p.type==='q')) {
      const dirs = STRAIGHT_DIRS.concat(p.type==='q'?DIAG_DIRS:[]);
      for (const [df,dr] of dirs) {
        let cf=FILE(sq)+df, cr=RANK(sq)+dr;
        while (cf>=0&&cf<=7&&cr>=1&&cr<=8) {
          const tsq=SQ(cf,cr); if(!tsq) break;
          const tp=game.get(tsq);
          if (!tp) {
            if (!result.some(m=>m.to===tsq)) {
              const g2=new Chess(game.fen()); g2.remove(sq); g2.put(p,tsq);
              const nsm={...sm}; nsm[tsq]=id; delete nsm[sq];
              if(!kingInCheck(g2,color,pd,nsm,stunned,ghostMarch)) result.push({type:'std', from:sq, to:tsq});
            }
          } else if (tp.color===color && tp.type==='p' && effLevel(tsq,sm[tsq],color)===2) {
            cf+=df; cr+=dr; continue;
          } else break;
          cf+=df; cr+=dr;
        }
      }
    }
    return result;
  }, [game,sm,pd,pts,stunned,ghostMarch,pdDiscount,cmdDiscount,inEnemyAura,isImmune,effLevel,actualTurn]);

  // ── Esecuzione mossa / abilità ────────────────────────────────────────────
  const execute = useCallback((action, color) => {
    let ng, energyDelta=0;
    const npd={...pd}, nsm={...sm};
    const newStunned=new Set(stunned);
    let newImmune=immune, newGhost=ghostMarch;

    const mid = sm[action.from];
    const wasOppInCheck = game.in_check();

    if (action.type==='std') {
      const res=applyStd(game,action.from,action.to,action.promo);
      if (!res) return false;
      ng=res.game;
      // Forza il turno a rimanere al giocatore corrente
      const parts = ng.fen().split(' ');
      parts[1] = color;
      parts[3] = '-';
      ng = new Chess(parts.join(' '));
      energyDelta=1;
      if (res.captured) energyDelta+=1;
      if (ng.in_check()) energyDelta+=1;
      if (npd[mid]?.type==='p'&&npd[mid]?.level===2&&res.captured) energyDelta+=1;
      if (res.castleK){const rk=color==='w'?'1':'8';nsm['f'+rk]=nsm['h'+rk];delete nsm['h'+rk];}
      if (res.castleQ){const rk=color==='w'?'1':'8';nsm['d'+rk]=nsm['a'+rk];delete nsm['a'+rk];}
      if (res.captured){ const cs=res.captured._sq||action.to; delete npd[nsm[cs]]; delete nsm[cs]; }
      nsm[action.to]=mid; delete nsm[action.from];
      const promoPiece = game.get(action.from);
      if (promoPiece && promoPiece.type==='p' && (RANK(action.to)===8 || RANK(action.to)===1)) {
        npd[mid] = { type: action.promo||'q', color, level:1 };
      }
      setHasMoved(true);
    }
    else if (action.type==='bishop_jump') {
      ng=new Chess(game.fen());
      const jumped=game.get(action.jumped), tp=game.get(action.to);
      ng.remove(action.from);
      if (action.capture && tp) { delete npd[nsm[action.to]]; delete nsm[action.to]; energyDelta+=1; }
      ng.put({type:'b',color},action.to);
      nsm[action.to]=mid; delete nsm[action.from];
      if (jumped) {
        if (jumped.color!==color) newStunned.add(action.jumpedId);
        else energyDelta+=1;
      }
      energyDelta+=1;
      const parts=ng.fen().split(' '); parts[1]=color; parts[3]='-'; parts[4]='0';
      ng=new Chess(parts.join(' '));
      if(ng.in_check()) energyDelta+=1;
      setHasMoved(true);
    }
    else if (action.type==='frenzy_charge' || action.type==='spectral_step') {
      const cost = getActualCost(action.type==='frenzy_charge'?ABILITY_BASE_COST.frenzyCharge:ABILITY_BASE_COST.spectralStep);
      if (pts[color]<cost) return false;
      energyDelta = -cost + 1;
      if (action.type==='spectral_step') {
        const f0=FILE(action.from),r0=RANK(action.from);
        const f1=FILE(action.to), r1=RANK(action.to);
        const dc=f1>f0?1:-1, dr=r1>r0?1:-1;
        let cf=f0+dc, cr=r0+dr;
        while(cf!==f1||cr!==r1){
          const msq=SQ(cf,cr), mp=game.get(msq);
          if(mp){
            if(mp.color!==color) newStunned.add(sm[msq]);
            else energyDelta+=1;
          }
          cf+=dc; cr+=dr;
        }
      }
      ng=new Chess(game.fen());
      const tp=game.get(action.to);
      ng.remove(action.from);
      if(tp){delete npd[nsm[action.to]];delete nsm[action.to];energyDelta+=1;}
      ng.put({type:action.type==='frenzy_charge'?'n':'b',color},action.to);
      nsm[action.to]=mid; delete nsm[action.from];
      const parts=ng.fen().split(' '); parts[1]=color; parts[3]='-'; parts[4]='0';
      ng=new Chess(parts.join(' '));
      if(ng.in_check()) energyDelta+=1;
    }
    else if (action.type==='swap') {
      const p1=game.get(action.from), p2=game.get(action.to);
      ng=new Chess(game.fen()); ng.remove(action.from); ng.remove(action.to);
      ng.put(p1,action.to); ng.put(p2,action.from);
      const parts=ng.fen().split(' '); parts[1]=color; parts[3]='-'; parts[4]='0';
      ng=new Chess(parts.join(' '));
      nsm[action.from]=sm[action.to]; nsm[action.to]=sm[action.from];
      energyDelta=1;
      setHasMoved(true);
    }
    else return false;

    // Aura guadagno per l'avversario
    const opp = color==='w'?'b':'w';
    let auraExtra=0;
    const oppDestrieri = Object.entries(sm).filter(([sqA,idA])=>pd[idA]?.level===2 && ng.get(sqA)?.type==='n' && ng.get(sqA)?.color===opp);
    for (const [sqA,idA] of oppDestrieri) {
      const zone = knightJumps(sqA);
      for (const [sqE,idE] of Object.entries(sm)) {
        if (sqE===sqA) continue;
        const ep=ng.get(sqE);
        if (ep && ep.color===color) {
          const wasInZone = game.get(sqE) ? knightJumps(sqA).includes(sqE) : false;
          const isInZone = zone.includes(sqE);
          if (!wasInZone && isInZone) auraExtra += 1;
          else if (wasInZone && !isInZone) auraExtra += 1;
        }
      }
    }
    auraExtra = Math.min(auraExtra, 2 - (auraGained[opp]||0));
    const newAuraGained = {...auraGained, [opp]: (auraGained[opp]||0)+auraExtra};

    setGame(ng); setPd(npd); setSm(nsm);
    setPts(prev => ({...prev, [color]: Math.max(0, prev[color]+energyDelta), [opp]: prev[opp]+auraExtra}));
    setStunned(newStunned); setImmune(newImmune);
    setGhostMarch(newGhost);
    setAuraGained(newAuraGained);
    setLast({from:action.from, to:action.to});
    setSel(null); setMoves([]);
    setFrenzyMode(false); setSpectralMode(false);

    // --- RILEVAMENTO FINE PARTITA CORRETTO ---
    const evalFen = ng.fen().split(' ');
    evalFen[1] = opp; // Simuliamo che tocchi all'avversario
    const evalGame = new Chess(evalFen.join(' '));

    if (evalGame.in_checkmate() || evalGame.in_draw() || evalGame.in_stalemate()) {
      setGameOver({
        winner: evalGame.in_checkmate() ? color : null,
        reason: evalGame.in_checkmate() ? 'Scacco Matto' : 'Patta'
      });
    }
    
    return true;
  }, [game,pd,sm,pts,stunned,immune,ghostMarch,auraGained,getActualCost,actualTurn]);

  // ── Passa il turno ────────────────────────────────────────────────────────
  const passTurn = useCallback(() => {
    if (!hasMoved) return;
    const next = actualTurn === 'w' ? 'b' : 'w';
    setStunned(prev => { const ns=new Set(prev); for (const id of ns) if(pd[id]?.color===actualTurn) ns.delete(id); return ns; });
    setImmune(null);
    if (ghostMarch === actualTurn) setGhostMarch(null);
    if (pdBonusEnergy && calcPrestige(next)>=10) {
      setPts(prev=>({...prev,[next]:prev[next]+1}));
    }
    setAuraGained({w:0,b:0});
    setHasMoved(false);
    setSel(null); setMoves([]);
    setCmdMode(false); setCmdSrc(null); setCmdDiscount(false);
    setElixMode(false); setElixSrc(null);
    setFrenzyMode(false); setSpectralMode(false);
    setActualTurn(next);
    setGame(prev => {
      const fenParts = prev.fen().split(' ');
      fenParts[1] = next;
      return new Chess(fenParts.join(' '));
    });
  }, [hasMoved, actualTurn, pd, pdBonusEnergy, calcPrestige, ghostMarch]);

  // ── Click principale ───────────────────────────────────────────────────────
  const click = useCallback((sq) => {
    if (gameOver) return;
    const color = actualTurn;

    if (cmdMode) {
      if (sq && sq!==cmdSrc) {
        const p=game.get(sq);
        if (p&&p.color===color&&p.type!=='q') {
          setCmdDiscount(true);
          setCmdMode(false); setCmdSrc(null);
          const oppInCheck = kingInCheck(game, color==='w'?'b':'w', pd, sm, stunned, ghostMarch);
          setSel(sq); setMoves(getMoves(sq, true, oppInCheck, 'normal'));
        }
      } else {
        setCmdMode(false); setCmdSrc(null);
        setPts(prev=>({...prev,[color]:prev[color]+cmdCost}));
        setCmdDiscount(false);
      }
      return;
    }

    if (elixMode) {
      if (sq) {
        const p=game.get(sq);
        if (p&&p.color===color&&sq!==elixSrc&&(FILE(sq)===FILE(elixSrc)||RANK(sq)===RANK(elixSrc))) {
          setImmune({sq, rookId:sm[elixSrc]});
          setPts(prev=>({...prev,[color]:Math.max(0,prev[color]-elixCost)}));
          setElixMode(false); setElixSrc(null);
          setSel(null); setMoves([]);
        }
      } else {
        setPts(prev=>({...prev,[color]:prev[color]+elixCost}));
        setElixMode(false); setElixSrc(null);
      }
      return;
    }

    if (frenzyMode || spectralMode) {
      const specialMode = frenzyMode ? 'frenzyCharge' : 'spectralStep';
      if (sq) {
        const move = moves.find(m=>m.to===sq && (m.type==='frenzy_charge'||m.type==='spectral_step'));
        if (move) {
          execute(move, color);
          return;
        }
      }
      setFrenzyMode(false); setSpectralMode(false);
      setSel(null); setMoves([]);
      return;
    }

    // --- INTERCETTAZIONE MOSSE (per Comando Reale) ---
    if (sel && sq && moves.length > 0) {
      const move = moves.find(m => m.to === sq && (m.type === 'std' || m.type === 'swap' || m.type === 'bishop_jump'));
      if (move) {
        execute(move, color);
        return;
      }
    }

    if (!hasMoved) {
      if (!sq) return;
      const p = game.get(sq);
      if (!p || p.color !== color || stunned.has(sm[sq])) return;
      if (!sel) {
        setSel(sq);
        setMoves(getMoves(sq, false, false, 'normal'));
        return;
      }
      const move = moves.find(m=>m.to===sq && (m.type==='std'||m.type==='swap'||m.type==='bishop_jump'));
      if (move) {
        execute(move, color);
        return;
      }
      const newPiece = game.get(sq);
      if (newPiece && newPiece.color === color && !stunned.has(sm[sq])) {
        setSel(sq);
        setMoves(getMoves(sq, false, false, 'normal'));
      } else {
        setSel(null); setMoves([]);
      }
      return;
    }

    if (!sq) {
      setSel(null); setMoves([]);
      return;
    }
    const p = game.get(sq);
    if (!p || p.color !== color || stunned.has(sm[sq])) {
      setSel(null); setMoves([]);
      return;
    }
    const id = sm[sq];
    const d = pd[id];
    const lv = effLevel(sq, id, color);

    if (lv === 1) {
      const cost = getEvoCost(p.type);
      if (pts[color] >= cost) {
        setPd(prev=>({...prev,[id]:{...d,level:2}}));
        setPts(prev=>({...prev,[color]:prev[color]-cost}));
        setLvlUpSq(sq);
        if(lvlTimer.current)clearTimeout(lvlTimer.current);
        lvlTimer.current=setTimeout(()=>setLvlUpSq(null),900);
        setSel(null); setMoves([]);
      }
      return;
    }

    setSel(sq);
    setMoves([]);
  }, [hasMoved, sel, moves, game, sm, pd, pts, stunned, ghostMarch, cmdMode, elixMode, frenzyMode, spectralMode, execute, getMoves, effLevel, getEvoCost, actualTurn]);

  // ── Devolvi ───────────────────────────────────────────────────────────────
  const devolveSelected = useCallback(() => {
    if (!sel) return;
    const id = sm[sel];
    const d = pd[id];
    if (!d || d.level !== 2 || !pdCanDevolve) return;
    setPd(prev=>({...prev,[id]:{...d,level:1}}));
    setPts(prev=>({...prev,[activeColor]:prev[activeColor]+1}));
    setSel(null); setMoves([]);
  }, [sel, sm, pd, pdCanDevolve, activeColor]);

  // ── Reset ──────────────────────────────────────────────────────────────────
  const reset = () => {
    _id=0; const g=new Chess(); const s=buildState(g);
    setGame(g); setPd(s.pd); setSm(s.sm); setPts({w:0,b:0});
    setSel(null); setMoves([]); setLast(null);
    setHasMoved(false); setActualTurn('w');
    setStunned(new Set()); setImmune(null); setGhostMarch(null);
    setCmdMode(false); setCmdSrc(null);
    setElixMode(false); setElixSrc(null);
    setFrenzyMode(false); setSpectralMode(false);
    setGameOver(null); setLvlUpSq(null);
    setAuraGained({w:0,b:0});
  };

  // ── Derivati per rendering ─────────────────────────────────────────────────
  const moveTargets = useMemo(()=>new Set(moves.map(m=>m.to)),[moves]);
  const abilityTargets = useMemo(()=>new Set(moves.filter(m=>m.type==='frenzy_charge'||m.type==='spectral_step').map(m=>m.to)),[moves]);

  const raw = game.board();
  const bd = flipped ? [...raw].reverse().map(r=>[...r].reverse()) : raw;

  const selPiece = sel ? game.get(sel) : null;
  const selId = sel ? sm[sel] : null;
  const selData = selId ? pd[selId] : null;
  const selEffLevel = sel && selId ? effLevel(sel, selId, activeColor) : 0;

  const inCheck = kingInCheck(game, activeColor, pd, sm, stunned, ghostMarch);

  const pieceAbilities = useMemo(() => {
    if (!hasMoved || !selPiece || !selData || selEffLevel !== 2) return [];
    const color = selPiece.color;
    const energy = pts[color];
    const ab = [];
    if (selPiece.type === 'p') {
      const cost = getActualCost(ABILITY_BASE_COST.ghostMarch);
      ab.push({name:'👻 Marcia Fantasma', cost, available: energy>=cost && !ghostMarch, action:()=>{ setPts(prev=>({...prev,[color]:prev[color]-cost})); setGhostMarch(color); setSel(null); }});
    }
    if (selPiece.type === 'n') {
      const cost = getActualCost(ABILITY_BASE_COST.frenzyCharge);
      ab.push({name:'⚔️ Carica Forsennata', cost, available: energy>=cost, action:()=>{ setFrenzyMode(true); setMoves(getMoves(sel, false, false, 'frenzyCharge')); }});
    }
    if (selPiece.type === 'b') {
      const cost = getActualCost(ABILITY_BASE_COST.spectralStep);
      ab.push({name:'🌫️ Passo Spettrale', cost, available: energy>=cost, action:()=>{ setSpectralMode(true); setMoves(getMoves(sel, false, false, 'spectralStep')); }});
    }
    if (selPiece.type === 'r') {
      const f=FILE(sel), r=RANK(sel);
      const hasAlly = Object.entries(sm).some(([osq])=>osq!==sel&&game.get(osq)?.color===color&&(FILE(osq)===f||RANK(osq)===r));
      const cost = getActualCost(ABILITY_BASE_COST.elixir);
      ab.push({name:'🧪 Elisir di Protezione', cost, available: energy>=cost && hasAlly, action:()=>{ setPts(prev=>({...prev,[color]:prev[color]-cost})); setElixMode(true); setElixSrc(sel); setElixCost(cost); setSel(null); }});
    }
    if (selPiece.type === 'q') {
      const cost = getActualCost(ABILITY_BASE_COST.royalCommand);
      const hasAlly = Object.entries(sm).some(([osq])=>osq!==sel&&game.get(osq)?.color===color);
      ab.push({name:'👑 Comando Reale', cost, available: energy>=cost && hasAlly, action:()=>{ setPts(prev=>({...prev,[color]:prev[color]-cost})); setCmdMode(true); setCmdSrc(sel); setCmdCost(cost); setSel(null); }});
    }
    return ab;
  }, [hasMoved, selPiece, selData, selEffLevel, pts, ghostMarch, game, sm, getMoves, getActualCost, actualTurn]);

  // ── Pannello ──────────────────────────────────────────────────────────────
  function renderPanel() {
    if (cmdMode) return (
      <div style={{flex:1,display:'flex',flexDirection:'column',gap:4}}>
        <div style={{fontSize:12,fontWeight:800,color:'#ec4899'}}>👑 Comando Reale</div>
        <div className="hint-text">Seleziona un pezzo alleato (non Imperatrice) per un turno extra.</div>
        <button className="pass-btn" style={{background:'#1e293b',color:'#94a3b8'}}
          onClick={()=>{setCmdMode(false);setCmdSrc(null);setPts(prev=>({...prev,[activeColor]:prev[activeColor]+cmdCost}));setCmdDiscount(false);}}>
          ✕ Annulla (rimborso {cmdCost}⚡)
        </button>
      </div>
    );
    if (elixMode) return (
      <div style={{flex:1,display:'flex',flexDirection:'column',gap:4}}>
        <div style={{fontSize:12,fontWeight:800,color:'#fbbf24'}}>🧪 Elisir di Protezione</div>
        <div className="hint-text">Clicca un pezzo alleato sulla stessa riga/colonna dell'Alchimista.</div>
        <button className="pass-btn" style={{background:'#1e293b',color:'#94a3b8'}}
          onClick={()=>{setElixMode(false);setElixSrc(null);setPts(prev=>({...prev,[activeColor]:prev[activeColor]+elixCost}));}}>
          ✕ Annulla (rimborso {elixCost}⚡)
        </button>
      </div>
    );

    return (
      <>
        <div>
          <div className="charge-row">
            <span>⚡ {activeColor==='w'?'BIANCO':'NERO'}{pdBonusEnergy?' (+1)':''}{ghostMarch===activeColor?' 👻 Marcia':''}</span>
            <span style={{color:'#f1f5f9'}}>{pts[activeColor]}⚡</span>
          </div>
          <div className="charge-track"><div style={{width:`${Math.min(pts[activeColor]/10*100,100)}%`,height:'100%',background:'#38bdf8',transition:'width .3s'}}/></div>
        </div>
        <div className="panel-bottom">
          <div className="piece-label">
            {!hasMoved ? (
              <span className="hint-text">{inCheck?'⚠️ SCACCO!':'Seleziona un pezzo e muovi.'}</span>
            ) : selData ? (
              <span style={{fontWeight:700}}>{selPiece&&ICONS[selPiece.color][selPiece.type]}&nbsp;{selEffLevel===2?EVO_NAMES[selPiece?.type]:'Base'} Lv.{selEffLevel}{stunned.has(selId)&&' (Stordito)'}{immune?.sq===sel&&' (Immune)'}</span>
            ) : (
              <span className="hint-text">Clicca un pezzo base per evolvere, o un evoluto per le abilità.</span>
            )}
          </div>
          <div className="turn-pill" style={{color:activeColor==='w'?'#38bdf8':'#f43f5e'}}>
            {inCheck?'⚠️ SCACCO':activeColor==='w'?'⬜ Bianco':'⬛ Nero'}
          </div>
        </div>

        {hasMoved && pieceAbilities.length > 0 && (
          <div className="btn-row">
            {pieceAbilities.map((ab,i)=>(
              <button key={i} className="ability-btn"
                style={{borderColor: ab.available?'#a855f7':'#475569', color: ab.available?'#a855f7':'#64748b'}}
                disabled={!ab.available}
                onClick={ab.action}>
                {ab.name} ({ab.cost}⚡)
              </button>
            ))}
          </div>
        )}

        {hasMoved && sel && selEffLevel===2 && pdCanDevolve && (
          <button className="ability-btn" style={{background:'#7f1d1d',color:'#fca5a5',marginTop:4}} onClick={devolveSelected}>
            ↩ De-evolvi +1⚡
          </button>
        )}

        {hasMoved && (
          <button className="pass-btn" onClick={passTurn}>Passa il turno →</button>
        )}
      </>
    );
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  return (
    <div className="app">
      <div className="top-bar">
        <div className="prestige-badge">⭐{prestige}{prestige>=5&&' 🥉'}{prestige>=10&&' 🥈'}{prestige>=15&&' 🥇'}</div>
        <button className="flip-btn" onClick={()=>setFlip(f=>!f)}>🔄 Ruota</button>
      </div>

      <div className="player-row">
        <div className="player-label" style={{borderLeft:'3px solid #f43f5e'}}>
          <div className="player-name">⬛ Nero</div>
          {last&&<div className="last-move-hint">{last.from}→{last.to}</div>}
        </div>
        <div className="energy-badge" style={{borderLeft:'3px solid #f43f5e',color:pts.b>0?'#22c55e':'#94a3b8'}}>
          <span style={{fontSize:10}}>⚡</span><span style={{fontSize:16}}>{pts.b}</span>
        </div>
      </div>

      <div className="board-wrap">
        <div className="board" onClick={e=>{if(e.target===e.currentTarget)click(null);}}>
          {bd.map((row,r)=>row.map((cell,c)=>{
            const fi=flipped?7-c:c, ri=flipped?r:7-r;
            const sq='abcdefgh'[fi]+(ri+1);
            const light=(fi+ri)%2!==0;
            const id=sm[sq], d=id?pd[id]:null;
            const pieceColor = game.get(sq)?.color;
            const displayLv = (id && pieceColor) ? effLevel(sq, id, pieceColor) : d?.level??1;
            const isStunned=stunned.has(id);
            const isImm=immune?.sq===sq;
            const isAura=inEnemyAura(sq,activeColor);
            const isSel=sel===sq;
            const isMoveTarget=moveTargets.has(sq);
            const isAbTarget=abilityTargets.has(sq);
            const isLast=last?.from===sq||last?.to===sq;
            const isGhostAlly = ghostMarch===pieceColor && pieceColor===activeColor && game.get(sq)?.type==='p' && displayLv===2;

            return (
              <div key={sq} onClick={()=>click(sq)}
                className={['cell', light?'light':'dark', isSel?'sel':'', isAura?'aura-cell':'', isStunned?'stunned-piece':'', isImm?'immune-highlight':'', isGhostAlly?'ghost-march-ally':'', isLast?(light?'last-from':'last-to'):''].join(' ')}>
                {isMoveTarget&&!isAbTarget&&!cell&&<div style={{position:'absolute',width:'30%',height:'30%',borderRadius:'50%',background:'#22c55e',boxShadow:'0 0 10px #22c55e',zIndex:1,pointerEvents:'none'}}/>}
                {isAbTarget&&!cell&&<div style={{position:'absolute',width:'32%',height:'32%',borderRadius:'50%',background:'#a855f7',boxShadow:'0 0 12px #a855f7',zIndex:1,pointerEvents:'none'}}/>}
                {isMoveTarget&&cell&&!isAbTarget&&<div style={{position:'absolute',inset:0,border:'3px solid #22c55e',borderRadius:3,zIndex:1,pointerEvents:'none'}}/>}
                {isAbTarget&&cell&&<div style={{position:'absolute',inset:0,border:'3px solid #a855f7',borderRadius:3,zIndex:1,pointerEvents:'none'}}/>}
                {cell&&<span className={`piece piece-${cell.color}${displayLv===2?' evo2':''}`} style={{transform:lvlUpSq===sq?'scale(1.5)':'scale(1)',transition:'transform .15s'}} onAnimationEnd={()=>setLvlUpSq(null)}>{ICONS[cell.color][cell.type]}</span>}
                {displayLv===2&&<div style={{position:'absolute',inset:3,border:'2px solid #a855f7',borderRadius:4,pointerEvents:'none',boxShadow:'0 0 10px rgba(168,85,247,.8)',zIndex:3}}/>}
              </div>
            );
          }))}
        </div>
      </div>

      <div className="player-row">
        <div className="player-label" style={{borderLeft:'3px solid #f8fafc'}}>
          <div className="player-name">⬜ Bianco</div>
          {last&&<div className="last-move-hint">{last.from}→{last.to}</div>}
        </div>
        <div className="energy-badge" style={{borderLeft:'3px solid #38bdf8',color:pts.w>0?'#22c55e':'#94a3b8'}}>
          <span style={{fontSize:10}}>⚡</span><span style={{fontSize:16}}>{pts.w}</span>
        </div>
      </div>

      <div className="panel">{renderPanel()}</div>

      <div className="top-bar" style={{justifyContent:'center'}}>
        <button onClick={reset} style={{padding:'4px 16px',background:'#1e293b',color:'#94a3b8',borderRadius:6,fontSize:12,cursor:'pointer',border:'none'}}>🔄 Nuova Partita</button>
      </div>

      {gameOver&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.92)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',zIndex:99,gap:14}}>
          <div style={{fontSize:26,fontWeight:900,color:'#f1f5f9'}}>{gameOver.winner?`🏆 ${gameOver.winner==='w'?'⬜ Bianco':'⬛ Nero'} vince!`:'🤝 Patta'}</div>
          <div style={{fontSize:12,color:'#64748b'}}>{gameOver.reason}</div>
          <button onClick={reset} style={{padding:'12px 40px',background:'#38bdf8',border:'none',borderRadius:9,fontWeight:800,fontSize:15,cursor:'pointer'}}>RIVINCITA</button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
