  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

    #root{height:100%}

    .app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:8px;gap:6px;color:#f1f5f9;font-family:system-ui,sans-serif}

    .piece{font-family:"Segoe UI Symbol","Noto Sans Symbols",sans-serif;line-height:1;user-select:none;z-index:2}
    .piece-w{color:#fff;text-shadow:0 0 0 #000,0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.7))}

    .panel{flex-shrink:0;min-height:90px;background:#0b0f19;border:1px solid #1e293b;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:5px}

    .ability-btn{flex:1;min-width:80px;padding:5px 6px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid #334155;background:#0f172a;color:#cbd5e1;text-align:center}
    .ability-btn:disabled{opacity:0.4;cursor:not-allowed}

    @keyframes lvlup{0%{transform:scale(1)}40%{transform:scale(1.8) rotate(10deg)}100%{transform:scale(1)}}

<div id="root"></div>
<div id="error-overlay"></div>

<!-- Librerie Base -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

<script>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo } = React;

// ---------- AUDIO MANAGER ----------
const AudioManager = {
  ctx: null,
  volume: 0.3,
  unlocked: false,

  init() {
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.volume = 0.3;

    const unlock = () => {
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
      this.unlocked = true;
      const buf = this.ctx.createBuffer(1, 1, 22050);
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      src.connect(this.ctx.destination);
      src.start(0);
      document.removeEventListener('touchstart', unlock);
      document.removeEventListener('click', unlock);
    };
    document.addEventListener('touchstart', unlock, {once: true});
    document.addEventListener('click', unlock, {once: true});
  },

  play(name) {
    if (!this.ctx) this.init();
    if (!this.unlocked) return;

    switch(name) {
      case 'move':
        this._tone(380, 0.03, 'triangle', 0.18);
        setTimeout(() => this._tone(520, 0.04, 'triangle', 0.14), 25);
        break;
      case 'capture':
        this._noise(0.08, 0.35);
        this._tone(180, 0.10, 'square', 0.18);
        setTimeout(() => this._tone(120, 0.06, 'square', 0.10), 40);
        break;
      case 'evolve':
        this._toneSweep(250, 900, 0.18, 'triangle', 0.18);
        setTimeout(() => this._tone(1000, 0.12, 'sine', 0.18), 180);
        setTimeout(() => this._tone(1400, 0.10, 'sine', 0.14), 280);
        break;
      case 'ability':
        this._tone(550, 0.05, 'triangle', 0.15);
        setTimeout(() => this._tone(780, 0.05, 'triangle', 0.15), 50);
        setTimeout(() => this._tone(1100, 0.06, 'triangle', 0.13), 100);
        break;
      case 'victory':
        this._tone(523.25, 0.15, 'sine', 0.25);
        setTimeout(() => this._tone(659.25, 0.15, 'sine', 0.25), 150);
        setTimeout(() => this._tone(783.99, 0.15, 'sine', 0.25), 300);
        setTimeout(() => this._tone(1046.50, 0.3, 'sine', 0.3), 450);
        break;
      case 'defeat':
        this._tone(500, 0.2, 'triangle', 0.2);
        setTimeout(() => this._tone(320, 0.25, 'triangle', 0.18), 200);
        setTimeout(() => this._tone(180, 0.3, 'triangle', 0.15), 450);
        break;
      case 'error':
        this._tone(200, 0.05, 'square', 0.12);
        setTimeout(() => this._tone(200, 0.05, 'square', 0.12), 70);
        setTimeout(() => this._tone(200, 0.05, 'square', 0.12), 140);
        break;
      default:
        console.error('Suono non trovato:', name);
    }
  },

  _tone(freq, dur, type, vol) {
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol * this.volume, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(this.ctx.currentTime);
    osc.stop(this.ctx.currentTime + dur);
  },

  _toneSweep(startFreq, endFreq, dur, type, vol) {
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(startFreq, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(endFreq, this.ctx.currentTime + dur);
    gain.gain.setValueAtTime(vol * this.volume, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(this.ctx.currentTime);
    osc.stop(this.ctx.currentTime + dur);
  },

  _noise(dur, vol) {
    const bufferSize = this.ctx.sampleRate * dur;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const source = this.ctx.createBufferSource();
    source.buffer = buffer;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol * this.volume, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    source.connect(gain);
    gain.connect(this.ctx.destination);
    source.start(this.ctx.currentTime);
  }
};
AudioManager.init();

// ---------- COSTANTI E UTILITÀ ----------
const ICONS = {w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},
               b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};
const EVO_NAMES = {p:'Assaltatore',n:'Destriero',b:'Spettro',r:'Alchimista',q:'Imperatrice',k:'Re'};
const EVO_COST  = {p:2, n:2, b:2, r:3, q:5};
const PRESTIGE  = {p:1, n:2, b:2, r:3, q:4};
const ABILITY_BASE_COST = { ghostMarch:3, dominate:2, spectralStep:2, royalCommand:5, metamorph:2 };

const ENERGY = {
  MOVE: 1, CAPTURE: 1, ASSALTATORE_CAPTURE: 1, ADJACENT_ENEMY: 1
};

const PRESTIGE_TIERS = { BRONZE: 5, SILVER: 10, GOLD: 15 };

let _id = 0;
const nextId = () => ++_id;

const SQ = (f,r) => f>=0&&f<=7&&r>=1&&r<=8 ? String.fromCharCode(97+f)+r : null;
const FILE = sq => sq.charCodeAt(0)-97;
const RANK = sq => parseInt(sq[1]);
const knightJumps = sq => {
  const f=FILE(sq), r=RANK(sq);
  return [[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]]
    .map(([df,dr]) => SQ(f+df,r+dr)).filter(Boolean);
};
const DIAG_DIRS = [[1,1],[1,-1],[-1,1],[-1,-1]];
const STRAIGHT_DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

const updateFenCastling = (fen, sq) => {
  const parts = fen.split(' ');
  let cr = parts[2];
  if (sq === 'e1') cr = cr.replace(/[KQ]/g, '');
  if (sq === 'h1') cr = cr.replace('K', '');
  if (sq === 'a1') cr = cr.replace('Q', '');
  if (sq === 'e8') cr = cr.replace(/[kq]/g, '');
  if (sq === 'h8') cr = cr.replace('k', '');
  if (sq === 'a8') cr = cr.replace('q', '');
  parts[2] = cr || '-';
  return parts.join(' ');
};

const getStandardMoves = (sq, game) => {
  const piece = game.get(sq);
  if (!piece) return [];
  const type = piece.type;
  const color = piece.color;
  const f = FILE(sq), r = RANK(sq);
  const moves = [];

  const addIfEmptyOrCapturable = (targetSq) => {
    const target = game.get(targetSq);
    if (!target) moves.push(targetSq);
    else if (target.color !== color) moves.push(targetSq); // cattura consentita
    return !!target; // true = cella occupata, ferma lo scorrimento
  };

  if (type === 'p') {
    const dir = color === 'w' ? 1 : -1;
    const startRank = color === 'w' ? 2 : 7;
    const oneStep = SQ(f, r + dir);
    if (oneStep && !game.get(oneStep)) {
      moves.push(oneStep);
      const twoSteps = SQ(f, r + 2*dir);
      if (r === startRank && twoSteps && !game.get(twoSteps))
        moves.push(twoSteps);
    }
    for (let df = -1; df <= 1; df += 2) {
      const capSq = SQ(f + df, r + dir);
      if (capSq) {
        const capPiece = game.get(capSq);
        if (capPiece && capPiece.color !== color) moves.push(capSq);
      }
    }
  }
  else if (type === 'n') {
    knightJumps(sq).forEach(tsq => {
      const tp = game.get(tsq);
      if (!tp || tp.color !== color) moves.push(tsq);
    });
  }
  else if (type === 'b') {
    DIAG_DIRS.forEach(([df,dr]) => {
      let cf = f + df, cr = r + dr;
      while (cf>=0 && cf<=7 && cr>=1 && cr<=8) {
        const tsq = SQ(cf, cr);
        if (!tsq) break;
        if (addIfEmptyOrCapturable(tsq)) break;
        cf += df; cr += dr;
      }
    });
  }
  else if (type === 'r') {
    STRAIGHT_DIRS.forEach(([df,dr]) => {
      let cf = f + df, cr = r + dr;
      while (cf>=0 && cf<=7 && cr>=1 && cr<=8) {
        const tsq = SQ(cf, cr);
        if (!tsq) break;
        if (addIfEmptyOrCapturable(tsq)) break;
        cf += df; cr += dr;
      }
    });
  }
  else if (type === 'q') {
    [...DIAG_DIRS, ...STRAIGHT_DIRS].forEach(([df,dr]) => {
      let cf = f + df, cr = r + dr;
      while (cf>=0 && cf<=7 && cr>=1 && cr<=8) {
        const tsq = SQ(cf, cr);
        if (!tsq) break;
        if (addIfEmptyOrCapturable(tsq)) break;
        cf += df; cr += dr;
      }
    });
  }
  else if (type === 'k') {
    // Standard 1-step moves
    for (let df = -1; df <= 1; df++) {
      for (let dr = -1; dr <= 1; dr++) {
        if (df === 0 && dr === 0) continue;
        const tsq = SQ(f + df, r + dr);
        if (!tsq) continue;
        const tp = game.get(tsq);
        if (!tp || tp.color !== color) moves.push(tsq);
      }
    }
    // Arrocco RPG: Solo per diritti e case vuote, ignora completamente lo scacco.
    const castlingRights = game.fen().split(' ')[2];
    if (color === 'w' && sq === 'e1') {
      if (castlingRights.includes('K') && !game.get('f1') && !game.get('g1')) moves.push('g1');
      if (castlingRights.includes('Q') && !game.get('d1') && !game.get('c1') && !game.get('b1')) moves.push('c1');
    } else if (color === 'b' && sq === 'e8') {
      if (castlingRights.includes('k') && !game.get('f8') && !game.get('g8')) moves.push('g8');
      if (castlingRights.includes('q') && !game.get('d8') && !game.get('c8') && !game.get('b8')) moves.push('c8');
    }
  }
  return moves;
};

function buildState(g) {
  const pd={}, sm={};
  g.board().forEach((row, r) => { 
    row.forEach((cell, c) => {
      if (!cell) return;
      const sq = 'abcdefgh'[c] + (8 - r);
      const id = cell.color + cell.type + '_' + nextId();
      pd[id] = {type: cell.type, color: cell.color, level: 1};
      sm[sq] = id;
    }); 
  });
  return {pd, sm};
}

function applyStd(game, from, to, promotion = 'q') {
  const g = new Chess(game.fen());
  const mv = g.move({from, to, promotion});
  if (!mv) return null;
  let p = null;
  if (mv.captured) p = mv.flags && mv.flags.includes('e') ? {type:mv.captured, _sq: to[0]+from[1]} : {type:mv.captured};
  return {game:g, captured:p};
}

function calculateAuraEnergy(oldGame, newGame, oldSm, newSm, pd, color, auraGained) {
  const opp = color === 'w' ? 'b' : 'w';
  let auraExtra = 0;
  const oppDestrieri = [];
  
  Object.entries(oldSm).forEach(([sqA, idA]) => {
    if (pd[idA]?.level === 2 && oldGame.get(sqA)?.type === 'n' && oldGame.get(sqA)?.color === opp) {
      oppDestrieri.push(sqA);
    }
  });

  const entriesNew = Object.entries(newSm);
  oppDestrieri.forEach(sqA => {
    let newSqA = entriesNew.find(e => e[1] === oldSm[sqA])?.[0];
    if (!newSqA) return;
    
    const zoneBefore = knightJumps(sqA);
    const zoneAfter = knightJumps(newSqA);
    
    entriesNew.forEach(([sqE]) => {
      if (sqE === newSqA) return;
      const ep = newGame.get(sqE);
      if (ep && ep.color === color) {
        const wasInZone = oldGame.get(sqE) ? zoneBefore.includes(sqE) : false;
        const isInZone = zoneAfter.includes(sqE);
        if (!wasInZone && isInZone) auraExtra += 1;
        else if (wasInZone && !isInZone) auraExtra += 1;
      }
    });
  });

  auraExtra = Math.max(0, Math.min(auraExtra, 2 - (auraGained[opp] || 0)));
  return auraExtra;
}

function App() {
  const [game, setGame] = useState(() => new Chess());
  const [pd, setPd] = useState({});
  const [sm, setSm] = useState({});
  const [sel, setSel] = useState(null);
  const [moves, setMoves] = useState([]);
  const [pts, setPts] = useState({w:0,b:0});
  const [last, setLast] = useState(null);
  const [flipped, setFlip] = useState(false);
  const [stunned, setStunned] = useState(new Set());
  const [immune, setImmune] = useState(null);
  const [ghostMarch, setGhostMarch] = useState(null);
  const [gameOver, setGameOver] = useState(null);
  const [lvlUpSq, setLvlUpSq] = useState(null);

  const [hasMoved, setHasMoved] = useState(false);
  const [actualTurn, setActualTurn] = useState('w');

  const [cmdMode, setCmdMode] = useState(false);
  const [cmdCost, setCmdCost] = useState(5);
  const [cmdSrc, setCmdSrc] = useState(null);

  const [spectralMode, setSpectralMode] = useState(false);

  const [knightAbilityUsed, setKnightAbilityUsed] = useState(false);
  const [metamorphosis, setMetamorphosis] = useState(null);

  const [auraGained, setAuraGained] = useState({w:0,b:0});
  const lvlTimer = useRef(null);

  useEffect(() => {
    const s = buildState(game);
    setPd(s.pd);
    setSm(s.sm);
  }, []);

  const inEnemyAura = useCallback((sq, myColor) => {
    const opp = myColor === 'w' ? 'b' : 'w';
    return Object.entries(sm).some(([osq, oid]) => {
      const p = game.get(osq);
      return p?.color === opp && p.type === 'n' && pd[oid]?.level === 2 && knightJumps(osq).includes(sq);
    });
  }, [game, sm, pd]);

  const effLevel = useCallback((sq, id, color) => {
    const d = pd[id];
    if (!d) return 1;
    if (d.level === 2 && inEnemyAura(sq, color)) return 1;
    return d.level;
  }, [pd, inEnemyAura]);

  const calcPrestige = useCallback((color) => {
    let total = 0;
    Object.entries(sm).forEach(([sq, id]) => {
      const p = game.get(sq);
      if (p?.color === color && effLevel(sq, id, color) === 2) total += (PRESTIGE[p.type] || 0);
    });
    return total;
  }, [game, sm, pd, effLevel]);

  const activeColor = actualTurn;
  const prestige = calcPrestige(activeColor);
  const pdDiscount = prestige >= PRESTIGE_TIERS.GOLD ? 1 : 0;
  const pdBonusEnergy = prestige >= PRESTIGE_TIERS.SILVER;
  const pdCanDevolve = prestige >= PRESTIGE_TIERS.BRONZE;

  const isImmune = useCallback((sq) => {
    if (!immune || immune.sq !== sq) return false;
    const rookSq = Object.entries(sm).find(e => e[1] === immune.rookId)?.[0];
    if (!rookSq) return false;
    return FILE(rookSq) === FILE(sq) || RANK(rookSq) === RANK(sq);
  }, [immune, sm]);

  const getActualCost = useCallback((baseCost) => Math.max(1, baseCost - pdDiscount), [pdDiscount]);
  const getEvoCost = useCallback((type) => Math.max(1, (EVO_COST[type] || 99) - pdDiscount), [pdDiscount]);

  // Calcola quali case del re sono attualmente minacciate
  const threatenedKings = useMemo(() => {
    const threatened = new Set();
    const attackedByW = new Set();
    const attackedByB = new Set();
    const board = game.board();
    
    for(let r=0; r<8; r++) {
      for(let c=0; c<8; c++) {
        const p = board[r][c];
        if(!p) continue;
        const sq = SQ(c, 8-r);
        const moves = getStandardMoves(sq, game);
        moves.forEach(to => {
          if(p.color === 'w') attackedByW.add(to);
          else attackedByB.add(to);
        });
      }
    }
    
    for(let r=0; r<8; r++) {
      for(let c=0; c<8; c++) {
        const p = board[r][c];
        if(p && p.type === 'k') {
          const sq = SQ(c, 8-r);
          if(p.color === 'w' && attackedByB.has(sq)) threatened.add(sq);
          if(p.color === 'b' && attackedByW.has(sq)) threatened.add(sq);
        }
      }
    }
    return threatened;
  }, [game]);

  const getMoves = useCallback((sq, isCommandTurn, specialMode) => {
    const p = game.get(sq);
    if (!p) return [];
    const color = p.color;
    const id = sm[sq];
    if (!id || stunned.has(id)) return [];
    const evo2 = effLevel(sq, id, color) === 2;
    const result = [];

    if (!specialMode || specialMode === 'normal') {
      const targetSqs = getStandardMoves(sq, game);
      targetSqs.forEach(to => {
        const targetPiece = game.get(to);
        if (targetPiece && isImmune(to)) return;
        const promo = (p.type === 'p' && (RANK(to) === 8 || RANK(to) === 1)) ? 'q' : undefined;
        let moveType = 'std';
        
        // Identifica l'arrocco per indirizzarlo alla gestione manuale in execute
        if (p.type === 'k' && Math.abs(FILE(sq) - FILE(to)) === 2) {
          moveType = 'castle';
        }
        
        result.push({ type: moveType, from: sq, to, promo });
      });
    }

    if (!evo2) return result;

    if (specialMode === 'spectralStep' && p.type === 'b') {
      DIAG_DIRS.forEach(([df, dr]) => {
        let cf = FILE(sq) + df, cr = RANK(sq) + dr;
        while (cf >= 0 && cf <= 7 && cr >= 1 && cr <= 8) {
          const tsq = SQ(cf, cr);
          if (!game.get(tsq)) {
            result.push({type: 'spectral_step', from: sq, to: tsq});
          }
          cf += df; cr += dr;
        }
      });
      return result;
    }

    if (p.type === 'p') {
      const dir = color === 'w' ? 1 : -1;
      const f = FILE(sq), r = RANK(sq);
      for (let df = -1; df <= 1; df++) {
        const tsq = SQ(f + df, r + dir);
        if (!tsq || result.some(mm => mm.to === tsq)) continue;
        const tp = game.get(tsq);
        if (df === 0 && tp) continue;
        if (df !== 0 && tp && tp.color === color) continue;
        result.push({type: 'std', from: sq, to: tsq});
      }
    }
    if (p.type === 'b') {
      DIAG_DIRS.forEach(([df, dr]) => {
        let cf = FILE(sq) + df, cr = RANK(sq) + dr;
        let first = null, firstSq = null;
        while (cf >= 0 && cf <= 7 && cr >= 1 && cr <= 8) {
          const tsq = SQ(cf, cr); if (!tsq) break;
          const tp = game.get(tsq);
          if (!first) {
            if (tp) { first = tp; firstSq = tsq; }
          } else {
            if (!tp) {
              result.push({type: 'bishop_jump', from: sq, to: tsq, jumped: firstSq, jumpedId: sm[firstSq], jumpedColor: first.color});
            } else {
              if (tp.color !== color) {
                result.push({type: 'bishop_jump', from: sq, to: tsq, jumped: firstSq, jumpedId: sm[firstSq], jumpedColor: first.color, capture: true});
              }
              break;
            }
          }
          cf += df; cr += dr;
        }
      });
    }
    if (p.type === 'q') {
      knightJumps(sq).forEach(tsq => {
        if (result.some(mm => mm.to === tsq)) return;
        const tp = game.get(tsq);
        if (tp && tp.color === color) return;
        result.push({type: 'std', from: sq, to: tsq});
      });
    }
    if (p.type === 'r') {
      const f = FILE(sq), r = RANK(sq);
      Object.entries(sm).forEach(([osq, oid]) => {
        if (osq === sq) return;
        const op = game.get(osq);
        if (!op || op.color !== color || op.type === 'k') return;
        if (f === FILE(osq) || r === RANK(osq)) {
          result.push({type: 'swap', from: sq, to: osq});
        }
      });
    }
    if (ghostMarch === color && (p.type === 'r' || p.type === 'q')) {
      let dirs = [...STRAIGHT_DIRS];
      if (p.type === 'q') dirs = [...dirs, ...DIAG_DIRS];
      dirs.forEach(([df, dr]) => {
        let cf = FILE(sq) + df, cr = RANK(sq) + dr;
        while (cf >= 0 && cf <= 7 && cr >= 1 && cr <= 8) {
          const tsq = SQ(cf, cr); if (!tsq) break;
          const tp = game.get(tsq);
          if (!tp) {
            if (!result.some(mm => mm.to === tsq)) {
              result.push({type: 'std', from: sq, to: tsq});
            }
          } else if (tp.color === color && tp.type === 'p' && effLevel(tsq, sm[tsq], color) === 2) {
            cf += df; cr += dr; continue;
          } else break;
          cf += df; cr += dr;
        }
      });
    }

    return result;
  }, [game, sm, pd, stunned, ghostMarch, isImmune, effLevel]);

  const execute = useCallback((action, color) => {
    let ng, energyDelta = 0;
    const npd = { ...pd };
    const nsm = { ...sm };
    const newStunned = new Set(stunned);
    const mid = sm[action.from];

    if (action.type === 'std') {
      const res = applyStd(game, action.from, action.to, action.promo);
      if (!res) {
        // Fallback manuale per mosse "illecite" nel gioco classico (es: muovere mentre il re è sotto scacco)
        ng = new Chess(game.fen());
        const p = game.get(action.from);
        const tp = game.get(action.to);
        ng.remove(action.from);
        const isPromo = (p.type === 'p' && (RANK(action.to) === 8 || RANK(action.to) === 1));
        const finalType = isPromo ? (action.promo || 'q') : p.type;
        
        if (tp) {
          if (tp.type === 'k') { 
            setGameOver({ winner: color, reason: '🏆 Hai annientato il Re avversario!' }); 
            AudioManager.play('victory'); return true;

        if (isPromo) npd[mid] = { ...npd[mid], type: finalType, level: 1 };

      } else {

        const parts = ng.fen().split(' ');
        parts[1] = color; parts[3] = '-';

        energyDelta = ENERGY.MOVE + (res.captured ? ENERGY.CAPTURE : 0);
        if (npd[mid]?.type === 'p' && npd[mid].level === 2 && res.captured) energyDelta += ENERGY.ASSALTATORE_CAPTURE;
        
        if (res.captured) {

            if(res.captured.type === 'k') {
                setGameOver({ winner: color, reason: '🏆 Hai annientato il Re avversario!' }); 
                AudioManager.play('victory'); return true; 
            }
            delete npd[nsm[cs]]; delete nsm[cs]; 
        }
        
        nsm[action.to] = mid; delete nsm[action.from];
        const promoPiece = game.get(action.from);
        if (promoPiece?.type === 'p' && (RANK(action.to) === 8 || RANK(action.to) === 1)) {
          npd[mid] = { ...npd[mid], type: action.promo || 'q', level: 1 };
        }
        setHasMoved(true);
      }
      energyDelta >= ENERGY.CAPTURE + ENERGY.MOVE ? AudioManager.play('capture') : AudioManager.play('move');
    }
    else if (action.type === 'castle') {
      ng = new Chess(game.fen());
      ng.remove(action.from);
      ng.put({type: 'k', color}, action.to);
      let rookFrom, rookTo;
      if (action.to === 'g1') { rookFrom = 'h1'; rookTo = 'f1'; }
      else if (action.to === 'c1') { rookFrom = 'a1'; rookTo = 'd1'; }
      else if (action.to === 'g8') { rookFrom = 'h8'; rookTo = 'f8'; }
      else if (action.to === 'c8') { rookFrom = 'a8'; rookTo = 'd8'; }

      ng.remove(rookFrom);
      ng.put({type: 'r', color}, rookTo);

      nsm[action.to] = mid; delete nsm[action.from];
      nsm[rookTo] = nsm[rookFrom]; delete nsm[rookFrom];

      energyDelta = ENERGY.MOVE;
      let fen = updateFenCastling(ng.fen(), action.from); // revocherà i diritti del re
      const parts = fen.split(' ');
      parts[1] = color; parts[3] = '-'; parts[4] = '0';
      ng = new Chess(parts.join(' '));
      
      setHasMoved(true);
      AudioManager.play('move');
    }
    else if (action.type === 'bishop_jump') {
      ng = new Chess(game.fen());
      const tp = game.get(action.to);
      ng.remove(action.from);
      if (action.capture && tp) {
        if (tp.type === 'k') { 
          setGameOver({ winner: color, reason: '🏆 Hai annientato il Re avversario!' }); 
          AudioManager.play('victory'); return true; 
        }
        delete npd[nsm[action.to]];
        delete nsm[action.to];
        energyDelta += ENERGY.CAPTURE;
      }
      ng.put({type: 'b', color}, action.to);
      nsm[action.to] = mid; delete nsm[action.from];
      energyDelta += ENERGY.MOVE;
      let tempFen = updateFenCastling(ng.fen(), action.to);
      const parts = tempFen.split(' '); parts[1]=color; parts[3]='-'; parts[4]='0';
      ng = new Chess(parts.join(' '));
      setHasMoved(true);
      tp ? AudioManager.play('capture') : AudioManager.play('move');
    }
    else if (action.type === 'spectral_step') {
      const cost = getActualCost(ABILITY_BASE_COST.spectralStep);
      if (pts[color] < cost) { AudioManager.play('error'); return false; }
      energyDelta = -cost + ENERGY.MOVE;
      ng = new Chess(game.fen());
      const tp = game.get(action.to);
      ng.remove(action.from);
      if (tp) {
        if (tp.type === 'k') { 
          setGameOver({ winner: color, reason: '🏆 Hai annientato il Re avversario!' }); 
          AudioManager.play('victory'); return true; 
        }
        delete npd[nsm[action.to]];
        delete nsm[action.to];
        energyDelta += ENERGY.CAPTURE;
      }
      ng.put({type: 'b', color}, action.to);
      nsm[action.to] = mid; delete nsm[action.from];
      let tempFen = updateFenCastling(ng.fen(), action.to);
      const parts = tempFen.split(' '); parts[1]=color; parts[3]='-'; parts[4]='0';
      ng = new Chess(parts.join(' '));
      AudioManager.play('ability');
    }
    else if (action.type === 'swap') {
      const p1 = game.get(action.from), p2 = game.get(action.to);
      ng = new Chess(game.fen()); ng.remove(action.from); ng.remove(action.to);
      ng.put(p1, action.to); ng.put(p2, action.from);
      
      let tempFen = updateFenCastling(ng.fen(), action.from);
      tempFen = updateFenCastling(tempFen, action.to);
      const parts = tempFen.split(' '); parts[1]=color; parts[3]='-'; parts[4]='0';
      ng = new Chess(parts.join(' '));
      
      const tempId = nsm[action.from];
      nsm[action.from] = nsm[action.to];
      nsm[action.to] = tempId;
      energyDelta = ENERGY.MOVE;

      const isAdjEnemy = (targetSq) => {
        const tf = FILE(targetSq), tr = RANK(targetSq);
        for (let df = -1; df <= 1; df++) {
          for (let dr = -1; dr <= 1; dr++) {
            if (df === 0 && dr === 0) continue;
            const adjSq = SQ(tf + df, tr + dr);
            if (adjSq && ng.get(adjSq)?.color !== color) return true;
          }
        }
        return false;
      };
      if (isAdjEnemy(action.from) || isAdjEnemy(action.to)) energyDelta += ENERGY.ADJACENT_ENEMY;

      setHasMoved(true);
      AudioManager.play('move');
    }
    else return false;

    const auraExtra = calculateAuraEnergy(game, ng, sm, nsm, pd, color, auraGained);
    const opp = color === 'w' ? 'b' : 'w';
    
    setGame(ng); setPd(npd); setSm(nsm);
    setPts(prev => ({...prev, [color]: Math.max(0, prev[color] + energyDelta), [opp]: prev[opp] + auraExtra}));
    setStunned(newStunned); 
    setAuraGained(prev => ({...prev, [opp]: (prev[opp] || 0) + auraExtra}));
    setLast({from: action.from, to: action.to});
    setSel(null); setMoves([]); setSpectralMode(false);

    return true;
  }, [game, pd, sm, pts, stunned, immune, ghostMarch, auraGained, getActualCost]);

  const passTurn = useCallback(() => {
    if (!hasMoved) return;
    const next = actualTurn === 'w' ? 'b' : 'w';
    
    setStunned(prev => {
      const ns = new Set(prev);
      Object.values(sm).forEach(id => { if (pd[id]?.color === actualTurn) ns.delete(id); });
      return ns;
    });
    
    setImmune(null);
    if (ghostMarch === actualTurn) setGhostMarch(null);
    if (calcPrestige(next) >= PRESTIGE_TIERS.SILVER) {
      setPts(prev => ({...prev, [next]: prev[next] + 1}));
    }
    
    setAuraGained({w:0,b:0});
    setKnightAbilityUsed(false);

    let mSqRestore = null, mColRestore = null;
    if (metamorphosis?.expiresAfterColor === actualTurn) {
      const entry = Object.entries(sm).find(e => e[1] === metamorphosis.id);
      if (entry) {
        mSqRestore = entry[0];
        mColRestore = pd[metamorphosis.id]?.color;
      }
      setPd(prev => {
        const npd = {...prev};
        if (npd[metamorphosis.id]) {
          const {morphOriginal, morphExpires, ...rest} = npd[metamorphosis.id];
          npd[metamorphosis.id] = rest;
        }
        return npd;
      });
      setMetamorphosis(null);
    }

    setHasMoved(false);
    setSel(null); setMoves([]);
    setCmdMode(false); setCmdSrc(null);
    setSpectralMode(false);
    setActualTurn(next);
    
    setGame(prev => {
      let ng = prev;
      if (mSqRestore && mColRestore) {
        const ng2 = new Chess(ng.fen());
        ng2.remove(mSqRestore);
        ng2.put({type:'r', color:mColRestore}, mSqRestore);
        ng = ng2;
      }
      const fenParts = ng.fen().split(' ');
      fenParts[1] = next;
      return new Chess(fenParts.join(' '));
    });
  }, [hasMoved, actualTurn, pd, sm, calcPrestige, ghostMarch, metamorphosis]);

  const click = useCallback((sq) => {

        if (p?.color === color && p.type !== 'q') {

          setSel(sq); setMoves(getMoves(sq, true, 'normal'));

      } else {

        setPts(prev => ({...prev, [color]: prev[color] + cmdCost}));

      return;
    }

    if (spectralMode) {

        if (move) { execute(move, color); return; }

      setSpectralMode(false); setSel(null); setMoves([]);
      return;
    }

    if (sel && sq && moves.length > 0) {
      const move = moves.find(m => m.to === sq && ['std', 'swap', 'bishop_jump', 'castle'].includes(m.type));
      if (move) { execute(move, color); return; }
    }

    if (!hasMoved) {
      if (!sq) { setSel(null); setMoves([]); return; }
      
      const p = game.get(sq);
      if (p?.color === color && !stunned.has(sm[sq])) {

      }
      return;
    }

    if (!sq) { setSel(null); setMoves([]); return; }
    const p = game.get(sq);
    if (!p || p.color !== color || stunned.has(sm[sq])) { setSel(null); setMoves([]); return; }
    
    const id = sm[sq];
    const d = pd[id];
    const lv = effLevel(sq, id, color);

  const renderPanel = () => {

        <button className="pass-btn" style={{background: '#1e293b', color: '#94a3b8'}} onClick={() => {
          setCmdMode(false); setCmdSrc(null);
          setPts(prev => ({...prev, [activeColor]: prev[activeColor] + cmdCost}));
        }}>✕ Annulla (rimborso {cmdCost}⚡)</button>
      </div>
    );

    return (
      <React.Fragment>
        <div>
          <div className="charge-row">
            <span>⚡ {activeColor === 'w' ? 'BIANCO' : 'NERO'}{pdBonusEnergy ? ' (+1)' : ''}{ghostMarch === activeColor ? ' 👻 Marcia' : ''}</span>
            <span style={{color: '#f1f5f9'}}>{pts[activeColor]}⚡</span>
          </div>
          <div className="charge-track">
            <div style={{width: Math.min(pts[activeColor] / 10 * 100, 100) + '%', height: '100%', background: '#38bdf8', transition: 'width .3s'}} />
          </div>
        </div>
        <div className="panel-bottom">
          <div className="piece-label">
            {!hasMoved ? (
              <span className="hint-text">Seleziona un pezzo e muovi.</span>
            ) : selData ? (
              <span style={{fontWeight: 700}}>
                {selPiece && ICONS[selPiece.color][selPiece.type]} 
                {selEffLevel === 2 ? EVO_NAMES[selPiece?.type] : 'Base'} Lv. {selEffLevel}
                {stunned.has(selId) && <span style={{color: '#818cf8'}}> (Stordito)</span>}
                {immune?.sq === sel && <span style={{color: '#fbbf24'}}> (Immune)</span>}
                {pd[selId]?.morphOriginal && <span style={{color: '#f59e0b'}}> (Morph)</span>}
              </span>
            ) : (
              <span className="hint-text">Clicca un pezzo base per evolvere, o un evoluto per le abilità.</span>
            )}
          </div>
          <div className="turn-pill" style={{color: activeColor === 'w' ? '#38bdf8' : '#f43f5e'}}>
            {activeColor === 'w' ? '⬜ Bianco' : '⬛ Nero'}
          </div>
        </div>
        {hasMoved && pieceAbilities.length > 0 && (
          <div className="btn-row">
            {pieceAbilities.map((ab, i) => (
              <button key={i} className="ability-btn" 
                style={{borderColor: ab.available ? '#a855f7' : '#475569', color: ab.available ? '#a855f7' : '#64748b'}} 
                disabled={!ab.available} onClick={ab.action}>
                {ab.name} ({ab.cost}⚡)
              </button>
            ))}
          </div>
        )}
        {hasMoved && sel && selEffLevel === 2 && pdCanDevolve && !pd[selId]?.morphOriginal && (
          <button className="ability-btn" style={{background: '#7f1d1d', color: '#fca5a5', marginTop: 4}} onClick={devolveSelected}>
            ↩ De-evolvi +1⚡
          </button>
        )}
        {hasMoved && (
          <button className="pass-btn" onClick={passTurn}>Passa il turno →</button>
        )}
      </React.Fragment>
    );
  };

  return (
    <div className="app">
      <div className="top-bar">
        <div className="prestige-badge">
          ⭐ {prestige}{prestige >= PRESTIGE_TIERS.BRONZE && ' 🥉'}{prestige >= PRESTIGE_TIERS.SILVER && ' 🥈'}{prestige >= PRESTIGE_TIERS.GOLD && ' 🥇'}
        </div>
        <button className="flip-btn" onClick={() => setFlip(f => !f)}>🔄 Ruota</button>
      </div>

      <div className="player-row">
        <div className="player-label" style={{borderLeft: '3px solid #f43f5e'}}>
          <div className="player-name">⬛ Nero</div>
          {last && <div className="last-move-hint">{last.from} → {last.to}</div>}
        </div>
        <div className="energy-badge" style={{borderLeft: '3px solid #f43f5e', color: pts.b > 0 ? '#22c55e' : '#94a3b8'}}>
          <span style={{fontSize: 10}}>⚡</span>
          <span style={{fontSize: 16}}>{pts.b}</span>
        </div>
      </div>

      <div className="board-wrap">
        <div className="board" onClick={(e) => { if (e.target === e.currentTarget) click(null); }}>
          {bd.map((row, r) => row.map((cell, c) => {
            const fi = flipped ? 7 - c : c, ri = flipped ? r : 7 - r;
            const sq = 'abcdefgh'[fi] + (ri + 1);
            const light = (fi + ri) % 2 !== 0;
            const id = sm[sq], d = id ? pd[id] : null;
            const pieceColor = game.get(sq)?.color;
            const displayLv = (id && pieceColor) ? effLevel(sq, id, pieceColor) : (d ? d.level : 1);
            const isStunned = stunned.has(id);
            const isImm = immune?.sq === sq;
            const isAura = inEnemyAura(sq, activeColor);
            const isSel = sel === sq;
            const isMoveTarget = moveTargets.has(sq);
            const isAbTarget = abilityTargets.has(sq);
            const isLastFrom = last?.from === sq;
            const isLastTo = last?.to === sq;
            const isGhostAlly = ghostMarch === pieceColor && pieceColor === activeColor && game.get(sq)?.type === 'p' && displayLv === 2;
            const isMorph = d?.morphOriginal;
            const isThreatenedKing = threatenedKings.has(sq); // Controlla se è un re in pericolo

            const classes = ['cell', light ? 'light' : 'dark'];
            if (isSel) classes.push('sel');
            if (isAura) classes.push('aura-cell');
            if (isStunned) classes.push('stunned-piece');
            if (isImm) classes.push('immune-highlight');
            if (isGhostAlly) classes.push('ghost-march-ally');
            if (isMorph) classes.push('morph-piece');
            if (isLastFrom) classes.push('last-from');
            if (isLastTo) classes.push('last-to');
            if (isThreatenedKing) classes.push('king-threatened');

            return (
              <div key={sq} className={classes.join(' ')} onClick={() => click(sq)}>
                {isMoveTarget && !isAbTarget && !cell && <div style={{position: 'absolute', width: '30%', height: '30%', borderRadius: '50%', background: '#22c55e', boxShadow: '0 0 10px #22c55e', zIndex: 1, pointerEvents: 'none'}} />}
                {isAbTarget && !cell && <div style={{position: 'absolute', width: '32%', height: '32%', borderRadius: '50%', background: '#a855f7', boxShadow: '0 0 12px #a855f7', zIndex: 1, pointerEvents: 'none'}} />}
                {isMoveTarget && cell && !isAbTarget && <div style={{position: 'absolute', inset: 0, border: '3px solid #22c55e', borderRadius: 3, zIndex: 1, pointerEvents: 'none'}} />}
                {isAbTarget && cell && <div style={{position: 'absolute', inset: 0, border: '3px solid #a855f7', borderRadius: 3, zIndex: 1, pointerEvents: 'none'}} />}
                
                {cell && (
                  <span className={`piece piece-${cell.color} ${displayLv === 2 ? 'evo2' : ''}`} 
                        style={{transform: lvlUpSq === sq ? 'scale(1.5)' : 'scale(1)', transition: 'transform .15s'}}
                        onAnimationEnd={() => setLvlUpSq(null)}>
                    {ICONS[cell.color][cell.type]}
                  </span>
                )}
                
                {displayLv === 2 && <div style={{position: 'absolute', inset: 3, border: '2px solid #a855f7', borderRadius: 4, pointerEvents: 'none', boxShadow: '0 0 10px rgba(168,85,247,.8)', zIndex: 3}} />}
              </div>
            );
          }))}
        </div>
      </div>

      <div className="player-row">
        <div className="player-label" style={{borderLeft: '3px solid #f8fafc'}}>
          <div className="player-name">⬜ Bianco</div>
          {last && <div className="last-move-hint">{last.from} → {last.to}</div>}
        </div>
        <div className="energy-badge" style={{borderLeft: '3px solid #38bdf8', color: pts.w > 0 ? '#22c55e' : '#94a3b8'}}>
          <span style={{fontSize: 10}}>⚡</span>
          <span style={{fontSize: 16}}>{pts.w}</span>
        </div>
      </div>

      <div className="panel">{renderPanel()}</div>

      <div className="top-bar" style={{justifyContent: 'center'}}>
        <button onClick={reset} style={{padding: '4px 16px', background: '#1e293b', color: '#94a3b8', borderRadius: 6, fontSize: 12, cursor: 'pointer', border: 'none'}}>
          🔄 Nuova Partita
        </button>
      </div>

      {gameOver && (
        <div style={{position: 'fixed', inset: 0, background: 'rgba(0,0,0,.92)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', zIndex: 99, gap: 14}}>
          <div style={{fontSize: 26, fontWeight: 900, color: '#f1f5f9'}}>
            {gameOver.winner ? `🏆 ${gameOver.winner === 'w' ? '⬜ Bianco' : '⬛ Nero'} vince!` : '🤝 Patta'}
          </div>
          <div style={{fontSize: 12, color: '#64748b'}}>{gameOver.reason}</div>
          <button onClick={reset} style={{padding: '12px 40px', background: '#38bdf8', border: 'none', borderRadius: 9, fontWeight: 800, fontSize: 15, cursor: 'pointer'}}>
            RIVINCITA
          </button>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
