<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Chess RPG - Omega Neural V5.8.9 Light</title>
    <style>
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        html,body{height:100%;margin:0;overflow:hidden;background:#060913}
        #root{height:100%}
        .app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:8px;gap:6px;color:#f1f5f9;font-family:system-ui,sans-serif}
        .top-bar{flex-shrink:0;height:40px;display:flex;gap:6px;align-items:center}
        .mode-btn{flex:1;height:100%;background:#0b0f19;border:1px solid #1e293b;color:#94a3b8;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
        .mode-btn.active{color:#030712!important}
        .flip-btn{flex-shrink:0;padding:0 12px;height:100%;background:#1e293b;border:none;color:#94a3b8;border-radius:8px;font-size:13px;cursor:pointer}
        .train-btn{flex-shrink:0;padding:0 8px;height:100%;background:#22c55e;border:none;color:#030712;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer}
        .train-btn:disabled{opacity:0.5;cursor:not-allowed}
        .stop-btn{flex-shrink:0;padding:0 8px;height:100%;background:#ef4444;border:none;color:white;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer}
        .player-row{flex-shrink:0;height:48px;display:flex;gap:8px;align-items:center}
        .player-label{flex:1;height:100%;background:#0b0f19;border:1px solid #1e293b;border-radius:10px;display:flex;flex-direction:column;justify-content:center;padding:0 12px;overflow:hidden}
        .player-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px}
        .last-move-hint{font-size:10px;color:#475569;margin-top:1px}
        .thinking-dot{flex-shrink:0;width:7px;height:7px;border-radius:50%;background:#38bdf8;animation:blink 1s infinite}
        @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
        .energy-badge{flex-shrink:0;width:58px;height:100%;background:#0b0f19;border:1px solid #1e293b;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900}
        .board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
        .board{--side:min(calc(100vw - 16px),calc(100vh - 280px));width:var(--side);height:var(--side);display:grid;grid-template-columns:repeat(8,1fr);border-radius:4px;overflow:hidden;border:3px solid #4b3220;box-shadow:0 0 0 5px #6b4423,0 6px 24px rgba(0,0,0,.6)}
        .cell{position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--side,300px)/8*.72);cursor:pointer;aspect-ratio:1/1}
        .cell.light{background:#f0d9b5}.cell.dark{background:#b58863}
        .cell.last-from.light,.cell.last-to.light{background:#f6f669}
        .cell.last-from.dark,.cell.last-to.dark{background:#c8b400}
        .cell.sel{outline:3px solid #a855f7;outline-offset:-3px;background:#2d1f4e!important}
        .cell.evo-highlight{outline:3px dashed #0ea5e9;outline-offset:-3px}
        .cell.summon-highlight{outline:2px dashed #ec4899;outline-offset:-2px}
        .cell.devolve-target-highlight{outline:2px dashed #22c55e;outline-offset:-2px}
        .piece{font-family:"Segoe UI Symbol","Noto Sans Symbols",sans-serif;line-height:1;user-select:none;z-index:2}
        .piece-w{color:#fef9f0;-webkit-text-stroke:1.8px #1a0a00;filter:drop-shadow(0 2px 4px rgba(0,0,0,.75))}
        .piece-b{color:#0f0800;-webkit-text-stroke:.5px rgba(255,255,255,.1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
        .evo2{filter:drop-shadow(0 0 4px #a855f7)!important}
        .summoned-pawn{outline:2px solid #6b7280;outline-offset:-2px;border-radius:2px}
        .panel{flex-shrink:0;height:80px;background:#0b0f19;border:1px solid #1e293b;border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;gap:5px}
        .charge-row{display:flex;justify-content:space-between;font-size:10px;font-weight:800;color:#94a3b8}
        .charge-track{width:100%;height:4px;background:#1e293b;border-radius:2px;overflow:hidden;margin-top:2px}
        .panel-bottom{display:flex;align-items:center;gap:6px;flex:1}
        .piece-label{flex:1;font-size:11px;min-width:0}
        .turn-pill{flex-shrink:0;padding:3px 8px;border-radius:16px;font-size:11px;font-weight:700;background:#1e293b}
        .debug-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(6,9,19,.95);padding:3px 10px;font-size:9px;color:#38bdf8;border-top:1px solid #1e293b;z-index:50;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .progress-bar{width:100%;height:6px;background:#1e293b;border-radius:3px;overflow:hidden;margin:10px 0}
        .progress-fill{height:100%;background:linear-gradient(90deg,#22c55e,#eab308);transition:width 0.3s}
        @keyframes lvlup{0%{transform:scale(1)}40%{transform:scale(1.8) rotate(10deg)}100%{transform:scale(1)}}
    </style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef} = React;
const Chess = window.Chess;
const ICONS = {w:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};

// ═══════════ VERSIONE LIGHT - FUNZIONI ESSENZIALI ═══════════
function isValidSquare(sq) {
    return /^[a-h][1-8]$/.test(sq);
}

function buildState(g) {
    const pd = {}, sm = {};
    g.board().forEach((row, r) => row.forEach((cell, c) => {
        if (cell) {
            const sq = 'abcdefgh'[c] + (8 - r);
            pd[`${cell.color}${cell.type}_${sq}`] = { type: cell.type, color: cell.color, level: 1 };
            sm[sq] = `${cell.color}${cell.type}_${sq}`;
        }
    }));
    return { pd, sm };
}

// ═══════════ RPG SEMPLIFICATO ═══════════
const BASE_VALS = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 200 };

function rpgVal(type, level) {
    const b = BASE_VALS[type] || 0;
    if (level === 2) return b * 1.5;
    return b;
}

function getStandardMoves(game) {
    const moves = game.moves({ verbose: true });
    return moves.filter(m => {
        const target = game.get(m.to);
        return !target || target.type !== 'k';
    }).map(m => ({
        type: 'move',
        from: m.from,
        to: m.to,
        promotion: m.promotion || 'q'
    }));
}

function applyAction(game, pd, sm, pts, action, cooldowns) {
    try {
        const color = game.turn();
        let ng = new Chess(game.fen());
        let nsm = { ...sm };
        let npd = { ...pd };
        let cap = null;
        
        if (action.type === 'move') {
            const mv = ng.move({ from: action.from, to: action.to, promotion: action.promotion || 'q' });
            if (!mv) return null;
            if (mv.captured) cap = { type: mv.captured, sq: action.to };
            if (mv.flags?.includes('e')) cap = { type: 'p', sq: action.to[0] + action.from[1] };
        } else {
            return null; // Per la versione light, solo mosse standard
        }
        
        // Gestione cattura
        if (cap) {
            const cs = cap.sq;
            const cid = nsm[cs];
            if (cid) { delete npd[cid]; delete nsm[cs]; }
        }
        
        // Aggiorna posizione
        const mid = nsm[action.from];
        if (mid) {
            // Gestione promozione
            const np = ng.get(action.to);
            if (np && npd[mid] && np.type !== npd[mid].type) {
                const newId = `${np.color}${np.type}_${Date.now().toString(36)}`;
                npd[newId] = { type: np.type, color: np.color, level: 1 };
                delete npd[mid];
                nsm[action.to] = newId;
            } else {
                nsm[action.to] = mid;
            }
        }
        delete nsm[action.from];
        
        // Gestione arrocco
        if (action.from === 'e1' && action.to === 'g1') {
            nsm['f1'] = nsm['h1']; delete nsm['h1'];
        }
        if (action.from === 'e1' && action.to === 'c1') {
            nsm['d1'] = nsm['a1']; delete nsm['a1'];
        }
        if (action.from === 'e8' && action.to === 'g8') {
            nsm['f8'] = nsm['h8']; delete nsm['h8'];
        }
        if (action.from === 'e8' && action.to === 'c8') {
            nsm['d8'] = nsm['a8']; delete nsm['a8'];
        }
        
        let p = 1;
        if (cap) p++;
        if (ng.in_check()) p++;
        
        return {
            game: ng,
            pd: npd,
            sm: nsm,
            pts: { ...pts, [color]: (pts[color] || 0) + p },
            cooldowns: { ...cooldowns }
        };
    } catch (e) {
        return null;
    }
}

// ═══════════ AI SEMPLIFICATA ═══════════
function simpleEvaluate(game, color) {
    let score = 0;
    const board = game.board();
    const opp = color === 'w' ? 'b' : 'w';
    
    // Valutazione materiale
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            const p = board[r][c];
            if (!p) continue;
            const val = BASE_VALS[p.type] || 0;
            score += p.color === color ? val : -val;
            
            // Bonus centro
            if ((r === 3 || r === 4) && (c === 3 || c === 4)) {
                score += p.color === color ? 0.5 : -0.5;
            }
        }
    }
    
    // Scacco matto
    if (game.in_checkmate()) {
        return game.turn() === color ? -1000 : 1000;
    }
    
    // Scacco
    if (game.in_check()) {
        score += game.turn() === color ? -1 : 1;
    }
    
    return score + Math.random() * 0.1;
}

function chooseBestMove(game, pd, sm, pts, color, cooldowns) {
    const moves = getStandardMoves(game);
    if (moves.length === 0) return null;
    
    // 20% esplorazione casuale
    if (Math.random() < 0.2) {
        return moves[Math.floor(Math.random() * moves.length)];
    }
    
    // Valuta ogni mossa (solo 1 livello di profondità)
    let bestMove = moves[0];
    let bestScore = -Infinity;
    
    for (const move of moves) {
        const next = applyAction(game, pd, sm, pts, move, cooldowns);
        if (!next) continue;
        
        const score = simpleEvaluate(next.game, color);
        if (score > bestScore) {
            bestScore = score;
            bestMove = move;
        }
    }
    
    return bestMove;
}

// ═══════════ TRAINING OTTIMIZZATO ═══════════
let brainStats = {
    games: parseInt(localStorage.getItem('omega_games_count') || '0'),
    wins: { w: 0, b: 0 }
};

async function trainBatch(gamesInBatch = 50, onProgress = () => {}, stopSignal = () => false) {
    let completed = 0;
    
    for (let i = 0; i < gamesInBatch; i++) {
        if (stopSignal()) break;
        
        const g = new Chess();
        let state = { game: g, ...buildState(g), cooldowns: {} };
        
        // Massimo 150 mosse per partita
        for (let mc = 0; mc < 150; mc++) {
            if (state.game.game_over()) break;
            if (stopSignal()) break;
            
            const color = state.game.turn();
            const action = chooseBestMove(state.game, state.pd, state.sm, state.pts, color, state.cooldowns);
            
            if (!action) break;
            
            const next = applyAction(state.game, state.pd, state.sm, state.pts, action, state.cooldowns);
            if (!next) break;
            
            state = next;
        }
        
        if (state.game.in_checkmate()) {
            const winner = state.game.turn() === 'w' ? 'b' : 'w';
            brainStats.wins[winner] = (brainStats.wins[winner] || 0) + 1;
        }
        
        completed++;
        brainStats.games++;
    }
    
    // Salva ogni batch
    localStorage.setItem('omega_games_count', brainStats.games.toString());
    onProgress({ completed, total: brainStats.games });
    
    return completed;
}

async function startTraining(totalGames = 2000, onProgress = () => {}, onComplete = () => {}, stopSignal = () => false) {
    const BATCH_SIZE = 25; // Batch più piccoli per non bloccare
    let trained = 0;
    
    while (trained < totalGames && !stopSignal()) {
        const result = await trainBatch(BATCH_SIZE, (p) => {
            onProgress({ 
                current: trained + p.completed, 
                total: totalGames,
                wins: brainStats.wins 
            });
        }, stopSignal);
        
        trained += result;
        
        // Lascia respirare il browser tra i batch
        await new Promise(resolve => setTimeout(resolve, 50));
    }
    
    onComplete({ total: trained, wins: brainStats.wins });
    return trained;
}

// ═══════════ APP PRINCIPALE ═══════════
const PERSONALITIES = {
    human: { name: 'Umano', ai: false, color: '#94a3b8' },
    omega: { name: 'Omega Light', ai: true, color: '#eab308' }
};

function App() {
    const [game, setGame] = useState(() => new Chess());
    const [pd, setPd] = useState({});
    const [sm, setSm] = useState({});
    const [sel, setSel] = useState(null);
    const [legalMoves, setLegalMoves] = useState([]);
    const [pts, setPts] = useState({ w: 0, b: 0 });
    const [wAI, setWAI] = useState('human');
    const [bAI, setBAI] = useState('omega');
    const [thinking, setThink] = useState(false);
    const [last, setLast] = useState(null);
    const [flipped, setFlip] = useState(false);
    const [debug, setDebug] = useState('');
    const [training, setTraining] = useState(false);
    const [trainProgress, setTrainProgress] = useState({ current: 0, total: 2000 });
    const [cooldowns, setCooldowns] = useState({});
    
    const timer = useRef(null);
    const gen = useRef(0);
    const stopTraining = useRef(false);

    useEffect(() => {
        const s = buildState(game);
        setPd(s.pd);
        setSm(s.sm);
    }, []);

    useEffect(() => {
        setFlip(!PERSONALITIES[bAI]?.ai && PERSONALITIES[wAI]?.ai);
    }, [wAI, bAI]);

    const click = useCallback((sq) => {
        if (!isValidSquare(sq) || thinking || training) return;
        
        const turn = game.turn();
        const isHuman = turn === 'w' ? !PERSONALITIES[wAI]?.ai : !PERSONALITIES[bAI]?.ai;
        if (!isHuman) return;
        
        if (sel) {
            const move = legalMoves.find(m => m.to === sq);
            if (move) {
                const next = applyAction(game, pd, sm, pts, move, cooldowns);
                if (!next) return;
                
                setPts(next.pts);
                setGame(next.game);
                setPd(next.pd);
                setSm(next.sm);
                setCooldowns(next.cooldowns || {});
                setSel(null);
                setLegalMoves([]);
                setLast({ from: move.from, to: move.to });
                
                if (next.game.game_over()) {
                    brainStats.games++;
                    localStorage.setItem('omega_games_count', brainStats.games.toString());
                }
                return;
            }
            
            const p = game.get(sq);
            if (p && p.color === turn) {
                setSel(sq);
                setLegalMoves(getStandardMoves(game).filter(m => m.from === sq));
                return;
            }
            
            setSel(null);
            setLegalMoves([]);
            return;
        }
        
        const p = game.get(sq);
        if (p && p.color === turn) {
            setSel(sq);
            setLegalMoves(getStandardMoves(game).filter(m => m.from === sq));
        } else {
            setSel(null);
            setLegalMoves([]);
        }
    }, [game, sel, legalMoves, pts, pd, sm, cooldowns, wAI, bAI, thinking, training]);

    useEffect(() => {
        const turn = game.turn();
        const ai = turn === 'w' ? wAI : bAI;
        
        if (training || !PERSONALITIES[ai]?.ai || game.game_over()) return;
        
        gen.current++;
        const myGen = gen.current;
        clearTimeout(timer.current);
        
        timer.current = setTimeout(() => {
            setThink(true);
            setDebug('🧠 Thinking...');
            
            const action = chooseBestMove(game, pd, sm, pts, turn, cooldowns);
            
            if (gen.current !== myGen) {
                setThink(false);
                return;
            }
            
            if (!action) {
                setThink(false);
                setDebug('❌ No moves');
                return;
            }
            
            const next = applyAction(game, pd, sm, pts, action, cooldowns);
            if (!next) {
                setThink(false);
                setDebug('❌ Move failed');
                return;
            }
            
            setPts(next.pts);
            setGame(next.game);
            setPd(next.pd);
            setSm(next.sm);
            setCooldowns(next.cooldowns || {});
            setLast({ from: action.from, to: action.to });
            setDebug('✅ Ready');
            setThink(false);
        }, 300);
        
        return () => clearTimeout(timer.current);
    }, [game, pd, sm, pts, wAI, bAI, cooldowns, training]);

    const handleTraining = async () => {
        if (training) {
            // Stop training
            stopTraining.current = true;
            setTraining(false);
            setDebug('⏹️ Training fermato');
            return;
        }
        
        // Start training
        stopTraining.current = false;
        setTraining(true);
        setThink(false);
        clearTimeout(timer.current);
        
        setDebug('🎮 Training 2000 partite...');
        
        await startTraining(2000, 
            (p) => {
                setTrainProgress(p);
                setDebug(`🎮 Training: ${p.current}/${p.total} | W:${p.wins.w || 0} B:${p.wins.b || 0}`);
            },
            (result) => {
                setDebug(`✅ Completato! ${result.total} partite | W:${result.wins.w || 0} B:${result.wins.b || 0}`);
                setTraining(false);
                reset();
            },
            () => stopTraining.current
        );
    };

    const reset = () => {
        const g = new Chess();
        const s = buildState(g);
        setGame(g);
        setPd(s.pd);
        setSm(s.sm);
        setPts({ w: 0, b: 0 });
        setSel(null);
        setLegalMoves([]);
        setThink(false);
        setLast(null);
        setDebug('');
        setCooldowns({});
        gen.current++;
    };

    const raw = game.board();
    const bd = flipped ? [...raw].reverse().map(r => [...r].reverse()) : raw;
    const turn = game.turn();
    const moveTargets = legalMoves.map(m => m.to);
    
    const progressPct = training ? (trainProgress.current / trainProgress.total * 100) : 0;

    return (
        <div className="app">
            {training && (
                <div style={{
                    position: 'fixed', inset: 0, background: '#060913', zIndex: 200,
                    display: 'flex', flexDirection: 'column', alignItems: 'center',
                    justifyContent: 'center', gap: 20, padding: 20
                }}>
                    <div style={{ fontSize: 48 }}>🧠</div>
                    <div style={{ fontSize: 24, fontWeight: 900, color: '#eab308' }}>
                        TRAINING IN CORSO
                    </div>
                    <div style={{ fontSize: 18, color: '#38bdf8', textAlign: 'center' }}>
                        {debug}
                    </div>
                    <div className="progress-bar" style={{ width: '80%', maxWidth: 300 }}>
                        <div className="progress-fill" style={{ width: `${progressPct}%` }} />
                    </div>
                    <div style={{ fontSize: 14, color: '#64748b' }}>
                        Partite totali: {brainStats.games}
                    </div>
                    <button onClick={handleTraining} style={{
                        padding: '12px 30px', background: '#ef4444', border: 'none',
                        borderRadius: 9, fontWeight: 800, fontSize: 15, cursor: 'pointer',
                        color: 'white', marginTop: 10
                    }}>
                        ⏹️ FERMA TRAINING
                    </button>
                </div>
            )}
            
            <div className="top-bar">
                {Object.entries(PERSONALITIES).map(([k, v]) => (
                    <button
                        key={k}
                        className={`mode-btn ${bAI === k ? 'active' : ''}`}
                        style={bAI === k ? { background: v.color, borderColor: v.color } : {}}
                        onClick={() => { setBAI(k); setTimeout(reset, 0); }}
                    >
                        ⬛ {v.name}
                    </button>
                ))}
            </div>
            
            <div className="player-row">
                <div className="player-label" style={{ borderLeft: `3px solid ${PERSONALITIES[bAI]?.color}` }}>
                    <div className="player-name">
                        {thinking && turn === 'b' && <div className="thinking-dot" />}
                        ⬛ {PERSONALITIES[bAI]?.name}
                    </div>
                    {last && <div className="last-move-hint">{last.from} → {last.to}</div>}
                </div>
                <div className="energy-badge" style={{ borderLeft: '3px solid #f43f5e' }}>
                    <span style={{ fontSize: 16 }}>⚡</span>
                    <span style={{ fontSize: 11 }}>{pts.b || 0}</span>
                </div>
            </div>
            
            <div className="board-wrap">
                <div className="board">
                    {bd.map((row, r) => row.map((cell, c) => {
                        const fi = flipped ? 7 - c : c;
                        const ri = flipped ? r : 7 - r;
                        const sq = 'abcdefgh'[fi] + (ri + 1);
                        const light = (fi + ri) % 2 !== 0;
                        const isSel = sel === sq;
                        const isTarget = moveTargets.includes(sq);
                        
                        return (
                            <div
                                key={sq}
                                onClick={() => click(sq)}
                                className={`cell ${light ? 'light' : 'dark'} ${
                                    isSel ? 'sel' : ''
                                } ${last?.from === sq ? 'last-from' : ''} ${
                                    last?.to === sq ? 'last-to' : ''}`}
                            >
                                {isTarget && !cell && (
                                    <div style={{
                                        position: 'absolute', width: '30%', height: '30%',
                                        borderRadius: '50%', background: '#22c55e',
                                        boxShadow: '0 0 10px #22c55e', zIndex: 1
                                    }} />
                                )}
                                {isTarget && cell && (
                                    <div style={{
                                        position: 'absolute', inset: 0, border: '3px solid #f43f5e',
                                        borderRadius: '3px', zIndex: 1
                                    }} />
                                )}
                                {cell && (
                                    <span className={`piece piece-${cell.color}`}>
                                        {ICONS[cell.color][cell.type]}
                                    </span>
                                )}
                            </div>
                        );
                    }))}
                </div>
            </div>
            
            <div className="player-row">
                <div className="player-label" style={{ borderLeft: `3px solid ${PERSONALITIES[wAI]?.color}` }}>
                    <div className="player-name">
                        {thinking && turn === 'w' && <div className="thinking-dot" />}
                        ⬜ {PERSONALITIES[wAI]?.name}
                    </div>
                </div>
                <div className="energy-badge" style={{ borderLeft: '3px solid #38bdf8' }}>
                    <span style={{ fontSize: 16 }}>⚡</span>
                    <span style={{ fontSize: 11 }}>{pts.w || 0}</span>
                </div>
            </div>
            
            <div className="panel">
                <div className="panel-bottom">
                    <div className="piece-label">
                        {game.in_check() ? '⚠️ SCACCO!' : game.game_over() ? '🏁 Partita finita' : 'Seleziona un pezzo'}
                    </div>
                    <div className="turn-pill" style={{ color: turn === 'w' ? '#38bdf8' : '#f43f5e' }}>
                        {turn === 'w' ? '⬜ Bianco' : '⬛ Nero'}
                    </div>
                </div>
            </div>
            
            <div className="top-bar">
                {Object.entries(PERSONALITIES).map(([k, v]) => (
                    <button
                        key={k}
                        className={`mode-btn ${wAI === k ? 'active' : ''}`}
                        style={wAI === k ? { background: v.color, borderColor: v.color } : {}}
                        onClick={() => { setWAI(k); setTimeout(reset, 0); }}
                    >
                        ⬜ {v.name}
                    </button>
                ))}
                <button className="flip-btn" onClick={() => setFlip(f => !f)}>🔄</button>
                <button 
                    className={training ? 'stop-btn' : 'train-btn'} 
                    onClick={handleTraining}
                >
                    {training ? '⏹️ Stop' : '🧠 Allena 2k'}
                </button>
            </div>
            
            {game.game_over() && (
                <div style={{
                    position: 'fixed', inset: 0, background: 'rgba(0,0,0,.9)',
                    display: 'flex', flexDirection: 'column', alignItems: 'center',
                    justifyContent: 'center', zIndex: 99, gap: 14,
                    backdropFilter: 'blur(8px)'
                }}>
                    <div style={{ fontSize: 26, fontWeight: 900, color: '#f1f5f9' }}>
                        {game.in_checkmate()
                            ? (turn === 'w' ? '⬛ Nero vince!' : '⬜ Bianco vince!')
                            : '🤝 Pareggio'}
                    </div>
                    <button onClick={reset} style={{
                        padding: '12px 40px', background: '#38bdf8', border: 'none',
                        borderRadius: 9, fontWeight: 800, fontSize: 15, cursor: 'pointer',
                        marginTop: 6
                    }}>
                        RIVINCITA
                    </button>
                </div>
            )}
            
            <div className="debug-bar">
                🧠 Omega Light | {brainStats.games} partite | {debug || 'pronto'}
            </div>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
