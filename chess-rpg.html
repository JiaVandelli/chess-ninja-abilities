<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Chess RPG – L'Esercito dell'Anima v4.3</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;margin:0;overflow:hidden;background:#060913}
    #root{height:100%}
    .app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:8px;gap:6px;color:#f1f5f9;font-family:system-ui,sans-serif}
    .top-bar{flex-shrink:0;height:40px;display:flex;gap:6px;align-items:center;justify-content:flex-end}
    .flip-btn{padding:0 12px;height:100%;background:#1e293b;border:none;color:#94a3b8;border-radius:8px;font-size:13px;cursor:pointer}
    .prestige-badge{flex-shrink:0;padding:0 12px;height:100%;background:#1e293b;border:none;color:#eab308;border-radius:8px;font-size:12px;display:flex;align-items:center;gap:4px;font-weight:700}
    .player-row{flex-shrink:0;height:48px;display:flex;gap:8px;align-items:center}
    .player-label{flex:1;height:100%;background:#0b0f19;border:1px solid #1e293b;border-radius:10px;display:flex;flex-direction:column;justify-content:center;padding:0 12px;overflow:hidden}
    .player-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px}
    .last-move-hint{font-size:10px;color:#475569;margin-top:1px}
    .energy-badge{flex-shrink:0;width:58px;height:100%;background:#0b0f19;border:1px solid #1e293b;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900}
    .board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
    .board{--side:min(calc(100vw - 16px),calc(100vh - 280px));width:var(--side);height:var(--side);display:grid;grid-template-columns:repeat(8,1fr);border-radius:4px;overflow:hidden;border:3px solid #4b3220;box-shadow:0 0 0 5px #6b4423,0 6px 24px rgba(0,0,0,.6)}
    .cell{position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--side,300px)/8*.72);cursor:pointer;aspect-ratio:1/1}
    .cell.light{background:#f0d9b5}.cell.dark{background:#b58863}
    .cell.last-from.light,.cell.last-to.light{background:#f6f669}
    .cell.last-from.dark,.cell.last-to.dark{background:#c8b400}
    .cell.sel{outline:3px solid #a855f7;outline-offset:-3px;background:#2d1f4e!important}
    .cell.evo-highlight{outline:3px dashed #0ea5e9;outline-offset:-3px}
    .cell.devo-highlight{outline:3px dashed #ef4444;outline-offset:-3px}
    .cell.aura-cell{box-shadow:inset 0 0 12px rgba(239,68,68,0.7)}
    .cell.stunned{box-shadow:inset 0 0 12px rgba(99,102,241,0.8)}
    .cell.immune-highlight{outline:2px solid #fbbf24;outline-offset:-2px}
    .piece{font-family:"Segoe UI Symbol","Noto Sans Symbols",sans-serif;line-height:1;user-select:none;z-index:2}
    .piece-w{color:#fff;text-shadow:0 0 0 #000,0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.7))}
    .piece-b{color:#000;text-shadow:0 0 0 #fff,0 1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff,0 -1px 0 #fff;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.5))}
    .evo2{filter:drop-shadow(0 0 4px #a855f7)!important}
    .panel{flex-shrink:0;height:95px;background:#0b0f19;border:1px solid #1e293b;border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;gap:4px}
    .charge-row{display:flex;justify-content:space-between;font-size:10px;font-weight:800;color:#94a3b8}
    .charge-track{width:100%;height:4px;background:#1e293b;border-radius:2px;overflow:hidden;margin-top:2px}
    .panel-bottom{display:flex;align-items:center;gap:6px;flex:1}
    .piece-label{flex:1;font-size:11px;min-width:0}
    .turn-pill{flex-shrink:0;padding:3px 8px;border-radius:16px;font-size:11px;font-weight:700;background:#1e293b}
    .btn-row{display:flex;gap:4px;flex-wrap:wrap}
    .ability-btn{flex:1;min-width:70px;padding:4px 6px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid #334155;background:#0f172a;color:#cbd5e1;text-align:center}
    @keyframes lvlup{0%{transform:scale(1)}40%{transform:scale(1.8) rotate(10deg)}100%{transform:scale(1)}}
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef} = React;
const Chess = window.Chess;
const ICONS = {w:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};

let globalIdCounter = 0;
function nextId() { return ++globalIdCounter; }

function getKnightJumps(sq) {
  const file = sq.charCodeAt(0)-97, rank = parseInt(sq[1]);
  const J = [[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]];
  return J.map(([df,dr]) => {
    const nf = file+df, nr = rank+dr;
    return (nf>=0 && nf<=7 && nr>=1 && nr<=8) ? String.fromCharCode(97+nf)+nr : null;
  }).filter(Boolean);
}

function isKingInCheck(game, color, pd, currentSm, stunned) {
  const fen = game.fen().split(' ');
  fen[1] = color; fen[3] = '-';
  if (new Chess(fen.slice(0,4).join(' ')+' 0 1').in_check()) return true;

  const opp = color==='w'?'b':'w';
  let kingSq = null;
  game.board().forEach((row,r) => row.forEach((p,c) => {
    if (p && p.type==='k' && p.color===color) kingSq = 'abcdefgh'[c]+(8-r);
  }));
  if (!kingSq) return false;

  const tf = kingSq.charCodeAt(0)-97, tr = parseInt(kingSq[1]);
  for (const [sq, id] of Object.entries(currentSm)) {
    const p = game.get(sq);
    if (!p || p.color !== opp) continue;
    if (stunned?.has(id)) continue;
    const d = pd[id];
    if (!d || d.level < 2) continue;
    const f = sq.charCodeAt(0)-97, r = parseInt(sq[1]);

    if (p.type==='p') {
      const dir = opp==='w'?1:-1;
      if (tr === r+dir && Math.abs(tf-f) <= 1) return true;
    }
    if (p.type==='q') {
      if ((Math.abs(tf-f)===2 && Math.abs(tr-r)===1) || (Math.abs(tf-f)===1 && Math.abs(tr-r)===2)) return true;
      if (tf===f || tr===r) {
        let blocked = false, cf = f+(tf>f?1:tf<f?-1:0), cr = r+(tr>r?1:tr<r?-1:0);
        while (cf!==tf || cr!==tr) {
          if (game.get(String.fromCharCode(97+cf)+cr)) { blocked=true; break; }
          cf += tf>cf?1:tf<cf?-1:0; cr += tr>cr?1:tr<cr?-1:0;
        }
        if (!blocked) return true;
      }
      if (Math.abs(tf-f)===Math.abs(tr-r)) {
        let blocked = false, cf = f+(tf>f?1:-1), cr = r+(tr>r?1:-1);
        while (cf!==tf) {
          if (game.get(String.fromCharCode(97+cf)+cr)) { blocked=true; break; }
          cf += tf>cf?1:-1; cr += tr>cr?1:-1;
        }
        if (!blocked) return true;
      }
    }
  }
  return false;
}

function applyStandardMove(game, from, to, promotion) {
  const g = new Chess(game.fen());
  const mv = g.move({from, to, promotion: promotion||'q'});
  if (!mv) return null;
  let cap = null;
  if (mv.captured) cap = {type: mv.captured};
  if (mv.flags?.includes('e')) cap = {type:'p', _sq: to[0]+from[1]};
  return {game: g, captured: cap, castleK: mv.flags?.includes('k'), castleQ: mv.flags?.includes('q')};
}

function buildState(g) {
  const pd={}, sm={};
  g.board().forEach((row,r) => row.forEach((cell,c) => {
    if (cell) {
      const sq = 'abcdefgh'[c]+(8-r);
      const id = `${cell.color}${cell.type}_${sq}_${nextId()}`;
      pd[id] = {type:cell.type, color:cell.color, level:1};
      sm[sq] = id;
    }
  }));
  return {pd, sm};
}

const EVO_COST = {p:2, n:2, b:2, r:3, q:5};
const PRESTIGE_VAL = {p:1, n:2, b:2, r:3, q:4};

function App() {
  const [game, setGame] = useState(() => new Chess());
  const [pd, setPd] = useState({});
  const [sm, setSm] = useState({});
  const [sel, setSel] = useState(null);
  const [moves, setMoves] = useState([]);
  const [lvlUp, setLvlUp] = useState(null);
  const [pts, setPts] = useState({w:0, b:0});
  const [last, setLast] = useState(null);
  const [flipped, setFlip] = useState(false);
  const [postPhase, setPostPhase] = useState(false);
  const [postPlayer, setPostPlayer] = useState(null);
  const [stunned, setStunned] = useState(new Set());
  const [immune, setImmune] = useState(null);
  const [ghostMarch, setGhostMarch] = useState(null);
  const [gameOver, setGameOver] = useState(null);

  const [commandMode, setCommandMode] = useState(false);
  const [commandQueenSq, setCommandQueenSq] = useState(null);
  const [commandCost, setCommandCost] = useState(4);

  const [elixirMode, setElixirMode] = useState(false);
  const [elixirCost, setElixirCost] = useState(3);
  const [elixirRookSq, setElixirRookSq] = useState(null);

  const lvlUpTimer = useRef(null);

  useEffect(() => { const s = buildState(game); setPd(s.pd); setSm(s.sm); }, []);
  useEffect(() => () => { if (lvlUpTimer.current) clearTimeout(lvlUpTimer.current); }, []);

  const currentTurn = game.turn();
  const activeColor = postPhase ? postPlayer : currentTurn;

  const calcPrestige = useCallback((color) => {
    let total = 0;
    for (const [sq, id] of Object.entries(sm)) {
      const p = game.get(sq);
      if (p && p.color===color && pd[id]?.level===2) total += PRESTIGE_VAL[p.type] || 0;
    }
    return total;
  }, [game, sm, pd]);

  const prestige = calcPrestige(activeColor);
  const prestigeDiscount = prestige >= 15 ? 1 : 0;
  const prestigeBonus = prestige >= 10;
  const canDevolve = prestige >= 5;

  const endTurn = useCallback(() => {
    const nextPlayer = game.turn();
    setStunned(prev => {
      const next = new Set(prev);
      for (const id of next) if (pd[id]?.color === activeColor) next.delete(id);
      return next;
    });
    setImmune(null);
    setGhostMarch(null);
    if (prestigeBonus && calcPrestige(nextPlayer) >= 10) {
      setPts(prev => ({...prev, [nextPlayer]: prev[nextPlayer] + 1}));
    }
    setPostPhase(false);
    setPostPlayer(null);
    setSel(null);
    setMoves([]);
    setCommandMode(false);
    setCommandQueenSq(null);
    setElixirMode(false);
  }, [game, activeColor, pd, calcPrestige, prestigeBonus]);

  const getAuraCells = useCallback((sq) => getKnightJumps(sq), []);

  const isInEnemyAura = useCallback((sq, color) => {
    const opp = color==='w'?'b':'w';
    for (const [osq, oid] of Object.entries(sm)) {
      const op = game.get(osq);
      if (op && op.color===opp && op.type==='n' && pd[oid]?.level===2) {
        if (getAuraCells(osq).includes(sq)) return true;
      }
    }
    return false;
  }, [game, sm, pd, getAuraCells]);

  const isImmuneToCapture = useCallback((sq, attackerColor) => {
    if (!immune) return false;
    if (immune.sq !== sq) return false;
    const targetPiece = game.get(sq);
    if (!targetPiece) return false;
    const rookSq = Object.entries(sm).find(([s, id]) => id === immune.rookId)?.[0];
    if (!rookSq) return false;
    const rFile = rookSq.charCodeAt(0)-97, rRank = parseInt(rookSq[1]);
    const tFile = sq.charCodeAt(0)-97, tRank = parseInt(sq[1]);
    return (rFile === tFile || rRank === tRank);
  }, [immune, game, sm]);

  const getMoves = useCallback((sq) => {
    const p = game.get(sq);
    if (!p) return [];
    const color = p.color;
    const id = sm[sq];
    const d = pd[id];
    if (stunned.has(id)) return [];

    const inAura = isInEnemyAura(sq, color);
    const isEvo2 = d && d.level===2 && !inAura;
    const result = [];
    const energy = pts[color];

    for (const m of game.moves({square:sq, verbose:true})) {
      if (m.promotion && m.promotion!=='q') continue;
      const ng = new Chess(game.fen());
      if (ng.move({from:m.from, to:m.to, promotion:m.promotion||'q'})) {
        const nsm = {...sm};
        nsm[m.to] = nsm[m.from]; delete nsm[m.from];
        if (m.captured) {
          const cSq = m.flags?.includes('e') ? m.to[0]+sq[1] : m.to;
          if (isImmuneToCapture(cSq, color)) continue;
          delete nsm[cSq];
        }
        if (!isKingInCheck(ng, color, pd, nsm, stunned)) {
          result.push({type:'std', from:sq, to:m.to, promotion:m.promotion});
        }
      }
    }

    if (isEvo2) {
      const actCost = Math.max(1, 3 - prestigeDiscount);
      const cmdCost = Math.max(1, 4 - prestigeDiscount);

      if (p.type === 'p') {
        const dir = color==='w'?1:-1, file = sq.charCodeAt(0)-97, rank = parseInt(sq[1]);
        for (const df of [-1, 0, 1]) {
          const nf = file+df, nr = rank+dir;
          if (nf>=0 && nf<=7 && nr>=1 && nr<=8) {
            const tsq = String.fromCharCode(97+nf)+nr;
            if (result.some(m=>m.to===tsq)) continue;
            const tp = game.get(tsq);
            if (!tp || tp.color !== color) {
              const ng = new Chess(game.fen()); ng.remove(sq); if(tp) ng.remove(tsq);
              ng.put({type:'p', color}, tsq);
              const nsm = {...sm}; delete nsm[sq]; if(tp) delete nsm[tsq]; nsm[tsq] = id;
              if (!isKingInCheck(ng, color, pd, nsm, stunned)) result.push({type:'std', from:sq, to:tsq});
            }
          }
        }
        if (energy >= actCost && !ghostMarch) {
          for (const df of [-1, 0, 1]) {
            const nr = rank + (dir * 2);
            const nf = file + df;
            if (nf>=0 && nf<=7 && nr>=1 && nr<=8) {
              const tsq = String.fromCharCode(97+nf)+nr;
              const tp = game.get(tsq);
              const ng = new Chess(game.fen()); ng.remove(sq); if(tp) ng.remove(tsq);
              ng.put({type:'p', color}, tsq);
              const nsm = {...sm}; delete nsm[sq]; if(tp) delete nsm[tsq]; nsm[tsq] = id;
              if (!isKingInCheck(ng, color, pd, nsm, stunned)) {
                result.push({type:'ability_move', ability:'ghostMarch', from:sq, to:tsq, cost:actCost});
              }
            }
          }
        }
      }

      if (p.type === 'n') {
        if (energy >= actCost) {
          const visited = new Set();
          for (const firstSq of getKnightJumps(sq)) {
            const intermediate = game.get(firstSq);
            for (const secondSq of getKnightJumps(firstSq)) {
              if (secondSq === sq || visited.has(secondSq)) continue;
              visited.add(secondSq);
              const tp = game.get(secondSq);
              if (tp && tp.color === color) continue;
              const ng = new Chess(game.fen()); ng.remove(sq);
              if (tp) ng.remove(secondSq);
              ng.put({type:'n', color}, secondSq);
              const nsm = {...sm}; delete nsm[sq];
              if (tp) delete nsm[secondSq]; nsm[secondSq] = id;
              if (!isKingInCheck(ng, color, pd, nsm, stunned)) {
                result.push({type:'ability_move', ability:'frenzyCharge', from:sq, to:secondSq, firstSq, cost:actCost});
              }
            }
          }
        }
        let forkCount = 0;
        for (const tsq of getKnightJumps(sq)) {
          const tp = game.get(tsq);
          if (tp && tp.color !== color) forkCount++;
        }
        if (forkCount >= 2 && result.some(m => m.type==='std' && getKnightJumps(sq).includes(m.to))) {
          result.push({type:'passive_bonus', ability:'warriorSpirit', desc:'Slancio del Guerriero (+1⚡)', cost:0});
        }
      }

      if (p.type === 'b' && energy >= actCost) {
        const ff = sq.charCodeAt(0)-97, fr = parseInt(sq[1]);
        for (const [df,dr] of [[1,1],[1,-1],[-1,1],[-1,-1]]) {
          let f = ff+df, r = fr+dr;
          while (f>=0 && f<=7 && r>=1 && r<=8) {
            const tsq = String.fromCharCode(97+f)+r;
            const tp = game.get(tsq);
            if (!tp) {
              const ng = new Chess(game.fen()); ng.remove(sq); ng.put({type:'b', color}, tsq);
              const nsm = {...sm}; delete nsm[sq]; nsm[tsq] = id;
              if (!isKingInCheck(ng, color, pd, nsm, stunned)) {
                result.push({type:'ability_move', ability:'spectralStep', from:sq, to:tsq, cost:actCost});
              }
            }
            f+=df; r+=dr;
          }
        }
      }

      if (p.type === 'q') {
        for (const tsq of getKnightJumps(sq)) {
          if (result.some(m=>m.to===tsq)) continue;
          const tp = game.get(tsq);
          if (!tp || tp.color !== color) {
            const ng = new Chess(game.fen()); ng.remove(sq); if(tp) ng.remove(tsq);
            ng.put({type:'q', color}, tsq);
            const nsm = {...sm}; delete nsm[sq]; if(tp) delete nsm[tsq]; nsm[tsq] = id;
            if (!isKingInCheck(ng, color, pd, nsm, stunned)) result.push({type:'std', from:sq, to:tsq});
          }
        }
        if (energy >= cmdCost) {
          const hasAlly = Object.entries(sm).some(([osq, oid]) => osq !== sq && game.get(osq)?.color === color);
          if (hasAlly) {
            result.push({type:'panel_ability', ability:'royalCommand', from:sq, cost:cmdCost, desc:'Comando Reale'});
          }
        }
      }

      if (p.type === 'r') {
        const file = sq.charCodeAt(0)-97, rank = parseInt(sq[1]);
        for (const [osq, oid] of Object.entries(sm)) {
          if (osq === sq) continue;
          const op = game.get(osq);
          if (op && op.color===color && op.type!=='k') {
            const of = osq.charCodeAt(0)-97, or = parseInt(osq[1]);
            if (file===of || rank===or) {
              let clear = true;
              if (file===of) {
                for (let r=Math.min(rank,or)+1; r<Math.max(rank,or); r++) {
                  if (game.get(String.fromCharCode(97+file)+r)) { clear=false; break; }
                }
              } else {
                for (let f=Math.min(file,of)+1; f<Math.max(file,of); f++) {
                  if (game.get(String.fromCharCode(97+f)+rank)) { clear=false; break; }
                }
              }
              if (clear) result.push({type:'swap', from:sq, to:osq});
            }
          }
        }
        if (energy >= actCost) {
          const hasTarget = Object.entries(sm).some(([osq, oid]) => {
            const op = game.get(osq);
            if (!op || op.color !== color || osq === sq) return false;
            const of = osq.charCodeAt(0)-97, or = parseInt(osq[1]);
            return (file === of || rank === or);
          });
          if (hasTarget) {
            result.push({type:'panel_ability', ability:'elixir', from:sq, cost:actCost, desc:'Elisir di Protezione'});
          }
        }
      }
    }
    return result;
  }, [game, sm, pd, pts, stunned, isInEnemyAura, prestigeDiscount, ghostMarch, isImmuneToCapture]);

  const executeAction = useCallback((action, color) => {
    const curPd = {...pd}, curSm = {...sm}, curPts = {...pts};
    let ng, energyGain = 0, newStunned = new Set(stunned), newImmune = immune, newGhost = ghostMarch;

    if (action.type === 'std') {
      const res = applyStandardMove(game, action.from, action.to, action.promotion);
      if (!res) return false;
      ng = res.game; energyGain = 1;
      if (res.captured) energyGain += 1;
      if (ng.in_check()) energyGain += 1;
      const mid = curSm[action.from];
      if (curPd[mid]?.type==='p' && curPd[mid]?.level===2 && res.captured) energyGain += 1;

      const nsm = {...curSm}, npd = {...curPd};
      if (res.castleK) { const rk=color==='w'?'1':'8'; nsm['f'+rk]=nsm['h'+rk]; delete nsm['h'+rk]; }
      if (res.castleQ) { const rk=color==='w'?'1':'8'; nsm['d'+rk]=nsm['a'+rk]; delete nsm['a'+rk]; }
      if (res.captured) { const cs = res.captured._sq || action.to; delete npd[nsm[cs]]; delete nsm[cs]; }
      nsm[action.to] = mid; delete nsm[action.from];

      if (curPd[mid]?.type==='q' && curPd[mid]?.level===2 && res.captured) energyGain += 1;
      const queenSq = Object.entries(nsm).find(([s,id]) => pd[id]?.type==='q' && pd[id]?.level===2 && pd[id]?.color===color)?.[0];
      if (queenSq && res.captured) energyGain += 1;

      setGame(ng); setPd(npd); setSm(nsm);
    }
    else if (action.type === 'swap') {
      const p1 = game.get(action.from), p2 = game.get(action.to);
      ng = new Chess(game.fen()); ng.remove(action.from); ng.remove(action.to);
      ng.put(p1, action.to); ng.put(p2, action.from);
      const parts = ng.fen().split(' '); parts[1] = color==='w'?'b':'w'; parts[3] = '-'; parts[4] = '0';
      ng = new Chess(parts.join(' '));
      const nsm = {...curSm, [action.from]: curSm[action.to], [action.to]: curSm[action.from]};
      setGame(ng); setPd(curPd); setSm(nsm); energyGain = 1;
    }
    else if (action.type === 'ability_move') {
      if (curPts[color] < action.cost) return false;
      ng = new Chess(game.fen());
      let nsm = {...curSm}, npd = {...curPd};
      const mid = curSm[action.from];
      let bonusGain = 0;

      if (action.ability === 'ghostMarch') {
        ng.remove(action.from); const tp = game.get(action.to);
        if (tp) { delete npd[nsm[action.to]]; delete nsm[action.to]; bonusGain++; }
        ng.put({type:'p', color}, action.to); nsm[action.to] = mid; delete nsm[action.from];
        newGhost = color;
      }
      else if (action.ability === 'frenzyCharge') {
        ng.remove(action.from);
        const tp = game.get(action.to);
        if (tp) { delete npd[nsm[action.to]]; delete nsm[action.to]; bonusGain++; }
        ng.put({type:'n', color}, action.to); nsm[action.to] = mid; delete nsm[action.from];
      }
      else if (action.ability === 'spectralStep') {
        const ff=action.from.charCodeAt(0)-97, fr=parseInt(action.from[1]);
        const tf=action.to.charCodeAt(0)-97, tr=parseInt(action.to[1]);
        const dc=tf>ff?1:-1, dr=tr>fr?1:-1; let cf=ff+dc, cr=fr+dr;
        while (cf!==tf || cr!==tr) {
          const msq = String.fromCharCode(97+cf)+cr, mp = game.get(msq);
          if (mp) {
            if (mp.color !== color) newStunned.add(curSm[msq]);
            else bonusGain++;
          }
          cf+=dc; cr+=dr;
        }
        ng.remove(action.from); ng.put({type:'b', color}, action.to); nsm[action.to] = mid; delete nsm[action.from];
      }

      energyGain = bonusGain - action.cost + 1;
      if (ng.in_check()) energyGain += 1;
      setGame(ng); setPd(npd); setSm(nsm);
    }

    if (ng) {
      setPts({...curPts, [color]: Math.max(0, curPts[color] + energyGain)});
      setStunned(newStunned); setImmune(newImmune); setGhostMarch(newGhost);
      setLast({from: action.from, to: action.to || '??'});
      setSel(null); setMoves([]);
      if (ng.game_over()) {
        setGameOver({winner: ng.in_checkmate() ? (ng.turn()==='w'?'b':'w') : null, reason: ng.in_checkmate()?'Scacco matto':'Patta'});
      } else {
        setPostPlayer(color); setPostPhase(true);
      }
      return true;
    }
    return false;
  }, [game, pd, sm, pts, stunned, immune, ghostMarch]);

  const click = useCallback((sq) => {
    if (gameOver) return;
    const turn = game.turn();
    const color = postPhase ? postPlayer : turn;

    if (commandMode) {
      if (sq && sq !== commandQueenSq) {
        const p = game.get(sq);
        if (p && p.color===color) {
          setCommandMode(false); setCommandQueenSq(null);
          setPts(prev => ({...prev, [color]: prev[color] + commandCost}));
          setSel(sq); setMoves(getMoves(sq)); setPostPhase(false);
        }
      } else {
        setCommandMode(false); setCommandQueenSq(null);
        setPts(prev => ({...prev, [color]: prev[color] + commandCost}));
      }
      return;
    }

    if (elixirMode) {
      if (sq) {
        const p = game.get(sq);
        const rookFile = elixirRookSq?.charCodeAt(0)-97, rookRank = elixirRookSq ? parseInt(elixirRookSq[1]) : null;
        const sqFile = sq.charCodeAt(0)-97, sqRank = parseInt(sq[1]);
        if (p && p.color === color && (rookFile === sqFile || rookRank === sqRank)) {
          const rookId = sm[elixirRookSq];
          setImmune({sq, id: sm[sq], rookId});
          setPts(prev => ({...prev, [color]: Math.max(0, prev[color] - elixirCost)}));
          setElixirMode(false); setElixirRookSq(null);
          setPostPlayer(color); setPostPhase(true); setSel(null); setMoves([]);
        }
      } else {
        setElixirMode(false); setElixirRookSq(null);
      }
      return;
    }

    if (postPhase) {
      if (sq) {
        const p = game.get(sq);
        if (p && p.color===color) {
          const id = sm[sq], d = pd[id];
          if (d && d.level === 1) {
            const cost = EVO_COST[p.type] || 99;
            if (pts[color] >= cost) {
              setPd({...pd, [id]: {...d, level: 2}});
              setPts({...pts, [color]: pts[color] - cost});
              setLvlUp(sq);
              if (lvlUpTimer.current) clearTimeout(lvlUpTimer.current);
              lvlUpTimer.current = setTimeout(() => setLvlUp(null), 900);
            }
          } else if (d && d.level === 2 && canDevolve) {
            const refund = EVO_COST[p.type] || 0;
            setPd({...pd, [id]: {...d, level: 1}});
            setPts({...pts, [color]: pts[color] + refund});
          }
        }
      } else { endTurn(); }
      return;
    }

    if (!sel) {
      if (sq) {
        const p = game.get(sq);
        if (p && p.color===color && !stunned.has(sm[sq])) { setSel(sq); setMoves(getMoves(sq)); }
      }
    } else {
      const move = moves.find(m => (m.type==='std'||m.type==='swap'||m.type==='ability_move') && m.to===sq);
      if (move) {
        executeAction(move, color);
        if (move.type==='std' && moves.some(m=>m.type==='passive_bonus')) {
          setPts(prev => ({...prev, [color]: prev[color] + 1}));
        }
        return;
      }

      if (sq) {
        const p = game.get(sq);
        if (p && p.color===color && !stunned.has(sm[sq])) { setSel(sq); setMoves(getMoves(sq)); }
        else { setSel(null); setMoves([]); }
      } else { setSel(null); setMoves([]); }
    }
  }, [sel, moves, game, sm, pd, pts, stunned, postPhase, postPlayer, commandMode, commandQueenSq, commandCost, elixirMode, elixirCost, elixirRookSq, canDevolve, gameOver, getMoves, executeAction, endTurn]);

  const reset = () => {
    const g = new Chess(); const s = buildState(g);
    setGame(g); setPd(s.pd); setSm(s.sm); setPts({w:0,b:0});
    setSel(null); setMoves([]); setLast(null); setPostPhase(false); setPostPlayer(null);
    setStunned(new Set()); setImmune(null); setGhostMarch(null);
    setCommandMode(false); setCommandQueenSq(null); setElixirMode(false); setElixirRookSq(null);
    setGameOver(null); globalIdCounter = 0;
  };

  const raw = game.board();
  const bd = flipped ? [...raw].reverse().map(r => [...r].reverse()) : raw;
  const moveTargets = new Set(moves.filter(m => m.type==='std'||m.type==='swap').map(m => m.to));
  const abilityTargets = new Set(moves.filter(m => m.type==='ability_move').map(m => m.to));
  const showAbilities = moves.filter(m => m.type==='panel_ability');
  const selPiece = sel ? game.get(sel) : null;
  const selData = sel ? pd[sm[sel]] : null;

  return (
    <div className="app">
      <div className="top-bar">
        <div className="prestige-badge">⭐ {prestige} {prestigeBonus && "✨"}</div>
        <button className="flip-btn" onClick={() => setFlip(f => !f)}>🔄 Ruota</button>
      </div>
      <div className="player-row">
        <div className="player-label" style={{borderLeft:'3px solid #f43f5e'}}>
          <div className="player-name">⬛ Nero</div>
          {last && <div className="last-move-hint">{last.from} → {last.to}</div>}
        </div>
        <div className="energy-badge" style={{borderLeft:'3px solid #f43f5e',color:pts.b>=2?'#22c55e':'#94a3b8'}}>
          <span>⚡</span><span>{pts.b}</span>
        </div>
      </div>
      <div className="board-wrap">
        <div className="board">
          {bd.map((row, r) => row.map((cell, c) => {
            const fi = flipped ? 7-c : c, ri = flipped ? r : 7-r;
            const sq = 'abcdefgh'[fi]+(ri+1);
            const light = (fi+ri)%2 !== 0;
            const isSel = sel === sq;
            const isMove = moveTargets.has(sq);
            const isAbMove = abilityTargets.has(sq);
            const id = sm[sq], data = id ? pd[id] : null, level = data?.level ?? 1;
            const isStunned = stunned.has(id), isImmune = immune?.sq === sq, inAura = isInEnemyAura(sq, activeColor);

            let phaseHighlight = "";
            if (postPhase && data && game.get(sq)?.color===postPlayer) {
              phaseHighlight = level===1 ? "evo-highlight" : ((canDevolve && level===2) ? "devo-highlight" : "");
            }

            return (
              <div key={sq} onClick={() => click(sq)}
                className={`cell ${light?'light':'dark'} ${isSel?'sel':''} ${inAura?'aura-cell':''} ${isStunned?'stunned':''} ${isImmune?'immune-highlight':''} ${phaseHighlight} ${last?.from===sq?'last-from':''} ${last?.to===sq?'last-to':''}`}>
                {isMove && !cell && <div style={{position:'absolute',width:'30%',height:'30%',borderRadius:'50%',background:'#22c55e',boxShadow:'0 0 10px #22c55e',zIndex:1}}/>}
                {isAbMove && !cell && <div style={{position:'absolute',width:'32%',height:'32%',borderRadius:'50%',background:'#a855f7',boxShadow:'0 0 12px #a855f7',zIndex:1}}/>}
                {isMove && cell && <div style={{position:'absolute',inset:0,border:'3px solid #f43f5e',borderRadius:'3px',zIndex:1}}/>}
                {isAbMove && cell && <div style={{position:'absolute',inset:0,border:'3px solid #a855f7',borderRadius:'3px',zIndex:1}}/>}
                {cell && <span className={`piece piece-${cell.color} ${level===2?'evo2':''}`} style={{transform:lvlUp===sq?'scale(1.5)':'scale(1)',transition:'transform .15s',animation:lvlUp===sq?'lvlup 1s ease':undefined}}>{ICONS[cell.color][cell.type]}</span>}
                {level===2 && <div style={{position:'absolute',inset:'3px',border:'2px solid #a855f7',borderRadius:'4px',pointerEvents:'none',boxShadow:'0 0 10px rgba(168,85,247,0.8)',zIndex:3}}/>}
              </div>
            );
          }))}
        </div>
      </div>
      <div className="player-row">
        <div className="player-label" style={{borderLeft:'3px solid #f8fafc'}}>
          <div className="player-name">⬜ Bianco</div>
          {last && <div className="last-move-hint">{last.from} → {last.to}</div>}
        </div>
        <div className="energy-badge" style={{borderLeft:'3px solid #38bdf8',color:pts.w>=2?'#22c55e':'#94a3b8'}}>
          <span>⚡</span><span>{pts.w}</span>
        </div>
      </div>
      <div className="panel">
        {commandMode ? (
          <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:'#ec4899',fontWeight:700}}>👑 Scegli un alleato per il turno extra</div>
        ) : elixirMode ? (
          <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:'#fbbf24',fontWeight:700}}>🧪 Seleziona un pezzo alleato sulla stessa riga/colonna</div>
        ) : postPhase ? (
          <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:2,cursor:'pointer'}} onClick={() => click(null)}>
            <span style={{fontSize:11,fontWeight:700,color:'#0ea5e9'}}>🔵 Clicca pezzo Base per Evoluzione | {canDevolve ? <span style={{color:'#ef4444'}}>🔴 Rosso per De-Evolvere (Refund)</span> : "No Refund"}</span>
            <span style={{fontSize:10,color:'#475569'}}>Clicca QUI o sul vuoto per passare il turno</span>
          </div>
        ) : (
          <>
            <div>
              <div className="charge-row">
                <span>🔋 {activeColor==='w'?'BIANCO':'NERO'}{prestigeBonus && " (+1⚡ Passivo)"}{ghostMarch === activeColor ? " 👻" : ""}</span>
                <span>{pts[activeColor]}⚡</span>
              </div>
              <div className="charge-track"><div style={{width:`${Math.min(pts[activeColor]/10*100,100)}%`,height:'100%',background:'#38bdf8',transition:'width .3s'}}/></div>
            </div>
            <div className="panel-bottom">
              <div className="piece-label">
                {selData ? (
                  <span style={{fontWeight:700}}>
                    {selPiece && ICONS[selPiece.color][selPiece.type]} {selData.level===2 ? {p:'Assaltatore',n:'Destriero',b:'Spettro',r:'Alchimista',q:'Imperatrice',k:'Re'}[selPiece.type] : 'Base'} Lv.{selData.level}
                  </span>
                ) : <span style={{color:'#475569'}}>Seleziona un pezzo (Viola = Abilità sulla mappa)</span>}
              </div>
              <div className="turn-pill" style={{color:activeColor==='w'?'#38bdf8':'#f43f5e'}}>
                {isKingInCheck(game, activeColor, pd, sm, stunned) ? 'SCACCO!' : activeColor==='w'?'⬜':'⬛'}
              </div>
            </div>
            {sel && showAbilities.length > 0 && (
              <div className="btn-row">
                {showAbilities.map((a, i) => (
                  <button key={i} className="ability-btn" style={{borderColor:'#ec4899',color:'#ec4899'}}
                    onClick={() => {
                      if (a.ability==='royalCommand') {
                        setCommandMode(true); setCommandQueenSq(sel); setCommandCost(a.cost);
                        setPts(prev => ({...prev, [activeColor]: prev[activeColor] - a.cost}));
                      } else if (a.ability==='elixir') {
                        setElixirMode(true); setElixirCost(a.cost); setElixirRookSq(sel);
                      }
                    }}>
                    {a.desc} ({a.cost}⚡)
                  </button>
                ))}
              </div>
            )}
          </>
        )}
      </div>
      <div className="top-bar" style={{justifyContent:'center'}}>
        <button onClick={reset} style={{padding:'4px 16px',background:'#1e293b',color:'#94a3b8',borderRadius:6,fontSize:12,cursor:'pointer'}}>🔄 Nuova Partita</button>
      </div>
      {gameOver && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.9)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',zIndex:99,gap:14}}>
          <div style={{fontSize:26,fontWeight:900,color:'#f1f5f9'}}>{gameOver.winner ? `🏆 ${gameOver.winner==='w'?'⬜ Bianco vince!':'⬛ Nero vince!'}` : '🤝 Pareggio'}</div>
          <div style={{fontSize:12,color:'#64748b'}}>{gameOver.reason}</div>
          <button onClick={reset} style={{padding:'12px 40px',background:'#38bdf8',border:'none',borderRadius:9,fontWeight:800,fontSize:15,cursor:'pointer'}}>RIVINCITA</button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
