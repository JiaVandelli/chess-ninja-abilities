<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Chess RPG - Hybrid AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#060913}
#root{height:100%}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:8px;gap:6px;color:#f1f5f9;font-family:system-ui,sans-serif}
.top-bar{flex-shrink:0;height:42px;display:flex;gap:5px;align-items:center;overflow-x:auto}
.mode-btn{flex:1;min-width:70px;height:100%;background:#0b0f19;border:1px solid #1e293b;color:#94a3b8;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.mode-btn.active{background:#38bdf8;color:#030712;border-color:#38bdf8}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.board{--side:min(92vw,calc(100vh - 220px));width:var(--side);height:var(--side);display:grid;grid-template-columns:repeat(8,1fr);border-radius:4px;overflow:hidden;border:3px solid #4b3220;box-shadow:0 0 0 5px #6b4423,0 6px 24px rgba(0,0,0,.6)}
.cell{position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--side)/8*0.7);cursor:pointer;aspect-ratio:1/1}
.cell.light{background:#f0d9b5}.cell.dark{background:#b58863}.cell.sel{outline:3px solid #a855f7;outline-offset:-3px;background:#2d1f4e!important}
.piece{font-family:"Segoe UI Symbol",sans-serif;display:inline-block;line-height:1;user-select:none}
.piece-w{color:#fef9f0;-webkit-text-stroke:1.8px #1a0a00;filter:drop-shadow(0 2px 4px rgba(0,0,0,.75))}
.piece-b{color:#0f0800;-webkit-text-stroke:.5px rgba(255,255,.1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.evo2{filter:drop-shadow(0 0 5px #eab308) drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.evo3{filter:drop-shadow(0 0 10px #a855f7) drop-shadow(0 0 22px #a855f7)}
.level-mark{position:absolute;top:2px;right:3px;font-size:9px;font-weight:800;pointer-events:none}
.lm2{color:#eab308;text-shadow:0 0 5px #eab308}.lm3{color:#a855f7;text-shadow:0 0 8px #a855f7}
.player-row{flex-shrink:0;height:44px;display:flex;gap:8px;align-items:center}
.player-label{flex:1;height:100%;background:#0b0f19;border:1px solid #1e293b;border-radius:10px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:12px;font-weight:600}
.energy-badge{padding:3px 7px;background:#1e293b;border-radius:6px;font-size:11px;font-weight:800}
.panel{flex-shrink:0;height:80px;background:#0b0f19;border:1px solid #1e293b;border-radius:12px;padding:7px 10px;display:flex;flex-direction:column;gap:6px}
.charge-row{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:#94a3b8}
.charge-track{width:100%;height:5px;background:#1e293b;border-radius:3px;overflow:hidden}
.panel-bottom{display:flex;align-items:center;gap:8px;flex:1}
.piece-label{flex:1;font-size:11px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evolve-btn{flex-shrink:0;padding:5px 9px;border:none;border-radius:6px;font-weight:800;font-size:11px;cursor:pointer;background:#38bdf8;color:#030712}
.evolve-btn:disabled{background:#1e293b;color:#475569;cursor:not-allowed}
.turn-pill{flex-shrink:0;padding:4px 9px;border-radius:16px;font-size:11px;font-weight:700;background:#1e293b}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="evolutions.js"></script>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;
const Chess=window.Chess;
const ICONS={w:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};

// Worker Stockfish (Bypass CORS tramite Blob)
const sfCode = `importScripts("https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.0/stockfish.js");`;
const sfBlob = new Blob([sfCode], {type: 'application/javascript'});
const sfWorker = new Worker(URL.createObjectURL(sfBlob));

const PERSONALITIES = {
  human: { name: 'Umano', ai: false, depth: 0, desc: 'Giocatore umano' },
  apprendista: { name: 'Apprendista', ai: true, depth: 1, desc: 'Stockfish Lv.1 + Abilità Base' },
  gladiatore: { name: 'Gladiatore', ai: true, depth: 5, desc: 'Stockfish Lv.5 + Evoluzioni' },
  boss: { name: 'Gran Maestro', ai: true, depth: 10, desc: 'Stockfish Lv.10 + Terrore Puro' }
};

const HybridAI = {
  getStockfishMove(fen, depth) {
    return new Promise(resolve => {
      sfWorker.postMessage("ucinewgame");
      sfWorker.postMessage("position fen " + fen);
      sfWorker.postMessage("go depth " + depth);
      const handler = e => {
        if (typeof e.data === "string" && e.data.startsWith("bestmove")) {
          sfWorker.removeEventListener("message", handler);
          const move = e.data.split(" ")[1];
          resolve({ from: move.slice(0, 2), to: move.slice(2, 4) });
        }
      };
      sfWorker.addEventListener("message", handler);
    });
  },

  findBestAbility(game, pieceData, squareMap, color) {
    let best = null;
    let bestScore = -9999;
    Object.entries(squareMap).forEach(([sq, id]) => {
      const piece = game.get(sq);
      if (!piece || piece.color!== color) return;
      const data = pieceData[id];
      const evo = EVOLUTIONS[piece.type];
      if (!evo) return;
      const abilities = evo.getAbilityMoves(sq, game, data.level, color);
      abilities.forEach(ab => {
        let score = 0;
        const target = game.get(ab.to);
        if (target) {
          score += { p: 100, n: 300, b: 300, r: 500, q: 900, k: 5000 }[target.type] || 0;
        }
        if (score > bestScore) {
          bestScore = score;
          best = ab;
        }
      });
    });
    return { move: best, score: bestScore };
  },

  shouldEvolve(game, pieceData, squareMap, points, color) {
    if (points[color] < 2) return null;
    let bestSq = null;
    let bestValue = 0;
    Object.entries(squareMap).forEach(([sq, id]) => {
      const p = pieceData[id];
      if (p.color!== color || p.level >= 3) return;
      let value = 0;
      if (p.type === "p") value = 200 + p.level * 100;
      if (p.type === "n" || p.type === "b") value = 150 + p.level * 50;
      if (value > bestValue) {
        bestValue = value;
        bestSq = sq;
      }
    });
    return bestSq;
  },

  async chooseAction(game, pieceData, squareMap, points, color, depth) {
    const evolveSq = this.shouldEvolve(game, pieceData, squareMap, points, color);
    if (evolveSq) return { type: "evolve", sq: evolveSq };

    const ability = this.findBestAbility(game, pieceData, squareMap, color);
    if (ability.score >= 300) {
      return { type: "ability", from: ability.move.from, to: ability.move.to };
    }

    const sfMove = await this.getStockfishMove(game.fen(), depth);
    return { type: "move", from: sfMove.from, to: sfMove.to };
  }
};

function buildState(g){const pd={},sm={};g.board().forEach((r,ri)=>r.forEach((c,ci)=>{if(c){const sq='abcdefgh'[ci]+(8-ri);const id=`${c.color}${c.type}_${sq}`;pd[id]={id,type:c.type,color:c.color,level:1};sm[sq]=id;}}));return{pd,sm};}

function App(){
  const[game,setGame]=useState(()=>new Chess());
  const[pd,setPd]=useState({});
  const[sm,setSm]=useState({});
  const[sel,setSel]=useState(null);
  const[std,setStd]=useState([]);
  const[abl,setAbl]=useState([]);
  const[pts,setPts]=useState({w:0,b:0});
  const[white,setWhite]=useState('human');
  const[black,setBlack]=useState('gladiatore');
  const[lvlUp,setLvlUp]=useState(null);
  const timer=useRef();

  useEffect(()=>{const s=buildState(game);setPd(s.pd);setSm(s.sm);},[]);

  const getMoves=sq=>{const p=game.get(sq);if(!p)return{std:[],abl:[]};const std=game.moves({square:sq,verbose:true});const id=sm[sq];const d=pd[id];const e=EVOLUTIONS[p.type];const abl=e&&d?e.getAbilityMoves(sq,game,d.level,p.color):[];return{std,abl};};

  const makeMove=(from,to,isAb)=>{
    const turn=game.turn();
    let ng;
    if(isAb){
      const pc=game.get(from);
      ng=new Chess(game.fen());
      ng.remove(from);
      if(ng.get(to))ng.remove(to);
      ng.put(pc,to);
      const p=ng.fen().split(' ');
      p[1]=p[1]==='w'?'b':'w';
      p[3]='-';
      ng.load(p.join(' '));
    }else{
      ng=new Chess(game.fen());
      const mv=ng.move({from,to,promotion:'q'});
      if(!mv)return;
    }
    const mid=sm[from];
    const nsm={...sm};
    const npd={...pd};
    const capId = nsm[to];
    if(capId && npd[capId]?.color!== npd[mid]?.color) delete npd[capId];
    delete nsm[from];
    nsm[to]=mid;
    const np=ng.get(to);
    const promo=np&&np.type!==pd[mid]?.type;
    if(promo){
      npd[mid]={...npd[mid],type:np.type,level:1};
      const nid=`${np.color}${np.type}_${to}`;
      npd[nid]={...npd[mid],id:nid};
      delete npd[mid];
      nsm[to]=nid;
    }
    let p=1;
    if(game.get(to))p++;
    if(ng.in_check())p++;
    if(promo)p+=2;
    setPts(ps=>({...ps, [turn]: ps[turn] + p}));
    setGame(ng);
    setPd(npd);
    setSm(nsm);
    setSel(null);
  };

  const handleEvolveSq=(sq)=>{
    const t=game.turn();
    if(pts[t]<2)return;
    const id=sm[sq];
    const d=pd[id];
    if(!d||d.level>=3)return;
    setPd(p=>({...p,[id]:{...d,level:d.level+1}}));
    setPts(p=>({...p,[t]:p[t]-2}));
    setLvlUp(sq);
    setTimeout(()=>setLvlUp(null),700);
    setSel(null);
  };

  // AI TURN
  useEffect(() => {
    const turn = game.turn();
    const aiType = turn === 'w'? white : black;
    const personality = PERSONALITIES[aiType];

    if (!personality.ai || game.game_over()) return;

    let isActive = true;

    const runAI = async () => {
      const action = await HybridAI.chooseAction(game, pd, sm, pts, turn, personality.depth);

      if (!isActive) return;

      if (action.type === 'evolve') {
        setSel(action.sq);
        handleEvolveSq(action.sq);
        setTimeout(() => {}, 600);
      } else {
        makeMove(action.from, action.to, action.type === 'ability');
      }
    };

    timer.current = setTimeout(runAI, 500);

    return () => {
      isActive = false;
      clearTimeout(timer.current);
    };
  }, [game, pd, sm, pts, white, black]);

  const board=game.board();
  const turn=game.turn();
  const selId=sel?sm[sel]:null;
  const selD=selId?pd[selId]:null;
  const canEvo=selD&&selD.level<3&&game.get(sel)?.color===turn&&pts[turn]>=2&&EVOLUTIONS[game.get(sel)?.type];

  const click=sq=>{
    const human=(turn==='w'&&!PERSONALITIES[white].ai)||(turn==='b'&&!PERSONALITIES[black].ai);
    if(!human)return;
    const pc=game.get(sq);
    if(sel){
      const s=std.find(m=>m.to===sq);
      const a=abl.find(m=>m.to===sq);
      if(s||a){makeMove(sel,sq,!!a);return;}
      if(pc?.color===turn){setSel(sq);const m=getMoves(sq);setStd(m.std);setAbl(m.abl);}
      else{setSel(null);}
    }else if(pc?.color===turn){
      setSel(sq);
      const m=getMoves(sq);
      setStd(m.std);
      setAbl(m.abl);
    }
  };

  return(
    <div className="app">
      <div className="top-bar">{Object.keys(PERSONALITIES).map(k=><button key={'w'+k} className={`mode-btn ${white===k?'active':''}`} onClick={()=>setWhite(k)} title={PERSONALITIES[k].desc}>W:{PERSONALITIES[k].name}</button>)}</div>
      <div className="player-row"><div className="player-label">Nero: {PERSONALITIES[black].name}<span className="energy-badge">⚡{pts.b}</span></div></div>
      <div className="board-wrap"><div className="board">{board.map((r,ri)=>r.map((c,ci)=>{const sq='abcdefgh'[ci]+(8-ri);const selc=sel===sq;const isStd=std.some(m=>m.to===sq);const isAb=abl.some(m=>m.to===sq);const id=sm[sq];const d=id?pd[id]:null;const lv=d?.level||1;return<div key={sq} onClick={()=>click(sq)} className={`cell ${(ri+ci)%2?'light':'dark'} ${selc?'sel':''}`}>{(isStd||isAb)&&!c&&<div style={{position:'absolute',width:'26%',height:'26%',borderRadius:'50%',background:isAb?'#f59e0b':'#22c55e'}}/>}{c&&<span className={`piece piece-${c.color} ${lv===2?'evo2':lv===3?'evo3':''}`} style={{transform:lvlUp===sq?'scale(1.4)':'scale(1)'}}>{ICONS[c.color][c.type]}</span>}{c&&lv>1&&<div className={`level-mark ${lv===2?'lm2':'lm3'}`}>{'●'.repeat(lv-1)}</div>}</div>;}))}</div></div>
      <div className="player-row"><div className="player-label">Bianco: {PERSONALITIES[white].name}<span className="energy-badge">⚡{pts.w}</span></div></div>
      <div className="panel"><div className="charge-row"><span>{turn==='w'?'Bianco':'Nero'}</span><span>{pts[turn]}/2</span></div><div className="charge-track"><div style={{width:`${Math.min(pts[turn]/2*100,100)}%`,height:'100%',background:pts[turn]>=2?'#22c55e':'#38bdf8'}}/></div><div className="panel-bottom"><div className="piece-label">{selD?`${EVOLUTIONS[game.get(sel)?.type]?.levels[selD.level-1]?.name} Lv${selD.level}`:'Seleziona'}</div><button className="evolve-btn" disabled={!canEvo} onClick={()=>handleEvolveSq(sel)}>EVOLVI</button><div className="turn-pill">{game.in_check()?'SCACCO':''}</div></div></div>
      <div className="top-bar">{Object.keys(PERSONALITIES).map(k=><button key={'b'+k} className={`mode-btn ${black===k?'active':''}`} onClick={()=>setBlack(k)} title={PERSONALITIES[k].desc}>B:{PERSONALITIES[k].name}</button>)}</div>

      {game.game_over() && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.85)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',zIndex:99,gap:12}}>
          <div style={{fontSize:22,fontWeight:800,color:'#38bdf8'}}>{game.in_checkmate()?`${turn==='w'?'Nero':'Bianco'} vince!`:'Pareggio'}</div>
          <button onClick={()=>{const g=new Chess();const s=buildState(g);setGame(g);setPd(s.pd);setSm(s.sm);setPts({w:0,b:0});setSel(null);}} style={{padding:'10px 28px',background:'#38bdf8',border:'none',borderRadius:8,fontWeight:800,fontSize:14,cursor:'pointer'}}>RIVINCITA</button>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
