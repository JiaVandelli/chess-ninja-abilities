<script type="text/babel">
const {useState,useEffect,useCallback,useRef} = React;
const Chess = window.Chess;
const ICONS = {w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};

// ═══════════ EVOLUZIONI ═══════════
const EVOLUTIONS = { /* invariato */ };
const BASE_VALS={p:1,n:3.2,b:3.3,r:5,q:9,k:200};
function rpgVal(type,level){ /* invariato */ }

// ═══════════ DEEP NEURAL NETWORK (POLICY + VALUE) ═══════════
class DeepPolicyNetwork {
    constructor(inputSize, hiddenSizes, actionSize) {
        this.inputSize = inputSize;
        this.hiddenSizes = hiddenSizes;
        this.actionSize = actionSize;
        
        let sizes = [inputSize, ...hiddenSizes];
        this.W = [];
        this.b = [];
        for (let i = 1; i < sizes.length; i++) {
            const w = new Float32Array(sizes[i] * sizes[i-1]);
            for (let j = 0; j < w.length; j++) {
                w[j] = (Math.random()*2-1) * Math.sqrt(2.0 / sizes[i-1]);
            }
            this.W.push(w);
            this.b.push(new Float32Array(sizes[i]));
        }
        // Testa Policy
        const lastHidden = hiddenSizes[hiddenSizes.length-1];
        const wPolicy = new Float32Array(actionSize * lastHidden);
        for (let j = 0; j < wPolicy.length; j++) {
            wPolicy[j] = (Math.random()*2-1) * Math.sqrt(2.0 / lastHidden);
        }
        this.W.push(wPolicy);
        this.b.push(new Float32Array(actionSize));
        // Testa Value
        const wValue = new Float32Array(lastHidden);
        for (let j = 0; j < wValue.length; j++) {
            wValue[j] = (Math.random()*2-1) * Math.sqrt(2.0 / lastHidden);
        }
        this.W.push(wValue);
        this.b.push(new Float32Array(1));
    }

    forwardPolicy(inputArray) {
        let current = new Float32Array(inputArray);
        for (let i = 0; i < this.W.length - 2; i++) {
            const w = this.W[i], b = this.b[i];
            const next = new Float32Array(b.length);
            for (let out = 0; out < b.length; out++) {
                let sum = b[out];
                for (let inn = 0; inn < current.length; inn++) {
                    sum += current[inn] * w[out*current.length + inn];
                }
                next[out] = sum > 0 ? sum : 0;
            }
            current = next;
        }
        // Policy
        const wPolicy = this.W[this.W.length-2], bPolicy = this.b[this.b.length-2];
        const logits = new Float32Array(bPolicy.length);
        for (let out = 0; out < bPolicy.length; out++) {
            let sum = bPolicy[out];
            for (let inn = 0; inn < current.length; inn++) {
                sum += current[inn] * wPolicy[out*current.length + inn];
            }
            logits[out] = sum;
        }
        // Softmax
        const maxLogit = Math.max(...logits);
        let sumExp = 0;
        const probs = new Float32Array(logits.length);
        for (let i = 0; i < logits.length; i++) {
            probs[i] = Math.exp(logits[i] - maxLogit);
            sumExp += probs[i];
        }
        for (let i = 0; i < probs.length; i++) probs[i] /= sumExp;
        // Value
        const wValue = this.W[this.W.length-1], bValue = this.b[this.b.length-1];
        let value = bValue[0];
        for (let inn = 0; inn < current.length; inn++) {
            value += current[inn] * wValue[inn];
        }
        value = Math.tanh(value);
        return { probs, value };
    }

    // Training: aggiorna con errore policy (log loss) + value error (MSE)
    train(inputVec, targetProbs, targetValue, lr = 0.005) {
        // Forward con memorizzazione degli stati intermedi per backprop
        let activations = [new Float32Array(inputVec)];
        let zs = [];
        let current = activations[0];
        for (let i = 0; i < this.W.length; i++) {
            const w = this.W[i], b = this.b[i];
            const next = new Float32Array(b.length);
            for (let out = 0; out < b.length; out++) {
                let sum = b[out];
                for (let inn = 0; inn < current.length; inn++) {
                    sum += current[inn] * w[out*current.length + inn];
                }
                next[out] = sum;
            }
            zs.push(next);
            if (i < this.W.length - 1) {
                const a = next.map(x => x > 0 ? x : 0);
                activations.push(a);
                current = a;
            } else {
                activations.push(next);
            }
        }
        // Calcolo errori
        const lastZ = zs[zs.length-1]; // per value
        const valueOut = Math.tanh(lastZ[0]);
        const valueError = targetValue - valueOut;
        const valueGrad = valueError * (1 - valueOut * valueOut);
        
        // Policy gradient
        const policyZ = zs[zs.length-2];
        const logits = new Float32Array(policyZ);
        const probs = new Float32Array(logits.length);
        let maxLogit = -Infinity;
        for (let i = 0; i < logits.length; i++) if (logits[i] > maxLogit) maxLogit = logits[i];
        let sumExp = 0;
        for (let i = 0; i < logits.length; i++) { probs[i] = Math.exp(logits[i] - maxLogit); sumExp += probs[i]; }
        for (let i = 0; i < probs.length; i++) probs[i] /= sumExp;
        const policyGrad = new Float32Array(probs.length);
        for (let i = 0; i < probs.length; i++) policyGrad[i] = probs[i] - (targetProbs[i] || 0);
        
        // Backprop
        let deltaPolicy = new Float32Array(policyGrad);
        let deltaValue = new Float32Array([valueGrad]);
        for (let i = this.W.length-1; i >= 0; i--) {
            const w = this.W[i];
            const b = this.b[i];
            const prevA = activations[i];
            const currSize = b.length;
            const nextDelta = new Float32Array(prevA.length);
            if (i === this.W.length-1) {
                // Value head
                for (let out = 0; out < currSize; out++) {
                    const err = deltaValue[out];
                    b[out] -= lr * err;
                    for (let inn = 0; inn < prevA.length; inn++) {
                        nextDelta[inn] += w[out*prevA.length + inn] * err;
                        w[out*prevA.length + inn] -= lr * err * prevA[inn];
                    }
                }
                deltaPolicy = nextDelta;
            } else if (i === this.W.length-2) {
                // Policy head
                const next = new Float32Array(prevA.length);
                for (let out = 0; out < currSize; out++) {
                    const err = deltaPolicy[out];
                    b[out] -= lr * err;
                    for (let inn = 0; inn < prevA.length; inn++) {
                        next[inn] += w[out*prevA.length + inn] * err;
                        w[out*prevA.length + inn] -= lr * err * prevA[inn];
                    }
                }
                deltaPolicy = next;
            } else {
                // Hidden layers con ReLU
                const z = zs[i];
                for (let out = 0; out < currSize; out++) {
                    const err = deltaPolicy[out];
                    b[out] -= lr * err;
                    for (let inn = 0; inn < prevA.length; inn++) {
                        nextDelta[inn] += w[out*prevA.length + inn] * err;
                        w[out*prevA.length + inn] -= lr * err * prevA[inn];
                    }
                }
                for (let j = 0; j < prevA.length; j++) {
                    nextDelta[j] = z[j] > 0 ? nextDelta[j] : 0;
                }
                deltaPolicy = nextDelta;
            }
        }
    }

    save() { return JSON.stringify({ W: Array.from(this.W).map(a=>Array.from(a)), b: Array.from(this.b).map(a=>Array.from(a)) }); }
    load(str) {
        try {
            const d = JSON.parse(str);
            this.W = d.W.map(a => new Float32Array(a));
            this.b = d.b.map(a => new Float32Array(a));
            return true;
        } catch(e) { return false; }
    }
}

// Input 256, hidden 256-128-64, output azioni + value
const NN = new DeepPolicyNetwork(256, [256, 128, 64], 4096); // max azioni codificate
const saved = localStorage.getItem('omega_v7');
if (saved) NN.load(saved);

// ═══════════ ENCODING STATE (256 input) ═══════════
function encodeState(game, pd, sm, pts, color) {
    const v = new Float32Array(256);
    const board = game.board();
    const typeMap = {p:1,n:3,b:4,r:5,q:9,k:20};
    let idx = 0;
    // 64 pezzi
    for (let r=0; r<8; r++) for (let c=0; c<8; c++) {
        const p = board[r][c];
        if (p) {
            const sq = 'abcdefgh'[c]+(8-r);
            const data = pd[sm[sq]];
            const level = data?.level || 1;
            v[idx] = typeMap[p.type] * level * (data?.summoned ? 0.5 : 1) * (p.color===color?1:-1);
        }
        idx++;
    }
    // 64 livelli
    for (let r=0; r<8; r++) for (let c=0; c<8; c++) {
        const p = board[r][c];
        if (p) {
            const sq = 'abcdefgh'[c]+(8-r);
            const data = pd[sm[sq]];
            v[idx] = (data?.level || 1) * (p.color===color?1:-1);
        }
        idx++;
    }
    // 64 evocazioni
    for (let r=0; r<8; r++) for (let c=0; c<8; c++) {
        const p = board[r][c];
        if (p) {
            const sq = 'abcdefgh'[c]+(8-r);
            const data = pd[sm[sq]];
            v[idx] = (data?.summoned ? 1 : 0) * (p.color===color?1:-1);
        }
        idx++;
    }
    const opp = color==='w'?'b':'w';
    v[idx++] = pts[color]/10;
    v[idx++] = pts[opp]/10;
    v[idx++] = game.turn()===color ? 1 : 0;
    v[idx++] = game.in_check() ? (game.turn()===color ? 1 : 0) : 0;
    return v;
}

// ═══════════ CODIFICA AZIONI ═══════════
function actionToIndex(action, allActions) {
    return allActions.indexOf(action);
}
function indexToAction(idx, allActions) {
    return allActions[idx];
}

// ═══════════ GENERA TUTTE LE AZIONI (incluso evolvi) ═══════════
function getAllActions(game, pd, sm, pts, color) {
    const actions = getAIActions(game,pd,sm,pts,color); // mosse+abilità+summon+devolve
    // Aggiungi evoluzioni come azioni
    const evoActions = getEvolvablePieces(game,pd,sm,pts,color);
    for (const evo of evoActions) {
        actions.push({type:'evolve', sq: evo.sq, cost: evo.cost, newLevel: evo.newLevel});
    }
    return actions;
}

// ═══════════ MOTORE DI RICERCA 3-PLY ═══════════
function evaluatePosition(game,pd,sm,pts,color) {
    const v = encodeState(game,pd,sm,pts,color);
    return NN.forwardPolicy(v).value;
}

function searchBestAction(game, pd, sm, pts, color, cooldowns, depth=2) {
    const allActions = getAllActions(game,pd,sm,pts,color);
    if (!allActions.length) return null;
    
    let bestAction = allActions[0];
    let bestScore = -Infinity;
    
    for (const action of allActions) {
        let nextState = applyAction(game,pd,sm,pts,action,cooldowns,color);
        if (!nextState) continue;
        // Auto-applica evoluzione è rimossa: la rete deve decidere
        let score = -evaluatePosition(nextState.game, nextState.pd, nextState.sm, nextState.pts, color==='w'?'b':'w');
        if (depth > 1) {
            // semplice ricerca avversario
            const oppActions = getAllActions(nextState.game, nextState.pd, nextState.sm, nextState.pts, color==='w'?'b':'w');
            let worstOpp = Infinity;
            for (const oppA of oppActions.slice(0,10)) {
                let oppState = applyAction(nextState.game, nextState.pd, nextState.sm, nextState.pts, oppA, cooldowns, color==='w'?'b':'w');
                if (!oppState) continue;
                let val = evaluatePosition(oppState.game, oppState.pd, oppState.sm, oppState.pts, color);
                worstOpp = Math.min(worstOpp, val);
            }
            score = -worstOpp;
        }
        if (score > bestScore) {
            bestScore = score;
            bestAction = action;
        }
    }
    return bestAction;
}

// ═══════════ TRAINING REINFORCEMENT ═══════════
const replayBuffer = [];
function addToReplay(stateVec, actionIdx, reward, nextStateVec) {
    replayBuffer.push({s:stateVec, a:actionIdx, r:reward, ns:nextStateVec});
    if (replayBuffer.length > 5000) replayBuffer.shift();
}

function trainOnReplay(batchSize=32) {
    if (replayBuffer.length < batchSize) return;
    for (let i=0; i<batchSize; i++) {
        const idx = Math.floor(Math.random() * replayBuffer.length);
        const exp = replayBuffer[idx];
        const {probs, value: currentV} = NN.forwardPolicy(exp.s);
        const nextV = NN.forwardPolicy(exp.ns).value;
        const targetV = exp.r + 0.95 * nextV;
        const targetProbs = new Float32Array(probs.length);
        targetProbs[exp.a] = 1;
        NN.train(exp.s, targetProbs, targetV, 0.005);
    }
}

async function trainDeep(totalGames, onProgress, wakeLockRef) {
    let completed = 0, wins = {w:0,b:0};
    for (let i=0; i<totalGames; i++) {
        const g = new Chess();
        let state = {game:g, ...buildState(g), cooldowns:{}};
        const history = [];
        for (let mc=0; mc<200; mc++) {
            if (state.game.game_over()) break;
            const color = state.game.turn();
            const stateVec = encodeState(state.game, state.pd, state.sm, state.pts, color);
            const allActions = getAllActions(state.game, state.pd, state.sm, state.pts, color);
            const action = searchBestAction(state.game, state.pd, state.sm, state.pts, color, state.cooldowns, 1);
            if (!action) break;
            const actionIdx = actionToIndex(action, allActions);
            let next = applyAction(state.game, state.pd, state.sm, state.pts, action, state.cooldowns, color);
            if (!next) break;
            const nextVec = encodeState(next.game, next.pd, next.sm, next.pts, color==='w'?'b':'w');
            history.push({stateVec, actionIdx, color, nextVec});
            state = next;
        }
        let winner = null;
        if (state.game.in_checkmate()) winner = state.game.turn()==='w'?'b':'w';
        else winner = estimateWinner(state.game, state.pd, state.sm);
        
        const finalReward = winner ? (winner==='w'?1:-1) : 0;
        for (let t=history.length-1; t>=0; t--) {
            const {stateVec, actionIdx, color, nextVec} = history[t];
            const reward = (color===winner) ? finalReward : -finalReward;
            addToReplay(stateVec, actionIdx, reward, nextVec);
        }
        if (completed%10===0) {
            trainOnReplay(64);
            localStorage.setItem('omega_v7', NN.save());
            localStorage.setItem('omega_games_count', completed);
            onProgress({current:completed, total:totalGames, wins});
        }
        if (completed%100===0) await new Promise(r=>setTimeout(r,50));
        await new Promise(r=>setTimeout(r,0));
        completed++;
    }
    if (wakeLockRef?.current) wakeLockRef.current.release();
    return {total:completed, wins};
}
