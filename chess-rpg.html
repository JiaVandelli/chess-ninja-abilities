  <title>Chess RPG – L'Esercito dell'Anima v4.7 (tutto ok)</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;margin:0;overflow:hidden;background:#060913}
    #root{height:100%}
    #error-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:#f87171;font-family:monospace;font-size:14px;z-index:9999;display:none;padding:20px}
    .app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:8px;gap:6px;color:#f1f5f9;font-family:system-ui,sans-serif}
    .top-bar{flex-shrink:0;height:40px;display:flex;gap:6px;align-items:center;justify-content:flex-end}

    .prestige-badge{flex-shrink:0;padding:0 12px;height:100%;background:#1e293b;border:none;color:#eab308;border-radius:8px;font-size:12px;display:flex;align-items:center;gap:4px;font-weight:700}
    .player-row{flex-shrink:0;height:48px;display:flex;gap:8px;align-items:center}
    .player-label{flex:1;height:100%;background:#0b0f19;border:1px solid #1e293b;border-radius:10px;display:flex;flex-direction:column;justify-content:center;padding:0 12px;overflow:hidden}

    .board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
    .board{--side:min(calc(100vw - 16px),calc(100vh - 280px));width:var(--side);height:var(--side);display:grid;grid-template-columns:repeat(8,1fr);border-radius:4px;overflow:hidden;border:3px solid #4b3220;box-shadow:0 0 0 5px #6b4423,0 6px 24px rgba(0,0,0,.6)}
    .cell{position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--side)/8*.72);cursor:pointer;aspect-ratio:1/1}
    .cell.light{background:#f0d9b5}.cell.dark{background:#b58863}
    .cell.last-from.light,.cell.last-to.light{background:#f6f669}
    .cell.last-from.dark,.cell.last-to.dark{background:#c8b400}
    .cell.sel{outline:3px solid #a855f7;outline-offset:-3px;background:#2d1f4e!important}
    .cell.aura-cell{box-shadow:inset 0 0 12px rgba(239,68,68,0.7)}
    .cell.stunned-piece{box-shadow:inset 0 0 12px rgba(99,102,241,0.8)}
    .cell.immune-highlight{outline:2px solid #fbbf24;outline-offset:-2px}
    .cell.ghost-march-ally{box-shadow:inset 0 0 15px #22c55e;background:rgba(34,197,94,.2)!important}
    .cell.soul-dart-zone{box-shadow:inset 0 0 12px #ff6b6b;background:rgba(255,107,107,.15)!important}
    .piece{font-family:"Segoe UI Symbol","Noto Sans Symbols",sans-serif;line-height:1;user-select:none;z-index:2}
    .piece-w{color:#fff;text-shadow:0 0 0 #000,0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.7))}
    .piece-b{color:#000;text-shadow:0 0 0 #fff,0 1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff,0 -1px 0 #fff;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.5))}
    .evo2{filter:drop-shadow(0 0 4px #a855f7)!important}
    .panel{flex-shrink:0;min-height:90px;background:#0b0f19;border:1px solid #1e293b;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:5px}
    .charge-row{display:flex;justify-content:space-between;font-size:10px;font-weight:800;color:#94a3b8}
    .charge-track{width:100%;height:4px;background:#1e293b;border-radius:2px;overflow:hidden;margin-top:2px}
    .panel-bottom{display:flex;align-items:center;gap:6px}
    .piece-label{flex:1;font-size:11px;min-width:0}
    .turn-pill{flex-shrink:0;padding:3px 8px;border-radius:16px;font-size:11px;font-weight:700;background:#1e293b}
    .btn-row{display:flex;gap:4px;flex-wrap:wrap}
    .ability-btn{flex:1;min-width:80px;padding:5px 6px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid #334155;background:#0f172a;color:#cbd5e1;text-align:center}
    .ability-btn:disabled{opacity:0.4;cursor:not-allowed}
    .pass-btn{padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer;border:none;background:#1e3a5f;color:#93c5fd;font-size:13px;margin-top:4px}
    @keyframes lvlup{0%{transform:scale(1)}40%{transform:scale(1.8) rotate(10deg)}100%{transform:scale(1)}}
    .lvlup-anim{animation:lvlup .9s ease}
    .hint-text{font-size:10px;color:#475569;font-style:italic}
  </style>
</head>
<body>
<div id="root"></div>
<div id="error-overlay"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script>
  window.addEventListener('error', function(e) {
    var el = document.getElementById('error-overlay');
    if (el) {
      el.style.display = 'flex';
      el.textContent = 'ERRORE: ' + (e.message || 'caricamento fallito') + ' – apri la console (F12) per i dettagli.';
    }
  });
  setTimeout(function() {
    if (document.getElementById('root').children.length === 0 && !document.getElementById('error-overlay').style.display.includes('flex')) {
      var el = document.getElementById('error-overlay');
      el.style.display = 'flex';
      el.textContent = 'React non ha renderizzato nulla. Prova a svuotare la cache (Ctrl+Shift+Canc) o usa una finestra anonima.';
    }
  }, 4000);
</script>
<script type="text/babel" data-presets="react">
if (typeof React === 'undefined') throw new Error('React non caricato');
if (typeof ReactDOM === 'undefined') throw new Error('ReactDOM non caricato');
if (typeof Chess === 'undefined') throw new Error('Chess.js non caricato');

const {useState,useEffect,useCallback,useRef,useMemo} = React;

const ICONS = {w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},
               b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};
const EVO_NAMES = {p:'Assaltatore',n:'Destriero',b:'Spettro',r:'Alchimista',q:'Imperatrice',k:'Re'};
const EVO_COST  = {p:2, n:2, b:2, r:3, q:5};
const PRESTIGE  = {p:1, n:2, b:2, r:3, q:4};
const ABILITY_BASE_COST = { ghostMarch:3, frenzyCharge:2, spectralStep:2, elixir:2, royalCommand:5, soulDart:3 };

let _id = 0;
const nextId = () => ++_id;

const SQ = (f,r) => f>=0&&f<=7&&r>=1&&r<=8 ? String.fromCharCode(97+f)+r : null;
const FILE = sq => sq.charCodeAt(0)-97;
const RANK = sq => parseInt(sq[1]);
const knightJumps = sq => {
  const f=FILE(sq), r=RANK(sq);
  return [[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]]
    .map(([df,dr]) => SQ(f+df,r+dr)).filter(Boolean);
};
const DIAG_DIRS = [[1,1],[1,-1],[-1,1],[-1,-1]];
const STRAIGHT_DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

function buildState(g) {
  var pd={}, sm={};
  g.board().forEach(function(row, r) { 
    row.forEach(function(cell, c) {
      if (!cell) return;
      var sq = 'abcdefgh'[c] + (8 - r);
      var id = cell.color + cell.type + '_' + nextId();
      pd[id] = {type: cell.type, color: cell.color, level: 1};
      sm[sq] = id;
    }); 
  });
  return {pd: pd, sm: sm};
}

function applyStd(game, from, to, promotion) {
  if (!promotion) promotion = 'q';
  var g = new Chess(game.fen());
  var mv = g.move({from:from, to:to, promotion:promotion});
  if (!mv) return null;
  var cap = null;
  if (mv.captured) cap = mv.flags && mv.flags.indexOf('e') !== -1 ? {type:mv.captured, _sq: to[0]+from[1]} : {type:mv.captured};
  return {game:g, captured:cap, castleK: mv.flags && mv.flags.indexOf('k') !== -1, castleQ: mv.flags && mv.flags.indexOf('q') !== -1};
}

function kingInCheck(game, color, pd, sm, stunnedSet, ghostMarchColor) {
  var fen = game.fen().split(' ');
  fen[1] = color; fen[3] = '-';
  if (new Chess(fen.slice(0,4).join(' ')+' 0 1').in_check()) return true;

  var opp = color==='w'?'b':'w';
  var kSq = null;
  
  game.board().forEach(function(row, r) { 
    row.forEach(function(p, c) {
      if (p && p.type==='k' && p.color===color) {
        kSq = 'abcdefgh'[c] + (8 - r);
      }
    }); 
  });
  if (!kSq) return false;

  var entries = Object.entries(sm);
  for (var i=0; i<entries.length; i++) {
    var sq = entries[i][0], id = entries[i][1];
    var p = game.get(sq);
    if (!p || p.color !== opp || (stunnedSet && stunnedSet.has(id))) continue;
    var d = pd[id];
    if (!d || d.level < 2) continue;
    if (p.type === 'q' && knightJumps(sq).indexOf(kSq) !== -1) return true;
  }

  for (var i=0; i<entries.length; i++) {
    var sq = entries[i][0], id = entries[i][1];
    var p = game.get(sq);
    if (!p || p.color !== opp || (stunnedSet && stunnedSet.has(id)) || p.type !== 'b') continue;
    var d = pd[id];
    if (!d || d.level < 2) continue;
    var df = Math.sign(FILE(kSq) - FILE(sq));
    var dr = Math.sign(RANK(kSq) - RANK(sq));
    if (Math.abs(FILE(kSq)-FILE(sq)) !== Math.abs(RANK(kSq)-RANK(sq)) || df===0) continue;
    var jumped = false;
    var f = FILE(sq)+df, r = RANK(sq)+dr;
    while (f !== FILE(kSq) || r !== RANK(kSq)) {
      var midSq = SQ(f,r);
      if (!midSq) break;
      var midPiece = game.get(midSq);
      if (midPiece) {
        if (jumped) { jumped = false; break; }
        jumped = true;
      }
      f += df; r += dr;
    }
    if (jumped) return true;
  }

  for (var i=0; i<entries.length; i++) {
    var sq = entries[i][0], id = entries[i][1];
    var p = game.get(sq);
    if (!p || p.color !== opp || (stunnedSet && stunnedSet.has(id)) || p.type !== 'p') continue;
    var d = pd[id];
    if (!d || d.level < 2) continue;
    var dir = opp === 'w' ? 1 : -1;
    var pf = FILE(sq), pr = RANK(sq);
    var attacks = [[pf-1, pr+dir], [pf, pr+dir], [pf+1, pr+dir]];
    for (var j=0; j<attacks.length; j++) {
      if (attacks[j][0] === FILE(kSq) && attacks[j][1] === RANK(kSq)) return true;
    }
  }

  if (ghostMarchColor === opp) {
    for (var i=0; i<entries.length; i++) {
      var sq = entries[i][0], id = entries[i][1];
      var p = game.get(sq);
      if (!p || p.color !== opp || (stunnedSet && stunnedSet.has(id))) continue;
      if (p.type !== 'r' && p.type !== 'q') continue;
      var df = Math.sign(FILE(kSq) - FILE(sq));
      var dr = Math.sign(RANK(kSq) - RANK(sq));
      if ((p.type === 'r' && df !== 0 && dr !== 0) || (p.type === 'q' && df === 0 && dr === 0)) continue;
      if (p.type === 'q' && Math.abs(FILE(kSq)-FILE(sq)) !== Math.abs(RANK(kSq)-RANK(sq)) && df !== 0 && dr !== 0) continue;
      var f = FILE(sq)+df, r = RANK(sq)+dr;
      var blocked = false;
      while (f !== FILE(kSq) || r !== RANK(kSq)) {
        var midSq = SQ(f,r);
        if (!midSq) break;
        var midPiece = game.get(midSq);
        if (midPiece) {
          var midId = sm[midSq];
          if (midPiece.color === opp && midPiece.type === 'p' && pd[midId] && pd[midId].level === 2) {
            f += df; r += dr;
            continue;
          }
          blocked = true;
          break;
        }
        f += df; r += dr;
      }
      if (!blocked) return true;
    }
  }

  return false;
}

function App() {
  var [game, setGame] = useState(function() { return new Chess(); });
  var [pd, setPd] = useState({});
  var [sm, setSm] = useState({});
  var [sel, setSel] = useState(null);
  var [moves, setMoves] = useState([]);
  var [pts, setPts] = useState({w:0,b:0});
  var [last, setLast] = useState(null);
  var [flipped, setFlip] = useState(false);
  var [stunned, setStunned] = useState(new Set());
  var [immune, setImmune] = useState(null);
  var [ghostMarch, setGhostMarch] = useState(null);
  var [gameOver, setGameOver] = useState(null);
  var [lvlUpSq, setLvlUpSq] = useState(null);

  var [hasMoved, setHasMoved] = useState(false);
  var [actualTurn, setActualTurn] = useState('w');

  var [cmdMode, setCmdMode] = useState(false);
  var [cmdCost, setCmdCost] = useState(5);
  var [cmdSrc, setCmdSrc] = useState(null);
  var [cmdDiscount, setCmdDiscount] = useState(false);

  var [elixMode, setElixMode] = useState(false);
  var [elixCost, setElixCost] = useState(2);
  var [elixSrc, setElixSrc] = useState(null);

  var [frenzyMode, setFrenzyMode] = useState(false);
  var [spectralMode, setSpectralMode] = useState(false);
  var [dartMode, setDartMode] = useState(false);
  var [dartSrc, setDartSrc] = useState(null);
  var [dartCost, setDartCost] = useState(3);
  var [dartRefund, setDartRefund] = useState(0);

  var [frenzyUsed, setFrenzyUsed] = useState(new Set());
  var [soulDartZone, setSoulDartZone] = useState([]);
  var [soulDartOwner, setSoulDartOwner] = useState(null);

  var [auraGained, setAuraGained] = useState({w:0,b:0});
  var lvlTimer = useRef(null);

  useEffect(function() {
    var s = buildState(game);
    setPd(s.pd);
    setSm(s.sm);
  }, []);

  var inEnemyAura = useCallback(function(sq, myColor) {
    var opp = myColor==='w'?'b':'w';
    var entries = Object.entries(sm);
    for (var i=0; i<entries.length; i++) {
      var osq = entries[i][0], oid = entries[i][1];
      var p = game.get(osq);
      if (p && p.color===opp && p.type==='n' && pd[oid] && pd[oid].level===2) {
        if (knightJumps(osq).indexOf(sq) !== -1) return true;
      }
    }
    return false;
  }, [game,sm,pd]);

  var effLevel = useCallback(function(sq, id, color) {
    var d = pd[id];
    if (!d) return 1;
    if (d.level===2 && inEnemyAura(sq, color)) return 1;
    return d.level;
  }, [pd, inEnemyAura]);

  var calcPrestige = useCallback(function(color) {
    var total=0;
    var entries = Object.entries(sm);
    for (var i=0; i<entries.length; i++) {
      var sq = entries[i][0], id = entries[i][1];
      var p = game.get(sq);
      if (p && p.color===color && effLevel(sq,id,color)===2) total += (PRESTIGE[p.type] || 0);
    }
    return total;
  }, [game,sm,pd,effLevel]);

  var activeColor = actualTurn;
  var prestige = calcPrestige(activeColor);
  var pdDiscount = prestige>=15 ? 1 : 0;
  var pdBonusEnergy = prestige>=10;
  var pdCanDevolve = prestige>=5;

  var isImmune = useCallback(function(sq) {
    if (!immune || immune.sq!==sq) return false;
    var rookId = immune.rookId;
    var rookSq = null;
    var entries = Object.entries(sm);
    for (var i=0; i<entries.length; i++) {
      if (entries[i][1] === rookId) { rookSq = entries[i][0]; break; }
    }
    if (!rookSq) return false;
    return FILE(rookSq)===FILE(sq) || RANK(rookSq)===RANK(sq);
  }, [immune,sm]);

  var getActualCost = useCallback(function(baseCost) { return Math.max(1, baseCost - pdDiscount); }, [pdDiscount]);
  var getEvoCost = useCallback(function(type) { return Math.max(1, (EVO_COST[type]||99) - pdDiscount); }, [pdDiscount]);

  var getMoves = useCallback(function(sq, isCommandTurn, wasOppInCheck, specialMode) {
    var p = game.get(sq);
    if (!p) return [];
    var color = p.color;
    var id = sm[sq];
    if (!id || stunned.has(id)) return [];
    var d = pd[id];
    var evo2 = effLevel(sq, id, color) === 2;
    var result = [];

    if (!specialMode || specialMode==='normal') {
      var ms = game.moves({square:sq, verbose:true});
      for (var i=0; i<ms.length; i++) {
        var m = ms[i];
        if (m.promotion && m.promotion!=='q') continue;
        var g2 = new Chess(game.fen());
        if (!g2.move({from:m.from, to:m.to, promotion:m.promotion||'q'})) continue;
        var nsm = Object.assign({}, sm);
        nsm[m.to] = nsm[m.from]; delete nsm[m.from];
        if (m.captured) {
          var cs = (m.flags && m.flags.indexOf('e') !== -1) ? m.to[0]+sq[1] : m.to;
          if (isImmune(cs)) continue;
          delete nsm[cs];
        }
        if (kingInCheck(g2,color,pd,nsm,stunned,ghostMarch)) continue;
        if (isCommandTurn && (g2.in_checkmate() || (wasOppInCheck && g2.in_check()))) continue;
        result.push({type:'std', from:sq, to:m.to, promo:m.promotion});
      }
    }

    if (!evo2) return result;

    if (specialMode === 'frenzyCharge' && p.type==='n') {
      var jumps = knightJumps(sq);
      for (var j=0; j<jumps.length; j++) {
        var tsq = jumps[j];
        var tp = game.get(tsq);
        if (tp && tp.color===color) continue;
        var g2 = new Chess(game.fen()); g2.remove(sq); if (tp) g2.remove(tsq); g2.put({type:'n',color:color},tsq);
        var nsm = Object.assign({}, sm); delete nsm[sq]; if (tp) delete nsm[tsq]; nsm[tsq] = id;
        if (!kingInCheck(g2,color,pd,nsm,stunned,ghostMarch))
          result.push({type:'frenzy_charge', from:sq, to:tsq});
      }
      return result;
    }

    if (specialMode === 'spectralStep' && p.type==='b') {
      for (var di=0; di<DIAG_DIRS.length; di++) {
        var df = DIAG_DIRS[di][0], dr = DIAG_DIRS[di][1];
        var cf = FILE(sq)+df, cr = RANK(sq)+dr;
        while (cf>=0 && cf<=7 && cr>=1 && cr<=8) {
          var tsq = SQ(cf,cr);
          if (!game.get(tsq)) {
            var g2 = new Chess(game.fen()); g2.remove(sq); g2.put({type:'b',color:color},tsq);
            var nsm = Object.assign({}, sm); nsm[tsq] = id; delete nsm[sq];
            if (!kingInCheck(g2,color,pd,nsm,stunned,ghostMarch))
              result.push({type:'spectral_step', from:sq, to:tsq});
          }
          cf += df; cr += dr;
        }
      }
      return result;
    }

    if (p.type==='p') {
      var dir = color==='w'?1:-1;
      var f = FILE(sq), r = RANK(sq);
      for (var df=-1; df<=1; df++) {
        var tsq = SQ(f+df, r+dir);
        if (!tsq || result.some(function(mm){return mm.to===tsq;})) continue;
        var tp = game.get(tsq);
        if (df===0 && tp) continue;
        if (df!==0 && tp && tp.color===color) continue;
        var g2 = new Chess(game.fen()); g2.remove(sq); if (tp) g2.remove(tsq); g2.put({type:'p',color:color},tsq);
        var nsm = Object.assign({}, sm); delete nsm[sq]; if (tp) delete nsm[tsq]; nsm[tsq] = id;
        if (!kingInCheck(g2,color,pd,nsm,stunned,ghostMarch)) result.push({type:'std', from:sq, to:tsq});
      }
    }
    if (p.type==='b') {
      for (var di=0; di<DIAG_DIRS.length; di++) {
        var df = DIAG_DIRS[di][0], dr = DIAG_DIRS[di][1];
        var cf = FILE(sq)+df, cr = RANK(sq)+dr;
        var first=null, firstSq=null;
        while (cf>=0 && cf<=7 && cr>=1 && cr<=8) {
          var tsq = SQ(cf,cr); if (!tsq) break;
          var tp = game.get(tsq);
          if (!first) { if (tp) { first=tp; firstSq=tsq; } }
          else {
            if (!tp) {
              var g2 = new Chess(game.fen()); g2.remove(sq); g2.put({type:'b',color:color},tsq);
              var nsm = Object.assign({}, sm); nsm[tsq] = id; delete nsm[sq];
              if (!kingInCheck(g2,color,pd,nsm,stunned,ghostMarch)) result.push({type:'bishop_jump', from:sq, to:tsq, jumped:firstSq, jumpedId:sm[firstSq], jumpedColor:first.color});
            } else {
              if (tp.color!==color) {
                var g2 = new Chess(game.fen()); g2.remove(sq); g2.remove(tsq); g2.put({type:'b',color:color},tsq);
                var nsm = Object.assign({}, sm); delete nsm[sq]; delete nsm[tsq]; nsm[tsq] = id;
                if (!kingInCheck(g2,color,pd,nsm,stunned,ghostMarch)) result.push({type:'bishop_jump', from:sq, to:tsq, jumped:firstSq, jumpedId:sm[firstSq], jumpedColor:first.color, capture:true});
              }
              break;
            }
          }
          cf += df; cr += dr;
        }
      }
    }
    if (p.type==='q') {

      }});
    }

  }, [hasMoved, selPiece, selData, selEffLevel, pts, ghostMarch, game, sm, getMoves, getActualCost, actualTurn, frenzyUsed, soulDartZone, selId]);

        setPts(function(prev) { var np = Object.assign({}, prev); np[activeColor] = prev[activeColor]+elixCost; return np; });
        setElixMode(false); setElixSrc(null);

    );

      React.createElement('div', {style:{fontSize:12,fontWeight:800,color:'#ff6b6b'}}, "🔥 Dardo dell'Anima"),
      React.createElement('div', {className:'hint-text'}, 'Clicca una delle caselle verdi evidenziate per lanciare la traiettoria.'),
      React.createElement('button', {className:'pass-btn', style:{background:'#1e293b',color:'#94a3b8'}, onClick: function() {
        setPts(function(prev) { var np = Object.assign({}, prev); np[activeColor] = prev[activeColor]+dartRefund; return np; });
        setDartMode(false); setDartSrc(null); setDartRefund(0); setSel(null); setMoves([]);
      }}, '✕ Annulla (rimborso '+dartRefund+'⚡)')
    );

    return React.createElement(React.Fragment, null,
      React.createElement('div', null,
        React.createElement('div', {className:'charge-row'},
          React.createElement('span', null, '⚡ ', activeColor==='w'?'BIANCO':'NERO', pdBonusEnergy?' (+1)':'', ghostMarch===activeColor?' 👻 Marcia':''),
          React.createElement('span', {style:{color:'#f1f5f9'}}, pts[activeColor], '⚡')
        ),
        React.createElement('div', {className:'charge-track'},

            : selData
              ? React.createElement('span', {style:{fontWeight:700}},
                  selPiece && ICONS[selPiece.color][selPiece.type], '\u00A0',

                  stunned.has(selId) && React.createElement('span', {style:{color:'#818cf8'}}, ' (Stordito)'),
                  immune && immune.sq===sel && React.createElement('span', {style:{color:'#fbbf24'}}, ' (Immune)')
                )

        ),
        React.createElement('div', {className:'turn-pill', style:{color: activeColor==='w'?'#38bdf8':'#f43f5e'}},
          inCheck?'⚠️ SCACCO':activeColor==='w'?'⬜ Bianco':'⬛ Nero'

        pieceAbilities.map(function(ab,i) {

            style:{borderColor: ab.available?'#a855f7':'#475569', color: ab.available?'#a855f7':'#64748b'},
            disabled: !ab.available, onClick: ab.action
          }, ab.name, ' (', ab.cost, '⚡)');
        })
      ),
      hasMoved && sel && selEffLevel===2 && pdCanDevolve && React.createElement('button', {className:'ability-btn', style:{background:'#7f1d1d',color:'#fca5a5',marginTop:4}, onClick: devolveSelected},
        '↩ De-evolvi +1⚡'

  return React.createElement('div', {className:'app'},

      React.createElement('div', {className:'board', onClick: function(e) { if (e.target===e.currentTarget) click(null); }},
        bd.map(function(row,r) {

              }, ICONS[cell.color][cell.type]),

            );
          });
        })
      )
    ),
    React.createElement('div', {className:'player-row'},
      React.createElement('div', {className:'player-label', style:{borderLeft:'3px solid #f8fafc'}},
        React.createElement('div', {className:'player-name'}, '⬜ Bianco'),

      React.createElement('div', {style:{fontSize:12,color:'#64748b'}}, gameOver.reason),
