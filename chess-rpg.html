<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;
const Chess=window.Chess;
const ICONS={w:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};

// ═══════════ HELPERS ═══════════
function moveLeavesKingInCheck(fen,from,to,piece){const g=new Chess(fen);g.remove(from);g.put(piece,to);return g.in_check()}
function execAbilityMove(game,from,to){
  const piece=game.get(from),captured=game.get(to)||null,g=new Chess(game.fen());
  g.remove(from);if(captured)g.remove(to);g.put(piece,to);
  const parts=g.fen().split(' ');
  if(piece.type==='k') parts[2]=parts[2].replace(/[KQkq]/g,'');
  if(piece.type==='r'){
    if(from==='a1') parts[2]=parts[2].replace('Q','');
    if(from==='h1') parts[2]=parts[2].replace('K','');
    if(from==='a8') parts[2]=parts[2].replace('q','');
    if(from==='h8') parts[2]=parts[2].replace('k','');
  }
  parts[3]='-';
  const wasW=parts[1]==='w';parts[1]=wasW?'b':'w';
  if(!wasW)parts[5]=String(parseInt(parts[5])+1);
  const ng=new Chess();ng.load(parts.join(' '));
  return{newGame:ng,capturedPiece:captured};
}

// ─── EVO‑SCACCO ──────────────────────────────────────────
function isSquareAttackedByEvo(game, pd, sm, targetSq, attackerColor) {
  const tf = targetSq.charCodeAt(0) - 97, tr = parseInt(targetSq[1]);
  for (const [sq, id] of Object.entries(sm)) {
    const p = game.get(sq);
    if (!p || p.color !== attackerColor) continue;
    const d = pd[id];
    if (!d || d.level < 2) continue;
    const f = sq.charCodeAt(0) - 97, r = parseInt(sq[1]);

    if (p.type === 'p' && tf === f) {
      const dir = attackerColor === 'w' ? 1 : -1;
      if (tr === r + dir) return true;
    }
    if (p.type === 'n') {
      if ((tf === f && Math.abs(tr - r) === 1) || (tr === r && Math.abs(tf - f) === 1)) return true;
    }
    if (p.type === 'b') {
      if (Math.abs(tf - f) === Math.abs(tr - r)) {
        const df = Math.sign(tf - f), dr = Math.sign(tr - r);
        let obs = 0, cf = f + df, cr = r + dr;
        while (cf !== tf && cr !== tr) {
          if (game.get(String.fromCharCode(97 + cf) + cr)) obs++;
          cf += df; cr += dr;
        }
        if (obs === 1) return true;
      }
    }
    if (p.type === 'q') {
      if ((Math.abs(tf - f) === 2 && Math.abs(tr - r) === 1) || (Math.abs(tf - f) === 1 && Math.abs(tr - r) === 2)) return true;
    }
  }
  return false;
}

function isKingInDanger(game, pd, sm, color) {
  if (game.in_check()) return true;
  let kingSq = null;
  const board = game.board();
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = board[r][c];
      if (p && p.type === 'k' && p.color === color) {
        kingSq = 'abcdefgh'[c] + (8 - r);
        break;
      }
    }
    if (kingSq) break;
  }
  return kingSq ? isSquareAttackedByEvo(game, pd, sm, kingSq, color === 'w' ? 'b' : 'w') : false;
}

// ═══════════ EVOLUZIONI ═══════════
const EVOLUTIONS={
  p:{levels:[{name:'Pedone',color:'#64748b',desc:'Standard'},{name:'Assaltatore',color:'#eab308',desc:'Triangolo frontale'}],
    getAbilityMoves(sq,game,level,color){if(level<2)return[];const moves=[],file=sq.charCodeAt(0)-97,rank=parseInt(sq[1]),dir=color==='w'?1:-1;const r=rank+dir;if(r>=1&&r<=8){const fwdSq=String.fromCharCode(97+file)+r,fwdP=game.get(fwdSq);if(fwdP&&fwdP.color!==color)moves.push({from:sq,to:fwdSq,isCapture:true});for(const df of[-1,1]){const f=file+df;if(f>=0&&f<=7){const dSq=String.fromCharCode(97+f)+r;if(!game.get(dSq))moves.push({from:sq,to:dSq,isCapture:false})}}}return moves.filter(m=>!moveLeavesKingInCheck(game.fen(),m.from,m.to,game.get(sq)))}},
  n:{levels:[{name:'Cavallo',color:'#64748b',desc:'Standard'},{name:'Destriero',color:'#3b82f6',desc:'Salto a L + croce'}],
    getAbilityMoves(sq,game,level,color){if(level<2)return[];const piece=game.get(sq),moves=[],file=sq.charCodeAt(0)-97,rank=parseInt(sq[1]);const J=[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]],CROSS=[[0,0],[0,1],[0,-1],[1,0],[-1,0]];for(const[df1,dr1]of J){const mf=file+df1,mr=rank+dr1;if(mf<0||mf>7||mr<1||mr>8)continue;const midSq=String.fromCharCode(97+mf)+mr,midPiece=game.get(midSq);if(midPiece&&midPiece.color===color)continue;if(midPiece&&midPiece.color!==color){if(!moveLeavesKingInCheck(game.fen(),sq,midSq,piece))moves.push({from:sq,to:midSq,isCapture:true});continue}for(const[df2,dr2]of CROSS){const ef=mf+df2,er=mr+dr2;if(ef<0||ef>7||er<1||er>8)continue;const end=String.fromCharCode(97+ef)+er;if(end===sq)continue;const t=game.get(end);if(t&&t.color===color)continue;if(!moveLeavesKingInCheck(game.fen(),sq,end,piece))moves.push({from:sq,to:end,isCapture:!!t})}}return moves}},
  b:{levels:[{name:'Alfiere',color:'#64748b',desc:'Standard'},{name:'Spettro',color:'#06b6d4',desc:'Salta 1 ostacolo'}],
    getAbilityMoves(sq,game,level,color){if(level<2)return[];const piece=game.get(sq),moves=[],file=sq.charCodeAt(0)-97,rank=parseInt(sq[1]);for(const[df,dr]of[[1,1],[1,-1],[-1,1],[-1,-1]]){let f=file+df,r=rank+dr,jumped=false;while(f>=0&&f<=7&&r>=1&&r<=8){const tSq=String.fromCharCode(97+f)+r,t=game.get(tSq);if(t){if(!jumped){jumped=true}else{if(t.color!==color&&!moveLeavesKingInCheck(game.fen(),sq,tSq,piece))moves.push({from:sq,to:tSq,isCapture:true});break}}else if(jumped){if(!moveLeavesKingInCheck(game.fen(),sq,tSq,piece))moves.push({from:sq,to:tSq,isCapture:false})}f+=df;r+=dr}}return moves}},
  r:{levels:[{name:'Torre',color:'#64748b',desc:'Standard'},{name:'Archivista',color:'#22c55e',desc:'Swap a distanza (max 5) | Disevolvi globale'}],
    getAbilityMoves(sq,game,level,color){if(level<2)return[];const moves=[],file=sq.charCodeAt(0)-97,rank=parseInt(sq[1]);for(const[df,dr]of[[0,1],[0,-1],[1,0],[-1,0]]){for(let i=1;i<=5;i++){const nf=file+df*i,nr=rank+dr*i;if(nf<0||nf>7||nr<1||nr>8)break;const tSq=String.fromCharCode(97+nf)+nr,target=game.get(tSq);if(target&&target.color===color&&target.type!=='k'){moves.push({from:sq,to:tSq,isCapture:false,isSwap:true});}}}return moves}},
  q:{levels:[{name:'Regina',color:'#64748b',desc:'Standard'},{name:'Imperatrice',color:'#ec4899',desc:'Amazzone (R+B+N) | Evoca pedone'}],
    getAbilityMoves(sq,game,level,color){if(level<2)return[];const piece=game.get(sq),moves=[],file=sq.charCodeAt(0)-97,rank=parseInt(sq[1]);for(const[df,dr]of[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]]){const nf=file+df,nr=rank+dr;if(nf<0||nf>7||nr<1||nr>8)continue;const tSq=String.fromCharCode(97+nf)+nr,t=game.get(tSq);if(t&&t.color===color)continue;if(!moveLeavesKingInCheck(game.fen(),sq,tSq,piece))moves.push({from:sq,to:tSq,isCapture:!!t})}for(const[df,dr]of[[0,1],[0,-1],[1,0],[-1,0]]){let f=file+df,r=rank+dr;while(f>=0&&f<=7&&r>=1&&r<=8){const tSq=String.fromCharCode(97+f)+r,t=game.get(tSq);if(t){if(t.color!==color&&!moveLeavesKingInCheck(game.fen(),sq,tSq,piece))moves.push({from:sq,to:tSq,isCapture:true});break}if(!moveLeavesKingInCheck(game.fen(),sq,tSq,piece))moves.push({from:sq,to:tSq,isCapture:false});f+=df;r+=dr}}for(const[df,dr]of[[1,1],[1,-1],[-1,1],[-1,-1]]){let f=file+df,r=rank+dr;while(f>=0&&f<=7&&r>=1&&r<=8){const tSq=String.fromCharCode(97+f)+r,t=game.get(tSq);if(t){if(t.color!==color&&!moveLeavesKingInCheck(game.fen(),sq,tSq,piece))moves.push({from:sq,to:tSq,isCapture:true});break}if(!moveLeavesKingInCheck(game.fen(),sq,tSq,piece))moves.push({from:sq,to:tSq,isCapture:false});f+=df;r+=dr}}return moves}},
  k:{levels:[{name:'Re',color:'#64748b',desc:'Standard'}],getAbilityMoves:()=>[]}
};

// ═══════════ RPG VALUE ═══════════
const BASE_VALS={p:1,n:3.2,b:3.3,r:5,q:9,k:200};
function rpgVal(type,level){const b=BASE_VALS[type]||0;if(level===2){if(type==='p')return b+0.7;if(type==='n')return b+1.5;if(type==='b')return b+1.7;if(type==='r')return b+2.5;if(type==='q')return b+5.0}return b}
function evalRpg(game,pd,sm,pts,color){const opp=color==='w'?'b':'w';let score=0;for(const d of Object.values(pd)){if(!d)continue;score+=d.color===color?rpgVal(d.type,d.level):-rpgVal(d.type,d.level)}score+=(pts[color]-pts[opp])*0.35;return score}

// ═══════════ ACTIONS (con filtro sicurezza re) ═══════════
function generateAllActions(game,pd,sm,pts,color,cooldowns){
  const actions=[]; for(const m of game.moves({verbose:true}))actions.push({type:'move',from:m.from,to:m.to,promotion:m.promotion||'q'});
  for(const[sq,id]of Object.entries(sm)){const piece=game.get(sq);if(!piece||piece.color!==color)continue;const d=pd[id],evo=EVOLUTIONS[piece.type];if(!evo)continue;for(const ab of evo.getAbilityMoves(sq,game,d.level,color))actions.push({type:'ability',from:ab.from,to:ab.to,isSwap:ab.isSwap||false})}
  const queenEntry = Object.entries(sm).find(([sq,id]) => pd[id]?.type==='q' && pd[id]?.level>=2 && pd[id]?.color===color);
  if(queenEntry && !game.in_check()){
    const queenSq = queenEntry[0];
    const summonedCount=Object.values(pd).filter(d=>d.type==='p'&&d.color===color&&d.summoned).length;
    if(summonedCount<2&&pts[color]>=2)actions.push({type:'summon',queenSq,cost:2})
  }
  const towerData=Object.values(pd).find(d=>d.type==='r'&&d.level>=2&&d.color===color);
  if(towerData){const towerSq=Object.keys(sm).find(sq=>sm[sq]===towerData.id);if(towerSq){for(const[sq,id]of Object.entries(sm)){const targetPiece=game.get(sq);if(!targetPiece||targetPiece.color!==color||targetPiece.type==='k')continue;const targetData=pd[id];if(targetData&&targetData.level>1){actions.push({type:'devolve',towerSq,targetSq:sq,targetId:id});}}}}
  return actions.filter(a=>{
    if(a.to){
      const target=game.get(a.to);
      if(target&&target.type==='k')return false;
    }
    const next=applyAction(game,pd,sm,pts,a,cooldowns);
    if(!next)return false;
    return !isKingInDanger(next.game,next.pd,next.sm,color);
  });
}

// V5.6: versione veloce per training (salta controllo isKingInDanger)
function generateAllActionsFast(game,pd,sm,pts,color,cooldowns){
  const actions=[];
  for(const m of game.moves({verbose:true}))actions.push({type:'move',from:m.from,to:m.to,promotion:m.promotion||'q'});
  for(const[sq,id]of Object.entries(sm)){
    const piece=game.get(sq);if(!piece||piece.color!==color)continue;
    const d=pd[id],evo=EVOLUTIONS[piece.type];if(!evo)continue;
    for(const ab of evo.getAbilityMoves(sq,game,d.level,color))actions.push({type:'ability',from:ab.from,to:ab.to,isSwap:ab.isSwap||false})
  }
  const queenEntry = Object.entries(sm).find(([sq,id]) => pd[id]?.type==='q'&&pd[id]?.level>=2&&pd[id]?.color===color);
  if(queenEntry &&!game.in_check()){
    const queenSq=queenEntry[0];
    const summonedCount=Object.values(pd).filter(d=>d.type==='p'&&d.color===color&&d.summoned).length;
    if(summonedCount<2&&pts[color]>=2)actions.push({type:'summon',queenSq,cost:2})
  }
  const towerData=Object.values(pd).find(d=>d.type==='r'&&d.level>=2&&d.color===color);
  if(towerData){const towerSq=Object.keys(sm).find(sq=>sm[sq]===towerData.id);if(towerSq){for(const[sq,id]of Object.entries(sm)){const targetPiece=game.get(sq);if(!targetPiece||targetPiece.color!==color||targetPiece.type==='k')continue;const targetData=pd[id];if(targetData&&targetData.level>1){actions.push({type:'devolve',towerSq,targetSq:sq,targetId:id});}}}}
  return actions.filter(a=>{if(a.to){const target=game.get(a.to);if(target&&target.type==='k')return false;}return true;});
}

function applyAction(game,pd,sm,pts,action,cooldowns){
  const color=game.turn();
  if(action.type==='ability'&&action.isSwap){const p1=game.get(action.from),p2=game.get(action.to),g=new Chess(game.fen());g.remove(action.from);g.remove(action.to);g.put(p1,action.to);g.put(p2,action.from);const parts=g.fen().split(' '),wasW=parts[1]==='w';parts[1]=wasW?'b':'w';if(!wasW)parts[5]=String(parseInt(parts[5])+1);parts[3]='-';const ng=new Chess();ng.load(parts.join(' '));const nsm={...sm},id1=nsm[action.from],id2=nsm[action.to];nsm[action.from]=id2;nsm[action.to]=id1;return{game:ng,pd:{...pd},sm:nsm,pts:{...pts,[color]:pts[color]+1},cooldowns:{...cooldowns}}}
  if(action.type==='summon'){const queenSq=action.queenSq,targetSq=action.targetSq;if(!targetSq)return null;const newId=`${color}p_summoned_${Date.now()}`,npd={...pd,[newId]:{type:'p',color,level:1,summoned:true}},nsm={...sm,[targetSq]:newId},ng=new Chess(game.fen());ng.put({type:'p',color},targetSq);const parts=ng.fen().split(' ');parts[1]=color==='w'?'b':'w';parts[3]='-';const finalGame=new Chess();finalGame.load(parts.join(' '));return{game:finalGame,pd:npd,sm:nsm,pts:{...pts,[color]:pts[color]-2},cooldowns:{...cooldowns}}}
  if(action.type==='devolve'){const targetData=pd[action.targetId];if(!targetData||targetData.level<=1)return null;const npd={...pd,[action.targetId]:{...targetData,level:targetData.level-1}};return{game:new Chess(game.fen()),pd:npd,sm:{...sm},pts:{...pts,[color]:pts[color]+1},cooldowns:{...cooldowns}}}
  let ng,cap=null,isCastleK=false,isCastleQ=false;
  if(action.type==='ability'){const r=execAbilityMove(game,action.from,action.to);ng=r.newGame;cap=r.capturedPiece}
  else{ng=new Chess(game.fen());const mv=ng.move({from:action.from,to:action.to,promotion:action.promotion||'q'});if(!mv)return null;if(mv.captured)cap={type:mv.captured};if(mv.flags?.includes('e'))cap={type:'p',_sq:action.to[0]+action.from[1]};if(mv.flags?.includes('k'))isCastleK=true;if(mv.flags?.includes('q'))isCastleQ=true}
  const mid=sm[action.from],nsm={...sm},npd={...pd};
  if(isCastleK||isCastleQ){const rank=color==='w'?'1':'8';if(isCastleK){nsm['f'+rank]=nsm['h'+rank];delete nsm['h'+rank]}if(isCastleQ){nsm['d'+rank]=nsm['a'+rank];delete nsm['a'+rank]}}
  if(cap){const cs=cap._sq||action.to,cid=nsm[cs];if(cid){delete npd[cid];delete nsm[cs]}}
  const np=ng.get(action.to);if(np&&mid&&npd[mid]&&np.type!==npd[mid].type)npd[mid]={...npd[mid],type:np.type,level:1};
  delete nsm[action.from];nsm[action.to]=mid;
  let p=1;if(cap)p++;if(ng.in_check())p++;
  const newCooldowns={...cooldowns};if(newCooldowns.towerDeevolve>0)newCooldowns.towerDeevolve--;
  return{game:ng,pd:npd,sm:nsm,pts:{...pts,[color]:pts[color]+p},cooldowns:newCooldowns}
}

// ═══════════ FASE EVOLUZIONE ═══════════
function getEvolvablePieces(game,pd,sm,pts,color){
  const evoCosts={p:2,n:2,b:2,r:3,q:5},result=[];
  if(pts[color]<2)return result;

function autoEvolve(state,color){
  const{game,pd,sm,pts,cooldowns}=state;
  const candidates=getEvolvablePieces(game,pd,sm,pts,color);
  if(!candidates.length)return state;
  candidates.sort((a,b)=>rpgVal(b.type,b.newLevel)-rpgVal(b.type,b.newLevel-1)-(rpgVal(a.type,a.newLevel)-rpgVal(a.type,a.newLevel-1)));
  const best=candidates[0];
  const gain=rpgVal(best.type,best.newLevel)-rpgVal(best.type,best.newLevel-1);
  if(gain<1.5)return state;
  const npd={...pd,[best.id]:{...pd[best.id],level:best.newLevel}};
  const npts={...pts,[color]:pts[color]-best.cost};
  return{game:new Chess(game.fen()),pd:npd,sm:{...sm},pts:npts,cooldowns:{...cooldowns}};
}

// ═══════════ NEURAL BRAIN V2.1 ═══════════
const LEARNING_RATE = 0.02;
const NEURAL_BRAIN = {
  loadWeights: () => {
    try { const w = JSON.parse(localStorage.getItem('omega_weights_v21')); if (w && w.material !== undefined) return w; } catch(e){}
    return { material: 1.0, rpg: 1.5, energy: 0.5, center: 0.3, kingSafety: 0.8, evolvedPieces: 1.0 };
  },
  saveWeights: (w) => localStorage.setItem('omega_weights_v21', JSON.stringify(w)),
  getFeatures: (game, pd, sm, pts, color) => {
    const opp = color==='w'?'b':'w';
    let f = { material:0, rpg:0, energy:0, center:0, kingSafety:0, evolvedPieces:0 };
    f.energy = (pts[color] - pts[opp]) / 10;
    if(game.in_check()) { f.kingSafety = game.turn()===color? -1 : 1; }
    const board = game.board();
    for(let r=0; r<8; r++) {
      for(let c=0; c<8; c++) {
        const p = board[r][c];
        if(!p) continue;
        const sq = 'abcdefgh'[c] + (8-r);
        const id = sm[sq];
        const d = id? pd[id] : null;
        const sign = p.color===color? 1 : -1;
        const val = BASE_VALS[p.type] || 0;
        f.material += val * sign;
        if(d && d.level > 1) {
          const bonus = rpgVal(d.type, d.level) - val;
          f.rpg += bonus * sign;
          f.evolvedPieces += sign * bonus;
        }
        if((r===3 || r===4) && (c===3 || c===4)) {
          f.center += 0.5 * sign;
        }
      }
    }
    f.material /= 40;
    f.rpg /= 15;
    f.evolvedPieces /= 10;
    f.center /= 4;
    return f;
  },
  evaluate: (features, weights) => {
    return features.material * weights.material +
           features.rpg * weights.rpg +
           features.energy * weights.energy +
           features.center * weights.center +
           features.kingSafety * weights.kingSafety +
           features.evolvedPieces * weights.evolvedPieces +
           Math.random() * 0.05;
  },
  updateWeights: (history, winner) => {
    let w = NEURAL_BRAIN.loadWeights();
    history.forEach((state, i) => {
      const progress = (i + 1) / history.length;
      const reward = (state.color === winner? 1 : -1) * (progress * progress);
      for(let k in state.features) {
        w[k] += LEARNING_RATE * reward * state.features[k];
      }
    });
    for(let k in w) { w[k] = Math.min(10, Math.max(-10, w[k])); }
    NEURAL_BRAIN.saveWeights(w);
  }
};

// ═══════════ HEADLESS OMEGA (usa versione veloce) ═══════════
const HEADLESS_OMEGA = {
  chooseActionFast: (game, pd, sm, pts, color, cooldowns, weights) => {
    const all = generateAllActionsFast(game, pd, sm, pts, color, cooldowns);
    if(!all.length) return null;
    if(Math.random() < 0.10) { return all[Math.floor(Math.random() * all.length)]; }
    let best = null, bestScore = -Infinity;
    for(const a of all) {
      const next = applyAction(game, pd, sm, pts, a, cooldowns);
      if(!next) continue;
      const features = NEURAL_BRAIN.getFeatures(next.game, next.pd, next.sm, next.pts, color);
      const score = NEURAL_BRAIN.evaluate(features, weights);
      if(score > bestScore) { bestScore = score; best = a; }
    }
    return best || all[0];
  }
};

// ═══════════ TRAINING 20.000 partite ═══════════
let brainStats = { games: 0, wins: {w:0,b:0} };
async function trainAI(games=20000,onProgress=()=>{}){
  let gameCount=0;
  for(let i=0;i<games;i++){
    const g=new Chess(); let state={game:g,...buildState(g),cooldowns:{}};
    const history=[];
    for(let mc=0;mc<200;mc++){
      if(state.game.game_over()) break;
      const color=state.game.turn();
      const weights=NEURAL_BRAIN.loadWeights();
      const features=NEURAL_BRAIN.getFeatures(state.game,state.pd,state.sm,state.pts,color);
      const action=HEADLESS_OMEGA.chooseActionFast(state.game,state.pd,state.sm,state.pts,color,state.cooldowns,weights);
      if(!action) break;
      let next=applyAction(state.game,state.pd,state.sm,state.pts,action,state.cooldowns);
      if(!next) break;
      history.push({ features, color });
      next=autoEvolve(next,color);
      state=next;
    }
    let winner=null;
    if(state.game.in_checkmate()) winner=state.game.turn()==='w'?'b':'w';
    if(winner){
      brainStats.wins[winner]++;
      NEURAL_BRAIN.updateWeights(history, winner);
    }
    gameCount++;
    brainStats.games++;
    onProgress({current:gameCount,total:games,wins:brainStats.wins});
  }
  return{total:gameCount,wins:brainStats.wins};
}

    <div className="player-row"><div className="player-label" style={{borderLeft:`3px solid ${PERSONALITIES[bAI]?.color}`}}><div className="player-name">{thinking&&turn==='b'&&<div className="thinking-dot"/>}⬛ {PERSONALITIES[bAI]?.name}</div>{last&&<div className="last-move-hint">{last.from} → {last.to}</div>}</div><div className="energy-badge" style={{borderLeft:'3px solid #f43f5e',color:pts.b>=2?'#22c55e':'#94a3b8'}}><span style={{fontSize:16}}>⚡</span><span style={{fontSize:11}}>{pts.b}</span></div></div>
    <div className="board-wrap"><div className="board">{bd.map((row,r)=>row.map((cell,c)=>{const fi=flipped?7-c:c,ri=flipped?r:7-r,sq='abcdefgh'[fi]+(ri+1),light=(fi+ri)%2!==0,isSel=sel===sq,isStd=stdM.some(m=>m.to===sq),isAbil=abilM.some(m=>m.to===sq),id=sm[sq],data=id?pd[id]:null,level=data?.level??1,evoCls=level===2?'evo2':'',isEvoHighlight=postPhase&&evolvableSqs.includes(sq),isSummonHighlight=summonMode&&summonAdjSqs.includes(sq);return(<div key={sq} onClick={()=>click(sq)} className={`cell ${light?'light':'dark'} ${isSel?'sel':''} ${isEvoHighlight?'evo-highlight':''} ${isSummonHighlight?'summon-highlight':''} ${last?.from===sq?'last-from':''} ${last?.to===sq?'last-to':''}`}>{isStd&&!cell&&<div style={{position:'absolute',width:'30%',height:'30%',borderRadius:'50%',background:'#22c55e',boxShadow:'0 0 10px #22c55e',zIndex:1}}/>}{isAbil&&!cell&&<div style={{position:'absolute',width:'30%',height:'30%',borderRadius:'50%',background:'#f59e0b',boxShadow:'0 0 10px #f59e0b',zIndex:1}}/>}{isStd&&cell&&<div style={{position:'absolute',inset:0,border:'3px solid #f43f5e',borderRadius:'3px',zIndex:1}}/>}{isAbil&&cell&&<div style={{position:'absolute',inset:0,border:'3px solid #f59e0b',borderRadius:'3px',zIndex:1}}/>}{cell&&<span className={`piece piece-${cell.color} ${evoCls}`} style={{transform:lvlUp===sq?'scale(1.5)':'scale(1)',transition:'transform .15s',animation:lvlUp===sq?'lvlup 1s ease':undefined}}>{ICONS[cell.color][cell.type]}</span>}{level>=2&&<div style={{position:'absolute',inset:'3px',border:'2px solid #a855f7',borderRadius:'4px',pointerEvents:'none',boxShadow:'0 10px rgba(168,85,247,0.7)',zIndex:3}}/>}</div>)}))}</div></div>
    <div className="player-row"><div className="player-label" style={{borderLeft:`3px solid ${PERSONALITIES[wAI]?.color}`}}><div className="player-name">{thinking&&turn==='w'&&<div className="thinking-dot"/>}⬜ {PERSONALITIES[wAI]?.name}{isAI&&thinking&&<span style={{fontSize:10,color:'#38bdf8',marginLeft:4}}>Neural...</span>}</div>{last&&<div className="last-move-hint">{last.from} → {last.to}</div>}</div><div className="energy-badge" style={{borderLeft:'3px solid #38bdf8',color:pts.w>=2?'#22c55e':'#94a3b8'}}><span style={{fontSize:16}}>⚡</span><span style={{fontSize:11}}>{pts.w}</span></div></div>
    <div className="panel">
      {summonMode?(
        <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:'#ec4899',fontWeight:700}}>✨ Clicca una casella rosa per evocare</div>
      ):postPhase?(
        <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:8}}><span style={{fontSize:12,fontWeight:700,color:'#0ea5e9'}}>⚡ Post-mossa: clicca un pezzo o fuori</span></div>
      ):(<>
        <div><div className="charge-row"><span>🔋 {turn==='w'?'BIANCO':'NERO'}{isAI&&thinking?' · analisi...':''}{training?' · TRAINING...':''}</span><span style={{color:cp>=nextCost?'#22c55e':'#38bdf8'}}>{cp}/{nextCost}{cp>=nextCost?' • PRONTO':''}</span></div><div className="charge-track"><div style={{width:`${cpct}%`,height:'100%',background:cp>=nextCost?'#22c55e':'#38bdf8',transition:'width .3s',borderRadius:'2px'}}/></div></div>
        <div className="panel-bottom"><div className="piece-label">{sd&&evo?<span style={{fontWeight:700,color:li?.color||'#94a3b8'}}>{sp&&ICONS[sp.color][sp.type]} {li?.name} Lv.{sd.level} <span style={{fontSize:9,color:'#64748b',marginLeft:4}}>{li?.desc}</span></span>:<span style={{color:'#475569'}}>Seleziona un pezzo</span>}</div>
          <div className="turn-pill" style={{color:turn==='w'?'#38bdf8':'#f43f5e'}}>{isKingInDanger(game,pd,sm,turn)?'SCACCO!':turn==='w'?'⬜':'⬛'}</div></div>
      </>)}
    </div>
    <Bar color="w" cur={wAI} onChange={k=>{setWAI(k);setTimeout(reset,0)}}/>
    {game.game_over()&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.9)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',zIndex:99,gap:14,backdropFilter:'blur(8px)'}}><div style={{fontSize:26,fontWeight:900,color:'#f1f5f9'}}>{game.in_checkmate()?(turn==='w'?'⬛ Nero vince!':'⬜ Bianco vince!'):'🤝 Pareggio'}</div><div style={{fontSize:12,color:'#64748b'}}>{game.in_checkmate()?'Scacco matto':'Patta'}</div><button onClick={reset} style={{padding:'12px 40px',background:'#38bdf8',border:'none',borderRadius:9,fontWeight:800,fontSize:15,cursor:'pointer',marginTop:6}}>RIVINCITA</button></div>}
    <div className="debug-bar">
      <button onClick={exportBrain} style={{background:'none',border:'none',color:'#22c55e',fontSize:'9px',cursor:'pointer'}}>💾</button>
      <label style={{color:'#38bdf8',fontSize:'9px',cursor:'pointer',marginLeft:'6px'}}>
        📤<input type="file" accept=".json" onChange={importBrain} style={{display:'none'}}/>
      </label>
      🧠 Rete neurale | {brainStats.games} partite | {debug||'pronto'} {trainProgress}
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
