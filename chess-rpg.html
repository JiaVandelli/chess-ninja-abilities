<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Chess RPG - Omega V4.1 Pro WakeLock</title>
<style>
/* ... stili identici alla tua versione ... */
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
// ... tutto il codice precedente (LEARN, helpers, EVOLUTIONS, OMEGA_V4, trainAI) invariato ...

const {useState,useEffect,useCallback,useRef} = React;
const Chess = window.Chess;

// ... (LEARN, helpers, EVOLUTIONS, OMEGA_V4, trainAI) ...
// Nota: includi tutto il codice non relativo alla UI fino a buildState

function App(){
  // ... tutti gli stati invariati ...
  const [training, setTraining] = useState(false);
  const [trainProgress, setTrainProgress] = useState('');
  const [brainStats, setBrainStats] = useState(LEARN.getStats());
  const abortRef = useRef(null); // per fermare il training

  // ... useEffect, getMoves, move, evolve, click ... (invariati)

  // AI turn effect (invariato)

  // NUOVA FUNZIONE: avvia una partita rapida Umano vs IA
  const startHumanGame = (humanColor) => {
    if (training) return; // non durante il training
    if (humanColor === 'w') {
      setWAI('human');
      setBAI('omega');
    } else {
      setWAI('omega');
      setBAI('human');
    }
    reset();
  };

  // MODIFICA: startTraining ora supporta l'aborto
  const startTraining = async () => {
    if (training) return;
    setTraining(true);
    setDebug('🎮 Auto-training...');
    abortRef.current = new AbortController();

    // Wake Lock
    if ('wakeLock' in navigator) {
      try {
        wakeLockRef.current = await navigator.wakeLock.request('screen');
        wakeLockRef.current.addEventListener('release', () => setDebug('⚠️ Schermo sbloccato, training continua...'));
      } catch (e) { /* ignore */ }
    }

    try {
      await trainAI(50, (progress) => {
        setTrainProgress(`${progress.current}/${progress.total} | W:${progress.wins.w} B:${progress.wins.b}`);
      }, abortRef.current.signal); // passa il segnale
    } catch (e) {
      if (e.name === 'AbortError') setDebug('⏹️ Training fermato.');
    }

    // Rilascia Wake Lock
    if (wakeLockRef.current) {
      await wakeLockRef.current.release().catch(()=>{});
      wakeLockRef.current = null;
    }

    setBrainStats(LEARN.getStats());
    setTraining(false);
    setTrainProgress('');
    setDebug('✅ Pronto. Gioca!');
    reset();
  };

  const stopTraining = () => {
    if (abortRef.current) abortRef.current.abort();
  };

  // Modifica reset: non serve cambiare AI, solo stato partita
  const reset = () => {
    const g = new Chess();
    const s = buildState(g);
    setGame(g); setPd(s.pd); setSm(s.sm); setPts({w:0,b:0});
    setSel(null); setStd([]); setAbl([]);
    setThink(false); setLast(null);
    setDebug('');
    setTrainProgress('');
    gen.current++;
  };

  // ... render invariato fino alla Bar ...

  // NUOVA BARRA SUPERIORE CON PULSANTI GIOCA
  const Bar = ({color, cur, onChange, isTraining}) => (
    <div className="top-bar">
      {Object.entries(PERSONALITIES).map(([k,v]) => (
        <button key={k} className={`mode-btn ${cur===k ? 'active' : ''}`}
          style={cur===k ? {background:v.color, borderColor:v.color} : {}}
          onClick={() => !isTraining && onChange(k)}
          disabled={isTraining}>
          {color==='w'?'⬜':'⬛'} {v.name}
        </button>
      ))}
      {color==='w' && <button className="flip-btn" onClick={() => setFlip(f=>!f)}>🔄</button>}
      {/* Pulsanti Gioca come... */}
      {color==='b' && !isTraining && (
        <>
          <button onClick={() => startHumanGame('w')} title="Gioca come Bianco" style={{background:'#f0f9ff',border:'none',borderRadius:6,padding:'0 6px',cursor:'pointer'}}>👤⬜</button>
          <button onClick={() => startHumanGame('b')} title="Gioca come Nero" style={{background:'#1a1a1a',color:'white',border:'none',borderRadius:6,padding:'0 6px',cursor:'pointer'}}>👤⬛</button>
        </>
      )}
      {color==='b' && (
        isTraining ? (
          <button className="train-btn" onClick={stopTraining} style={{background:'#f43f5e'}}>⏹️ Stop</button>
        ) : (
          <button className="train-btn" onClick={startTraining}>🧠 Allena</button>
        )
      )}
    </div>
  );

  // Nel return, passa isTraining={training} a entrambe le Bar
  return (
    <div className="app">
      <Bar color="b" cur={bAI} onChange={k => {setBAI(k); setTimeout(reset,0);}} isTraining={training} />
      {/* ... resto invariato ... */}
      <Bar color="w" cur={wAI} onChange={k => {setWAI(k); setTimeout(reset,0);}} isTraining={training} />
      {/* ... game over ... */}
      <div className="debug-bar">🧠 {brainStats.positions} pos | {brainStats.totalGames} partite | {debug||'pronto'} {trainProgress}</div>
    </div>
  );
}

// Modifica trainAI per supportare AbortSignal
async function trainAI(games=100, onProgress=()=>{}, signal) {
  let gameCount=0, wins={w:0,b:0};
  for(let i=0; i<games; i++){
    if (signal?.aborted) throw new DOMException('Aborted', 'AbortError');
    // ... resto uguale ...
  }
  return {total:gameCount, wins};
}
</script>
</body>
</html>
