<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Chess RPG — Stockfish RPG Supreme</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#060913}
#root{height:100%}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:8px;gap:6px;color:#f1f5f9;font-family:system-ui,sans-serif}
.top-bar{flex-shrink:0;height:44px;display:flex;gap:8px;align-items:center;justify-content:center;background:#0b0f19;border:1px solid #1e293b;border-radius:10px;padding:4px}
.mode-btn{flex:1;height:100%;background:transparent;border:none;color:#94a3b8;border-radius:6px;font-size:12px;font-weight:800;cursor:pointer;transition:all .2s}
.mode-btn.active{background:#1e293b;color:#f1f5f9}
.action-btn{flex-shrink:0;padding:0 12px;height:100%;background:#1e293b;border:none;color:#f1f5f9;border-radius:6px;font-size:12px;font-weight:800;cursor:pointer}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.board{
  --side:min(calc(100vw - 16px),calc(100vh - 310px));
  width:var(--side);height:var(--side);
  display:grid;grid-template-columns:repeat(8,1fr);
  border-radius:4px;overflow:hidden;
  border:3px solid #4b3220;
  box-shadow:0 0 0 5px #6b4423,0 6px 24px rgba(0,0,0,.6)
}
.cell{position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--side,300px)/8*0.72);cursor:pointer;aspect-ratio:1/1}
.cell.light{background:#f0d9b5}
.cell.dark{background:#b58863}
.cell.last-move.light{background:#f7ec74 !important}
.cell.last-move.dark{background:#d8bf35 !important}
.cell.sel{outline:3px solid #a855f7;outline-offset:-3px;background:#2d1f4e!important;z-index:2}
.piece{font-family:"Segoe UI Symbol","Noto Sans Symbols",sans-serif;display:inline-block;line-height:1;user-select:none;z-index:1}
.piece-w{color:#fef9f0;-webkit-text-stroke:1.8px #1a0a00;filter:drop-shadow(0 2px 4px rgba(0,0,0,.75))}
.piece-b{color:#0f0800;-webkit-text-stroke:.5px rgba(255,255,255,.1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.evo2{filter:drop-shadow(0 0 5px #eab308) drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.evo3{filter:drop-shadow(0 0 10px #a855f7) drop-shadow(0 0 22px #a855f7)}
.lm{position:absolute;top:2px;right:3px;font-size:9px;font-weight:800;pointer-events:none}
.lm2{color:#eab308;text-shadow:0 0 5px #eab308}.lm3{color:#a855f7;text-shadow:0 0 8px #a855f7}
.player-row{flex-shrink:0;height:48px;display:flex;gap:8px;align-items:center}
.player-label{flex:1;height:100%;background:#0b0f19;border:1px solid #1e293b;border-radius:10px;display:flex;flex-direction:column;justify-content:center;padding:0 12px;overflow:hidden}
.player-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.last-move-text{font-size:11px;color:#94a3b8;margin-top:2px;font-weight:600}
.thinking-dot{width:8px;height:8px;border-radius:50%;background:#38bdf8;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
.energy-badge{flex-shrink:0;width:64px;height:100%;background:#0b0f19;border:1px solid #1e293b;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900}
.panel{flex-shrink:0;height:88px;background:#0b0f19;border:1px solid #1e293b;border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:7px}
.charge-row{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:#94a3b8}
.charge-track{width:100%;height:6px;background:#1e293b;border-radius:3px;overflow:hidden;margin-top:4px}
.panel-bottom{display:flex;align-items:center;gap:8px;flex:1}
.piece-label{flex:1;font-size:13px;min-width:0}
.evolve-btn{flex-shrink:0;padding:6px 12px;border:none;border-radius:7px;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s}
.turn-pill{flex-shrink:0;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;background:#1e293b}
@keyframes lvlup{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="evolutions.js"></script>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;
const Chess=window.Chess;
const ICONS={w:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};

// ── STOCKFISH WORKER INTERFACE ───────────────────────────────────────────────
let sfWorker=null, sfBusy=false;
try{
  const blob=new Blob(
    [`importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.0/stockfish.js');`],
    {type:'application/javascript'}
  );
  sfWorker=new Worker(URL.createObjectURL(blob));
  console.log('✅ Stockfish Caricato con Successo');
}catch(e){ console.warn('⚠️ Stockfish non disponibile'); }

// Trova la mossa migliore standard (Candidato Base)
function sfGetMove(fen){
  if(!sfWorker||sfBusy) return Promise.resolve(null);
  sfBusy=true;
  return new Promise(resolve=>{
    const timeout=setTimeout(()=>{
      sfBusy=false;sfWorker.removeEventListener('message',h);resolve(null);
    },4000); // Tempo di timeout generoso per movetime 2000
    const h=e=>{
      if(typeof e.data==='string'&&e.data.startsWith('bestmove')){
        clearTimeout(timeout);sfBusy=false;sfWorker.removeEventListener('message',h);
        const mv=e.data.split(' ')[1];
        if(!mv||mv==='(none)'){resolve(null);return;}
        resolve({from:mv.slice(0,2),to:mv.slice(2,4),promotion:mv[4]||null});
      }
    };
    sfWorker.addEventListener('message',h);
    sfWorker.postMessage('ucinewgame');
    sfWorker.postMessage('position fen '+fen);
    sfWorker.postMessage('go movetime 2000'); // Potenza alzata a 2s
  });
}

// Valuta una posizione simulata con Stockfish per N ms
function sfEvalPosition(fen, movetime = 600) {
  if (!sfWorker || sfBusy) return Promise.resolve(0);
  sfBusy = true;

  return new Promise(resolve => {
    const timeout = setTimeout(() => {
      sfBusy = false;
      sfWorker.removeEventListener('message', h);
      resolve(0);
    }, movetime + 1000);

    let bestScore = 0;
    const h = e => {
      if (typeof e.data === 'string') {
        if (e.data.includes('score cp')) {
          const m = e.data.match(/score cp (-?\d+)/);
          if (m) bestScore = parseInt(m[1]) / 100; // centipawn -> pawn
        } else if (e.data.includes('score mate')) {
          const m = e.data.match(/score mate (-?\d+)/);
          if (m) {
            const mateIn = parseInt(m[1]);
            bestScore = mateIn > 0 ? 100 - mateIn : -100 - mateIn;
          }
        }
        if (e.data.startsWith('bestmove')) {
          clearTimeout(timeout);
          sfBusy = false;
          sfWorker.removeEventListener('message', h);
          resolve(bestScore);
        }
      }
    };

    sfWorker.addEventListener('message', h);
    sfWorker.postMessage('ucinewgame');
    sfWorker.postMessage('position fen ' + fen);
    sfWorker.postMessage(`go movetime ${movetime}`); // Potenza di simulazione 600ms
  });
}

// Clona lo stato di gioco per simulare mosse
function cloneGameState(game, pd, sm) {
  const g = new Chess(game.fen());
  const npd = JSON.parse(JSON.stringify(pd));
  const nsm = {...sm};

  return {
    game: g,
    pd: npd,
    sm: nsm,
    doEvolve(sq) {
      const id = nsm[sq];
      if (id && npd[id]) npd[id].level = Math.min(npd[id].level + 1, 3);
    },
    execAbilityMove(from, to) {
      const piece = g.get(from);
      const captured = g.get(to);
      g.remove(from);
      if (captured) g.remove(to);
      g.put(piece, to);
      const pts = g.fen().split(' ');
      pts[1] = pts[1] === 'w' ? 'b' : 'w'; 
      const ng = new Chess();
      ng.load(pts.join(' '));
      this.game = ng;
    }
  };
}

// Simula le evoluzioni disponibili per l'avversario
function simulateOppEvolutions(game, pd, sm, oppColor, oppPts) {
  const evolutions = [];
  if (oppPts < 2) return evolutions;

  for (const [sq, id] of Object.entries(sm)) {
    const d = pd[id];
    if (!d || d.color !== oppColor || d.type !== 'p' || d.level >= 3) continue;

    const sim = cloneGameState(game, pd, sm);
    sim.doEvolve(sq);
    evolutions.push({sq, fen: sim.game.fen()});
  }
  return evolutions;
}

const PERSONALITIES = {
  human:     { name: 'Umano',         ai: false, color: '#94a3b8' },
  stockfish: { name: 'Stockfish RPG', ai: true,  color: '#38bdf8' }
};

// ── SISTEMA IBRIDO ORACOLO INTERFACCIA AI (CON DEEP SEARCH MINIMAX) ────────
const RPG = {
  async chooseAction(game, pd, sm, pts, color) {
    const oppColor = color === 'w' ? 'b' : 'w';
    game._ptsW = pts.w;
    game._ptsB = pts.b;

    const candidates = [];

    // A. Mossa standard migliore consigliata da Stockfish
    const sfMove = await sfGetMove(game.fen());
    if (sfMove) candidates.push({type: 'move', ...sfMove, label: 'SF Base'});

    // B. Evoluzioni possibili
    for (const [sq, id] of Object.entries(sm)) {
      const d = pd[id];
      if (!d || d.color !== color || d.type !== 'p' || d.level >= 3) continue;
      if (pts[color] >= 2) {
        const sim = cloneGameState(game, pd, sm);
        sim.doEvolve(sq);
        const fen = sim.game.fen();
        candidates.push({type: 'evolve', sq, fen, label: `Evolve ${sq} Lv${d.level+1}`});
      }
    }

    // C. Abilità offensive
    for (const [sq, id] of Object.entries(sm)) {
      const d = pd[id];
      if (!d || d.color !== color) continue;
      const evo = EVOLUTIONS[d.type];
      if (!evo) continue;

      const abilities = evo.getAbilityMoves(sq, game, d.level, color);
      for (const ab of abilities) {
        const target = game.get(ab.to);
        if (target && target.color !== color) {
          const sim = cloneGameState(game, pd, sm);
          sim.execAbilityMove(ab.from, ab.to);
          const fen = sim.game.fen();
          candidates.push({type: 'ability', from: ab.from, to: ab.to, fen, label: `Ability ${ab.from}->${ab.to}`});
        }
      }
    }

    if (candidates.length === 0) {
      const legals = game.moves({ verbose: true });
      return legals.length ? {type: 'move', from: legals[0].from, to: legals[0].to} : null;
    }

    // 2. Valuta ogni candidato considerando anche le risposte avversarie
    const scored = [];
    for (const cand of candidates) {
      const fenToEval = cand.fen || game.fen();

      // Valuta posizione dopo la mossa (Score base)
      let score = await sfEvalPosition(fenToEval, 600);

      // Simula: cosa può fare l'avversario se io faccio questa mossa?
      const simAfter = cloneGameState(game, pd, sm);
      if (cand.type === 'evolve') simAfter.doEvolve(cand.sq);
      if (cand.type === 'ability') simAfter.execAbilityMove(cand.from, cand.to);
      if (cand.type === 'move') {
        const mv = {from: cand.from, to: cand.to};
        if (cand.promotion) mv.promotion = cand.promotion;
        else if (simAfter.game.get(cand.from)?.type === 'p' && (cand.to[1] === '8' || cand.to[1] === '1')) mv.promotion = 'q';
        simAfter.game.move(mv);
      }

      // Guarda le migliori risposte avversarie: evoluzioni + mosse
      const oppEvos = simulateOppEvolutions(simAfter.game, simAfter.pd, simAfter.sm, oppColor, pts[oppColor]);
      const oppMoves = simAfter.game.moves({verbose: true}).slice(0, 3); // top 3 mosse legali

      // Logica Minimax (Stockfish calcola sempre dal punto di vista del BIANCO)
      // Se io sono Bianco, l'avversario cercherà di abbassare il mio score (Math.min)
      // Se io sono Nero, l'avversario cercherà di alzare il suo score (Math.max)
      let worstScoreForMe = color === 'w' ? Infinity : -Infinity;
      let validResponses = 0;

      // Controlla evoluzioni avversarie
      for (const oppEvo of oppEvos) {
        const oppScore = await sfEvalPosition(oppEvo.fen, 400);
        worstScoreForMe = color === 'w' ? Math.min(worstScoreForMe, oppScore) : Math.max(worstScoreForMe, oppScore);
        validResponses++;
      }

      // Controlla mosse avversarie
      for (const oppMove of oppMoves) {
        const simOpp = new Chess(simAfter.game.fen());
        simOpp.move(oppMove);
        const oppScore = await sfEvalPosition(simOpp.fen(), 400);
        worstScoreForMe = color === 'w' ? Math.min(worstScoreForMe, oppScore) : Math.max(worstScoreForMe, oppScore);
        validResponses++;
      }

      // Se l'avversario non ha mosse (es. scaccomatto generato da noi), teniamo lo score base
      if (validResponses === 0) {
        worstScoreForMe = score;
      }

      // Normalizza il punteggio finale in modo che i valori alti siano SEMPRE positivi per chi muove
      const finalScore = color === 'w' ? worstScoreForMe : -worstScoreForMe;

      scored.push({...cand, score: finalScore});
      console.log(`[Oracle Deep] ${cand.label}: Score Post-Risposta = ${finalScore.toFixed(2)}`);
    }

    // 3. Scegli l'azione con il punteggio migliore
    scored.sort((a, b) => b.score - a.score);
    const best = scored[0];

    console.log(`[Oracle Deep] 🏆 Scelta Definitiva: ${best.label} con score ${best.score.toFixed(2)}`);

    if (best.type === 'move') return {type: 'move', from: best.from, to: best.to};
    if (best.type === 'evolve') return {type: 'evolve', sq: best.sq};
    if (best.type === 'ability') return {type: 'ability', from: best.from, to: best.to};

    return scored[0];
  }
};

function buildInitialState(g){
  const pd={},sm={};
  g.board().forEach((row,r)=>row.forEach((cell,c)=>{
    if(cell){const sq='abcdefgh'[c]+(8-r);const id=`${cell.color}${cell.type}_${sq}`;
    pd[id]={id,type:cell.type,color:cell.color,level:1};sm[sq]=id;}
  }));
  return{pd,sm};
}

function execAbilityMove(game,from,to){
  const piece=game.get(from),captured=game.get(to)||null;
  const g=new Chess(game.fen());
  g.remove(from);if(captured)g.remove(to);g.put(piece,to);
  const pts=g.fen().split(' ');const wasW=pts[1]==='w';
  pts[1]=wasW?'b':'w';if(!wasW)pts[5]=String(parseInt(pts[5])+1);pts[3]='-';
  const ng=new Chess();ng.load(pts.join(' '));
  return{newGame:ng,capturedPiece:captured};
}

// ── CORE COMPONENT REACT ──────────────────────────────────────────────────────
function App(){
  const[game,setGame]=useState(()=>new Chess());
  const[pd,setPd]=useState({});
  const[sm,setSm]=useState({});
  const[sel,setSel]=useState(null);
  const[stdMoves,setStdMoves]=useState([]);
  const[abilMoves,setAbilMoves]=useState([]);
  const[lvlUpSq,setLvlUpSq]=useState(null);
  const[pts,setPts]=useState({w:0,b:0});
  
  const[lastMove,setLastMove]=useState(null);
  const[flipped,setFlipped]=useState(false); 
  
  const[whiteAI,setWhiteAI]=useState('human');
  const[blackAI,setBlackAI]=useState('stockfish');
  
  const[thinking,setThinking]=useState(false);
  const aiTimer=useRef(null);
  const aiGen=useRef(0);

  useEffect(()=>{const s=buildInitialState(game);setPd(s.pd);setSm(s.sm);},[]);

  const getMovesFor=useCallback(sq=>{
    const piece=game.get(sq);if(!piece)return{std:[],abil:[]};
    const std=game.moves({square:sq,verbose:true});
    const id=sm[sq];const data=pd[id];const evo=EVOLUTIONS[piece.type];
    const abil=evo&&data?evo.getAbilityMoves(sq,game,data.level,piece.color):[];
    return{std,abil};
  },[game,sm,pd]);

  const makeMove=useCallback((from,to,isAbility=false)=>{
    const turn=game.turn();let newGame,cap=null;
    if(isAbility){
      const res=execAbilityMove(game,from,to);newGame=res.newGame;cap=res.capturedPiece;
    }else{
      newGame=new Chess(game.fen());
      const mv=newGame.move({from,to,promotion:'q'});
      if(!mv)return;
      if(mv.captured)cap={type:mv.captured};
      if(mv.flags?.includes('e'))cap={type:'p',_sq:to[0]+from[1]};
    }
    const mid=sm[from];const nsm={...sm};const npd={...pd};
    if(cap){const cSq=cap._sq??to;const cId=nsm[cSq];delete npd[cId];delete nsm[cSq];}
    const np=newGame.get(to);let isPromo=false;
    if(np&&np.type!==pd[mid]?.type){npd[mid]={...npd[mid],type:np.type,level:1};isPromo=true;}
    delete nsm[from];nsm[to]=mid;
    
    let p=1;if(cap)p++;if(newGame.in_check())p++;if(isPromo)p+=2;
    setPts(ps=>({...ps,[turn]:ps[turn]+p}));
    setGame(newGame);setPd(npd);setSm(nsm);setSel(null);setStdMoves([]);setAbilMoves([]);
    setLastMove({from,to});
  },[game,sm,pd]);

  const doEvolve=useCallback(sq=>{
    if(!sq)return;const turn=game.turn();
    const piece=game.get(sq);if(!piece||piece.color!==turn)return;
    if(pts[turn]<2)return;
    const id=sm[sq];const d=pd[id];
    if(!d||d.level>=3||!EVOLUTIONS[d.type])return;
    setPd(prev=>({...prev,[id]:{...d,level:d.level+1}}));
    setPts(prev=>({...prev,[turn]:prev[turn]-2}));
    setLvlUpSq(sq);setTimeout(()=>setLvlUpSq(null),900);
    setSel(null);setStdMoves([]);setAbilMoves([]);
  },[game,pts,sm,pd]);

  const handleClick=useCallback(sq=>{
    const turn=game.turn();
    const isHuman=turn==='w'?!PERSONALITIES[whiteAI].ai:!PERSONALITIES[blackAI].ai;
    if(!isHuman||thinking)return;
    const piece=game.get(sq);
    if(sel){
      const sM=stdMoves.find(m=>m.to===sq);const aM=abilMoves.find(m=>m.to===sq);
      if(sM||aM){makeMove(sel,sq,!!aM);return;}
      if(piece?.color===turn){setSel(sq);const{std,abil}=getMovesFor(sq);setStdMoves(std);setAbilMoves(abil);return;}
      setSel(null);setStdMoves([]);setAbilMoves([]);return;
    }
    if(piece?.color===turn){setSel(sq);const{std,abil}=getMovesFor(sq);setStdMoves(std);setAbilMoves(abil);}
  },[game,sel,stdMoves,abilMoves,getMovesFor,makeMove,whiteAI,blackAI,thinking]);

  useEffect(()=>{
    const turn=game.turn();
    const aiType=turn==='w'?whiteAI:blackAI;
    if(!PERSONALITIES[aiType].ai||game.game_over())return;
    
    aiGen.current+=1;const myGen=aiGen.current;
    clearTimeout(aiTimer.current);
    
    aiTimer.current=setTimeout(async()=>{
      setThinking(true);
      const action=await RPG.chooseAction(game,pd,sm,pts,turn);
      if(aiGen.current!==myGen){setThinking(false);return;}
      setThinking(false);
      
      if(!action)return;
      if(action.type==='evolve') doEvolve(action.sq);
      else makeMove(action.from,action.to,action.type==='ability');
    }, 400);
    
    return()=>clearTimeout(aiTimer.current);
  },[game,pd,sm,pts,whiteAI,blackAI,makeMove,doEvolve]);

  const rawBoard = game.board();
  const boardData = flipped ? [...rawBoard].reverse().map(r=>[...r].reverse()) : rawBoard;

  const turn=game.turn();
  const selId=sel?sm[sel]:null;const selData=selId?pd[selId]:null;
  const selPiece=sel?game.get(sel):null;
  const evo=selPiece?EVOLUTIONS[selPiece.type]:null;
  const lvlInfo=evo&&selData?evo.levels[selData.level-1]:null;
  const curPts=pts[turn];
  const chargePct=Math.min(curPts/6*100,100); 
  const canEvolve=!!(evo&&selData&&selData.level<3&&selPiece?.color===turn&&curPts>=2);
  const showEvolveBtn=!!(evo&&selData&&selData.level<3);
  const isAITurn=PERSONALITIES[turn==='w'?whiteAI:blackAI].ai;

  const PersonalityBar=({forColor,current,onChange})=>(
    <div className="top-bar">
      {Object.entries(PERSONALITIES).map(([k,v])=>(
        <button key={k}
          className={`mode-btn ${current===k?'active':''}`}
          onClick={()=>onChange(k)}>
          {forColor==='w'?'⬜':'⬛'} {v.name}
        </button>
      ))}
      {forColor==='w' && (
         <button className="action-btn" onClick={()=>setFlipped(f=>!f)} title="Ruota scacchiera">🔄 Ruota</button>
      )}
    </div>
  );

  const resetGame=()=>{
    const g=new Chess();const s=buildInitialState(g);
    setGame(g);setPd(s.pd);setSm(s.sm);setPts({w:0,b:0});setSel(null);
    setStdMoves([]);setAbilMoves([]);setThinking(false);
    setLastMove(null);
    if(sfWorker){sfWorker.postMessage('ucinewgame');}
  };

  return(
    <div className="app">

      <PersonalityBar forColor="w" current={whiteAI} onChange={v=>{setWhiteAI(v);resetGame();}}/>

      <div className="player-row">
        <div className="player-label" style={{borderLeft:`3px solid ${PERSONALITIES[blackAI].color}`}}>
          <div className="player-name">
            {thinking&&turn==='b'&&<div className="thinking-dot"/>}
            Nero: {PERSONALITIES[blackAI].name}
          </div>
          {lastMove&&<div className="last-move-text">Ultima: {lastMove.from}→{lastMove.to}</div>}
        </div>
        <div className="energy-badge" style={{color:pts.b>=2?'#22c55e':'#94a3b8'}}>
          <span style={{fontSize:16}}>⚡</span>
          <span style={{fontSize:12}}>{pts.b}</span>
        </div>
      </div>

      <div className="board-wrap">
        <div className="board">
          {boardData.map((row,r)=>row.map((cell,c)=>{
            const fileIdx = flipped ? 7 - c : c;
            const rankIdx = flipped ? r : 7 - r;
            const sq = 'abcdefgh'[fileIdx] + (rankIdx + 1);
            
            const isLight = (fileIdx + rankIdx) % 2 !== 0;
            const isSel=sel===sq;
            const isStd=stdMoves.some(m=>m.to===sq);const isAbil=abilMoves.some(m=>m.to===sq);
            const isAny=isStd||isAbil;const id=sm[sq];const data=id?pd[id]:null;
            const level=data?.level??1;const isLvlUp=lvlUpSq===sq;
            const evoClass=level===2?'evo2':level===3?'evo3':'';
            
            const isLastMove = lastMove && (lastMove.from === sq || lastMove.to === sq);

            return(
              <div key={sq} onClick={()=>handleClick(sq)}
                className={`cell ${isLight?'light':'dark'} ${isSel?'sel':''} ${isLastMove?'last-move':''}`}>
                {isAny&&!cell&&(<div style={{position:'absolute',width:'30%',height:'30%',borderRadius:'50%',background:isAbil?'#f59e0b':'#22c55e',boxShadow:`0 0 10px ${isAbil?'#f59e0b':'#22c55e'}`,zIndex:3}}/>)}
                {isAny&&cell&&(<div style={{position:'absolute',inset:0,border:`3px solid ${isAbil?'#f59e0b':'#f43f5e'}`,borderRadius:'3px',zIndex:3}}/>)}
                {cell&&(
                  <span className={`piece piece-${cell.color} ${evoClass}`}
                    style={{transform:isLvlUp?'scale(1.5)':'scale(1)',transition:'transform .15s',animation:isLvlUp?'lvlup 1s ease':undefined}}>
                    {ICONS[cell.color][cell.type]}
                  </span>
                )}
                {cell&&EVOLUTIONS[cell.type]&&level>1&&(
                  <>
                    <div style={{position:'absolute',inset:'2px',border:`2px solid ${level===2?'#eab308':'#a855f7'}`,borderRadius:'2px',pointerEvents:'none',zIndex:2}}/>
                    <div className={`lm ${level===2?'lm2':'lm3'}`} style={{zIndex:3}}>{'●'.repeat(level-1)}</div>
                  </>
                )}
              </div>
            );
          }))}
        </div>
      </div>

      <div className="player-row">
        <div className="player-label" style={{borderLeft:`3px solid ${PERSONALITIES[whiteAI].color}`}}>
          <div className="player-name">
            {thinking&&turn==='w'&&<div className="thinking-dot"/>}
            Bianco: {PERSONALITIES[whiteAI].name}
          </div>
          {lastMove&&<div className="last-move-text">Ultima: {lastMove.from}→{lastMove.to}</div>}
        </div>
        <div className="energy-badge" style={{color:pts.w>=2?'#22c55e':'#94a3b8'}}>
          <span style={{fontSize:16}}>⚡</span>
          <span style={{fontSize:12}}>{pts.w}</span>
        </div>
      </div>

      <div className="panel">
        <div>
          <div className="charge-row">
            <span>🔋 {turn==='w'?'BIANCO':'NERO'} {isAITurn&&thinking?'· Elaborazione Oracolo...':''}</span>
            <span style={{color:curPts>=2?'#22c55e':'#38bdf8'}}>{curPts} ⚡{curPts>=2?' • PRONTO':''}</span>
          </div>
          <div className="charge-track">
            <div style={{width:`${chargePct}%`,height:'100%',background:curPts>=2?'#22c55e':'#38bdf8',transition:'width .3s',borderRadius:'3px'}}/>
          </div>
        </div>
        <div className="panel-bottom">
          <div className="piece-label">
            {selData&&evo?(
              <span style={{fontWeight:700,color:lvlInfo.color}}>
                {ICONS[selPiece.color][selPiece.type]} {lvlInfo.name} Lv.{selData.level}
                {abilMoves.length>0&&<span style={{color:'#f59e0b',marginLeft:4}}>🟡{abilMoves.length}</span>}
              </span>
            ):(<span style={{color:'#475569'}}>Seleziona un pezzo</span>)}
          </div>
          <button className="evolve-btn" onClick={()=>doEvolve(sel)}
            style={{
              visibility:showEvolveBtn?'visible':'hidden',
              background:canEvolve?(lvlInfo?.color||'#38bdf8'):'#1e293b',
              color:canEvolve?'#030712':'#475569',
              cursor:canEvolve?'pointer':'default',
            }}>
            ⚡ EVOLVI (2)
          </button>
          <div className="turn-pill" style={{color:turn==='w'?'#38bdf8':'#f43f5e'}}>
            {game.in_check()?'SCACCO!':turn==='w'?'⬜':'⬛'}
          </div>
        </div>
      </div>

      <PersonalityBar forColor="b" current={blackAI} onChange={v=>{setBlackAI(v);resetGame();}}/>

      {game.game_over()&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.88)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',zIndex:99,gap:14,backdropFilter:'blur(8px)'}}>
          <div style={{fontSize:26,fontWeight:900,letterSpacing:'0.08em',color:'#f1f5f9'}}>
            {game.in_checkmate()?(turn==='w'?'⬛ Nero vince!':'⬜ Bianco vince!'):'🤝 Pareggio'}
          </div>
          <div style={{fontSize:12,color:'#64748b'}}>
            {game.in_checkmate()?'Scacco matto':'Patta'}
          </div>
          <button onClick={resetGame} style={{padding:'11px 36px',background:'#38bdf8',border:'none',borderRadius:9,fontWeight:800,fontSize:15,cursor:'pointer',marginTop:4}}>
            RIVINCITA
          </button>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
