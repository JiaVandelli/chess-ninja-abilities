<style>

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;
const Chess=window.Chess;
const ICONS={
  w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},
  b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}
};

// ═══════════════════════════════════════════════════════════════
//  GAME ENGINE
// ═══════════════════════════════════════════════════════════════
function moveLeavesKingInCheck(fen,from,to,piece){const g=new Chess(fen);g.remove(from);g.put(piece,to);return g.in_check();}

function getGhostExtendedMoves(game,sq,sm,pd){
  const piece=game.get(sq);if(!piece||!['r','b','q'].includes(piece.type))return[];
  const color=piece.color,file=sq.charCodeAt(0)-97,rank=parseInt(sq[1]);
  let dirs=[];if(['r','q'].includes(piece.type))dirs.push([0,1],[0,-1],[1,0],[-1,0]);if(['b','q'].includes(piece.type))dirs.push([1,1],[1,-1],[-1,1],[-1,-1]);
  const extended=[];dirs.forEach(([df,dr])=>{let f=file+df,r=rank+dr,passedGhost=false;while(f>=0&&f<=7&&r>=1&&r<=8){const tSq=String.fromCharCode(97+f)+r,target=game.get(tSq);if(target){if(target.color===color){const id=sm[tSq],d=id?pd[id]:null;if(d&&d.type==='p'&&d.level>=3){passedGhost=true;f+=df;r+=dr;continue;}else break;}else{if(passedGhost)extended.push({from:sq,to:tSq,isCapture:true});break;}}else{if(passedGhost)extended.push({from:sq,to:tSq,isCapture:false});}f+=df;r+=dr;}});
  return extended.filter(m=>!moveLeavesKingInCheck(game.fen(),m.from,m.to,piece));
}

function execAbilityMove(game,from,to){const piece=game.get(from),captured=game.get(to)||null,g=new Chess(game.fen());g.remove(from);if(captured)g.remove(to);g.put(piece,to);const parts=g.fen().split(' '),wasW=parts[1]==='w';parts[1]=wasW?'b':'w';if(!wasW)parts[5]=String(parseInt(parts[5])+1);parts[3]='-';const ng=new Chess();ng.load(parts.join(' '));return{newGame:ng,capturedPiece:captured};}
function applyEvolve(pd,id){const d=pd[id];if(!d||d.level>=4)return null;return{...pd,[id]:{...d,level:d.level+1}};}

// ═══════════════════════════════════════════════════════════════
//  EVOLUTIONS - 4 LIVELLI (Descrizione modificata per Campione)
// ═══════════════════════════════════════════════════════════════
const EVOLUTIONS={
  p:{
    levels:[
      {name:'Pedone',color:'#64748b',desc:'Standard',cost:0},
      {name:'Assaltatore',color:'#eab308',desc:'Triangolo frontale',cost:2},
      {name:'Fantasma',color:'#a855f7',desc:'Attraversabile da R/B/Q',cost:2},
      {name:'Campione',color:'#ff4500',desc:'Ogni mossa = +1 energia',cost:4},
    ],
    getAbilityMoves(sq,game,level,color){
      const moves=[],file=sq.charCodeAt(0)-97,rank=parseInt(sq[1]),dir=color==='w'?1:-1;
      if(level>=2){const r=rank+dir;if(r>=1&&r<=8){const fwdSq=String.fromCharCode(97+file)+r,fwdP=game.get(fwdSq);if(fwdP&&fwdP.color!==color)moves.push({from:sq,to:fwdSq,isCapture:true});for(const df of[-1,1]){const f=file+df;if(f>=0&&f<=7){const dSq=String.fromCharCode(97+f)+r;if(!game.get(dSq))moves.push({from:sq,to:dSq,isCapture:false});}}}}
      return moves.filter(m=>!moveLeavesKingInCheck(game.fen(),m.from,m.to,game.get(sq)));
    }
  },
  n:{levels:[{name:'Cavallo',color:'#64748b'}],getAbilityMoves:()=>[]},
  b:{levels:[{name:'Alfiere',color:'#64748b'}],getAbilityMoves:()=>[]},
  r:{levels:[{name:'Torre',color:'#64748b'}],getAbilityMoves:()=>[]},
  q:{levels:[{name:'Regina',color:'#64748b'}],getAbilityMoves:()=>[]},
  k:{levels:[{name:'Re',color:'#64748b'}],getAbilityMoves:()=>[]}
};

// ═══════════════════════════════════════════════════════════════
//  VALUTAZIONE RPG
// ═══════════════════════════════════════════════════════════════
const BASE_VALS={p:1,n:3.2,b:3.3,r:5,q:9,k:200};
function rpgVal(type,level){const b=BASE_VALS[type]||0;if(type==='p'){if(level===2)return b+0.6;if(level===3)return b+1.0;if(level===4)return b+2.0;}return b;} // Valutazione IA aumentata per il livello 4 passivo

function evalRpg(game,pd,sm,pts,color){
  const opp=color==='w'?'b':'w';let score=0;
  for(const d of Object.values(pd)){if(!d)continue;score+=d.color===color?rpgVal(d.type,d.level):-rpgVal(d.type,d.level);}
  score+=(pts[color]-pts[opp])*0.35;
  for(const[sq,id]of Object.entries(sm)){const d=pd[id];if(!d||d.color!==color||d.type!=='p'||d.level<3)continue;const file=sq.charCodeAt(0)-97,rank=parseInt(sq[1]),behindDir=color==='w'?-1:1;for(let r=rank+behindDir;r>=1&&r<=8;r+=behindDir){const bSq=String.fromCharCode(97+file)+r,p=game.get(bSq);if(p&&p.color===color&&['r','q'].includes(p.type))score+=0.55;break;}}
  const kingSq=Object.entries(sm).find(([s,id])=>pd[id]?.type==='k'&&pd[id]?.color===color)?.[0];if(kingSq){const kf=kingSq.charCodeAt(0)-97,kr=parseInt(kingSq[1]);score+=(kr>=2&&kr<=7?0.1:-0.2);}
  return score;
}

// ═══════════════════════════════════════════════════════════════
//  GENERATORE AZIONI UNIFICATO
// ═══════════════════════════════════════════════════════════════
function generateAllActions(game,pd,sm,pts,color){
  const actions=[];
  for(const m of game.moves({verbose:true}))actions.push({type:'move',from:m.from,to:m.to,promotion:m.promotion||'q'});
  for(const[sq,id]of Object.entries(sm)){
    const piece=game.get(sq);if(!piece||piece.color!==color)continue;
    const d=pd[id],evo=EVOLUTIONS[piece.type];if(!evo)continue;
    for(const ab of evo.getAbilityMoves(sq,game,d.level,color))actions.push({type:'ability',from:ab.from,to:ab.to});
    if(['r','b','q'].includes(piece.type))for(const gm of getGhostExtendedMoves(game,sq,sm,pd))actions.push({type:'ability',from:gm.from,to:gm.to});
  }
  for(const[sq,id]of Object.entries(sm)){
    const d=pd[id];if(!d||d.color!==color||d.type!=='p'||d.level>=4)continue;
    const cost=EVOLUTIONS.p.levels[d.level]?.cost||2;
    if(pts[color]>=cost)actions.push({type:'evolve',sq,id,cost});
  }
  return actions;
}

function applyAction(game,pd,sm,pts,action){
  const color=game.turn();
  if(action.type==='evolve'){
    const npd=applyEvolve(pd,action.id);if(!npd)return null;
    const npts={...pts,[color]:pts[color]-(action.cost||2)};
    return{game:new Chess(game.fen()),pd:npd,sm:{...sm},pts:npts};
  }
  let ng,cap=null;
  if(action.type==='ability'){const r=execAbilityMove(game,action.from,action.to);ng=r.newGame;cap=r.capturedPiece;}
  else{ng=new Chess(game.fen());const mv=ng.move({from:action.from,to:action.to,promotion:action.promotion||'q'});if(!mv)return null;if(mv.captured)cap={type:mv.captured};if(mv.flags?.includes('e'))cap={type:'p',_sq:action.to[0]+action.from[1]};}
  const mid=sm[action.from],nsm={...sm},npd={...pd};
  if(cap){const cs=cap._sq||action.to,cid=nsm[cs];if(cid){delete npd[cid];delete nsm[cs];}}
  const np=ng.get(action.to);if(np&&mid&&npd[mid]&&np.type!==npd[mid].type)npd[mid]={...npd[mid],type:np.type,level:1};
  delete nsm[action.from];nsm[action.to]=mid;
  let p=1;if(cap)p++;if(ng.in_check())p++;if(np&&mid&&npd[mid]&&np.type!==npd[mid].type)p+=2;
  
  // FIX 2: Campione Lv4 genera +1 energia ad OGNI mossa (non solo su cattura)
  if(mid&&npd[mid]&&npd[mid].type==='p'&&npd[mid].level>=4)p+=1;
  
  const npts={...pts,[color]:pts[color]+p};
  return{game:ng,pd:npd,sm:nsm,pts:npts};
}

// ═══════════════════════════════════════════════════════════════
//  STOCKFISH
// ═══════════════════════════════════════════════════════════════
let sfWorker=null;
function initSF(){
  if(sfWorker){try{sfWorker.postMessage('stop');}catch(e){}}
  try{
    sfWorker=new Worker(URL.createObjectURL(new Blob([`importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.0/stockfish.js');`],{type:'application/javascript'})));
    sfWorker.postMessage('setoption name Hash value 128');
    sfWorker.postMessage('setoption name MultiPV value 15');
  }catch(e){sfWorker=null;}
}
initSF();

function sfGetAllMoves(fen,timeMs=4000){
  if(!sfWorker)return Promise.resolve([]);
  return new Promise(resolve=>{
    const moves=[];
    let resolved=false;
    const h=e=>{
      if(typeof e.data!=='string'||resolved)return;
      const msg=e.data;
      if(msg.startsWith('bestmove')){
        sfWorker.removeEventListener('message',h);
        clearTimeout(t);
        resolved=true;
        const mv=msg.split(' ')[1];
        if(mv&&mv!=='(none)'&&!moves.find(m=>m.from===mv.slice(0,2)&&m.to===mv.slice(2,4))){
          moves.push({from:mv.slice(0,2),to:mv.slice(2,4),promotion:mv[4]||null,score:0});
        }
        resolve(moves);
        return;
      }
      const mm=msg.match(/multipv (\d+).*pv ([a-h][1-8][a-h][1-8])/);
      const sm=msg.match(/multipv (\d+).*score cp (-?\d+)/);
      const mm2=msg.match(/multipv (\d+).*score mate (-?\d+)/);
      if(mm){
        const pv=parseInt(mm[1]),mv=mm[2];
        let score=0;
        if(sm)score=parseInt(sm[2])/100;
        else if(mm2)score=parseInt(mm2[2])>0?100:-100;
        if(!moves.find(m=>m.from===mv.slice(0,2)&&m.to===mv.slice(2,4))){
          moves.push({from:mv.slice(0,2),to:mv.slice(2,4),promotion:mv[4]||null,score,multipv:pv});
        }
      }
    };
    const t=setTimeout(()=>{
      if(!resolved){
        sfWorker.removeEventListener('message',h);
        resolved=true;
        resolve(moves);
      }
    },timeMs+2000);
    sfWorker.addEventListener('message',h);
    sfWorker.postMessage('stop');
    sfWorker.postMessage('ucinewgame');
    sfWorker.postMessage('position fen '+fen);
    sfWorker.postMessage(`go movetime ${timeMs} depth 16`);
  });
}

// ═══════════════════════════════════════════════════════════════
//  OMEGA V2.1
// ═══════════════════════════════════════════════════════════════
const OMEGA_V2={
  SF_TIME:4000,
  RPG_PLY:2,
  MAX_CANDIDATES:15,
  MONTE_CARLO_SIMS:10,
  MC_DEPTH:5,
  W_SF:0.40,W_RPG:0.30,W_MC:0.30,

  rpgSearch(state,depth,color){
    if(depth<=0||state.game.game_over())return evalRpg(state.game,state.pd,state.sm,state.pts,color);
    const actions=generateAllActions(state.game,state.pd,state.sm,state.pts,state.game.turn());
    if(state.game.turn()===color){
      let best=-Infinity;
      for(const action of actions.slice(0,12)){
        const next=applyAction(state.game,state.pd,state.sm,state.pts,action);
        if(!next)continue;
        const val=this.rpgSearch(next,depth-1,color);
        if(val>best)best=val;
      }
      return best;
    }else{
      let best=Infinity;
      const stdMoves=state.game.moves({verbose:true}).slice(0,10);
      for(const m of stdMoves){
        const next=applyAction(state.game,state.pd,state.sm,state.pts,{type:'move',from:m.from,to:m.to});
        if(!next)continue;
        const val=this.rpgSearch(next,depth-1,color);
        if(val<best)best=val;
      }
      return best;
    }
  },

  monteCarloRollout(state,color,numMoves){
    let s={game:new Chess(state.game.fen()),pd:{...state.pd},sm:{...state.sm},pts:{...state.pts}};
    let currentColor=state.game.turn();
    for(let i=0;i<numMoves;i++){
      if(s.game.game_over())break;
      const actions=generateAllActions(s.game,s.pd,s.sm,s.pts,currentColor);
      if(!actions.length)break;
      const captures=actions.filter(a=>a.type!=='evolve'&&s.game.get(a.to));
      const chosen=captures.length&&Math.random()<0.6?captures[Math.floor(Math.random()*captures.length)]:actions[Math.floor(Math.random()*actions.length)];
      const next=applyAction(s.game,s.pd,s.sm,s.pts,chosen);
      if(!next)continue;
      s=next;currentColor=currentColor==='w'?'b':'w';
    }
    if(s.game.in_checkmate())return s.game.turn()===color?-100:100;
    if(s.game.in_draw())return 0;
    return evalRpg(s.game,s.pd,s.sm,s.pts,color)/10;
  },

  async chooseAction(game,pd,sm,pts,color){
    const sfMoves=await sfGetAllMoves(game.fen(),this.SF_TIME);
    const allActions=generateAllActions(game,pd,sm,pts,color);
    
    allActions.sort((a,b)=>{
      const aCap=a.type!=='evolve'&&game.get(a.to)?1:0;
      const bCap=b.type!=='evolve'&&game.get(b.to)?1:0;
      if(aCap!==bCap)return bCap-aCap;
      if(a.type==='evolve'&&b.type!=='evolve')return 1;
      if(a.type!=='evolve'&&b.type==='evolve')return -1;
      return 0;
    });
    
    const candidates=allActions.slice(0,this.MAX_CANDIDATES);
    const evaluated=[];
    
    for(const action of candidates){
      const next=applyAction(game,pd,sm,pts,action);
      if(!next)continue;
      
      let sfScore=0;
      if(action.type==='move'){
        const sfMatch=sfMoves.find(m=>m.from===action.from&&m.to===action.to);
        sfScore=sfMatch?sfMatch.score:-2;
      }
      
      const rpgScore=this.rpgSearch(next,this.RPG_PLY,color);
      
      let mcSum=0;
      for(let i=0;i<this.MONTE_CARLO_SIMS;i++)mcSum+=this.monteCarloRollout(next,color,this.MC_DEPTH);
      const mcScore=mcSum/this.MONTE_CARLO_SIMS;
      
      const finalScore=sfScore*this.W_SF+rpgScore*this.W_RPG+mcScore*this.W_MC;
      evaluated.push({...action,sfScore,rpgScore,mcScore,finalScore,label:`${action.type} ${action.from||''}→${action.to||action.sq||''}`});
    }
    
    evaluated.sort((a,b)=>b.finalScore-a.finalScore);
    if(!evaluated.length)return null;
    const best=evaluated[0];
    return best;
  }
};

// ═══════════════════════════════════════════════════════════════
//  APP
// ═══════════════════════════════════════════════════════════════
const PERSONALITIES={human:{name:'Umano',ai:false,color:'#94a3b8'},omega:{name:'Omega V2',ai:true,color:'#eab308'}};
function buildState(g){const pd={},sm={};g.board().forEach((row,r)=>row.forEach((cell,c)=>{if(cell){const sq='abcdefgh'[c]+(8-r);pd[`${cell.color}${cell.type}_${sq}`]={type:cell.type,color:cell.color,level:1};sm[sq]=`${cell.color}${cell.type}_${sq}`;}}));return{pd,sm};}

function App(){
  const[game,setGame]=useState(()=>new Chess());const[pd,setPd]=useState({});const[sm,setSm]=useState({});
  const[sel,setSel]=useState(null);const[stdM,setStd]=useState([]);const[abilM,setAbl]=useState([]);
  const[lvlUp,setLvlUp]=useState(null);const[pts,setPts]=useState({w:0,b:0});
  const[wAI,setWAI]=useState('human');const[bAI,setBAI]=useState('omega');
  const[thinking,setThink]=useState(false);const[last,setLast]=useState(null);const[flipped,setFlip]=useState(false);
  const[debug,setDebug]=useState('');const timer=useRef(null);const gen=useRef(0);

  useEffect(()=>{const s=buildState(game);setPd(s.pd);setSm(s.sm);},[]);
  useEffect(()=>{setFlip(!PERSONALITIES[bAI]?.ai&&PERSONALITIES[wAI]?.ai);},[wAI,bAI]);

  const getMoves=useCallback(sq=>{const p=game.get(sq);if(!p)return{std:[],abil:[]};const std=game.moves({square:sq,verbose:true});const id=sm[sq],d=pd[id],evo=EVOLUTIONS[p.type];let abil=evo&&d?evo.getAbilityMoves(sq,game,d.level,p.color):[];if(['r','b','q'].includes(p.type))abil=[...abil,...getGhostExtendedMoves(game,sq,sm,pd)];return{std,abil};},[game,sm,pd]);

  const move=useCallback((from,to,isAbil=false)=>{
    const turn=game.turn(),action={type:isAbil?'ability':'move',from,to};
    const next=applyAction(game,pd,sm,pts,action);
    if(!next)return;
    setPts(next.pts);setGame(next.game);setPd(next.pd);setSm(next.sm);
    setSel(null);setStd([]);setAbl([]);setLast({from,to});
  },[game,sm,pd,pts]);

  const evolve=useCallback(sq=>{
    if(!sq)return;const turn=game.turn();const id=sm[sq],d=pd[id];
    if(!d||d.level>=4||!EVOLUTIONS[d.type])return;
    const cost=EVOLUTIONS.p.levels[d.level]?.cost||2;
    if(pts[turn]<cost)return;
    const next=applyAction(game,pd,sm,pts,{type:'evolve',sq,id,cost});
    if(!next)return;
    setPd(next.pd);setPts(next.pts);
    setLvlUp(sq);setTimeout(()=>setLvlUp(null),900);
    setSel(null);setStd([]);setAbl([]);
  },[game,pts,sm,pd]);

  const click=useCallback(sq=>{const turn=game.turn(),isHuman=turn==='w'?!PERSONALITIES[wAI]?.ai:!PERSONALITIES[bAI]?.ai;if(!isHuman||thinking)return;const p=game.get(sq);if(sel){if(stdM.some(m=>m.to===sq)){move(sel,sq,false);return;}if(abilM.some(m=>m.to===sq)){move(sel,sq,true);return;}if(p?.color===turn){setSel(sq);const m=getMoves(sq);setStd(m.std);setAbl(m.abil);return;}setSel(null);setStd([]);setAbl([]);return;}if(p?.color===turn){setSel(sq);const m=getMoves(sq);setStd(m.std);setAbl(m.abil);}},[game,sel,stdM,abilM,getMoves,move,wAI,bAI,thinking]);

  useEffect(()=>{const turn=game.turn(),ai=turn==='w'?wAI:bAI;if(!PERSONALITIES[ai]?.ai||game.game_over())return;gen.current++;const myGen=gen.current;clearTimeout(timer.current);timer.current=setTimeout(async()=>{setThink(true);setDebug('🧠 Analisi...');const start=Date.now();const action=await OMEGA_V2.chooseAction(game,pd,sm,pts,turn);const elapsed=((Date.now()-start)/1000).toFixed(1);setDebug(`✅ ${action?.label||'?'} (${elapsed}s)`);if(gen.current!==myGen){setThink(false);return;}setThink(false);if(!action)return;if(action.type==='evolve')evolve(action.sq);else move(action.from,action.to,action.type==='ability');},300+Math.random()*200);return()=>clearTimeout(timer.current);},[game,pd,sm,pts,wAI,bAI,move,evolve]);

  const reset=()=>{sfWorker?.postMessage('stop');sfWorker?.postMessage('ucinewgame');const g=new Chess(),s=buildState(g);setGame(g);setPd(s.pd);setSm(s.sm);setPts({w:0,b:0});setSel(null);setStd([]);setAbl([]);setThink(false);setLast(null);setDebug('');gen.current++;};

  const raw=game.board(),bd=flipped?[...raw].reverse().map(r=>[...r].reverse()):raw,turn=game.turn(),sid=sel?sm[sel]:null,sd=sid?pd[sid]:null,sp=sel?game.get(sel):null,evo=sp?EVOLUTIONS[sp.type]:null,li=evo&&sd?evo.levels[sd.level-1]:null,cp=pts[turn],nextCost=sd?(EVOLUTIONS.p.levels[sd.level]?.cost||2):2,canEvo=!!(evo&&sd&&sd.level<4&&sp?.color===turn&&cp>=nextCost),cpct=Math.min((cp/4)*100,100),isAI=PERSONALITIES[turn==='w'?wAI:bAI]?.ai;

  const Bar=({color,cur,onChange})=>(<div className="top-bar">{Object.entries(PERSONALITIES).map(([k,v])=>(<button key={k} className={`mode-btn ${cur===k?'active':''}`} style={cur===k?{background:v.color,borderColor:v.color}:{}} onClick={()=>onChange(k)}>{color==='w'?'⬜':'⬛'} {v.name}</button>))}{color==='w'&&<button className="flip-btn" onClick={()=>setFlip(f=>!f)}>🔄</button>}</div>);

  const getEvoClass=(level)=>{if(level===2)return'evo2';if(level===3)return'evo3';if(level===4)return'evo4';return'';};
  const getLmClass=(level)=>{if(level===2)return'lm2';if(level===3)return'lm3';if(level===4)return'lm4';return'';};

  // FIX 1: Spostate le barre dei controlli per riflettere fedelmente la posizione fisica dei giocatori (Nero in alto, Bianco in basso)
  return(<div className="app">
    <Bar color="b" cur={bAI} onChange={k=>{setBAI(k);setTimeout(reset,0);}}/>
    <div className="player-row"><div className="player-label" style={{borderLeft:`3px solid ${PERSONALITIES[bAI]?.color}`}}><div className="player-name">{thinking&&turn==='b'&&<div className="thinking-dot"/>}⬛ {PERSONALITIES[bAI]?.name}</div>{last&&<div className="last-move-hint">{last.from} → {last.to}</div>}</div><div className="energy-badge" style={{borderLeft:'3px solid #f43f5e',color:pts.b>=2?'#22c55e':'#94a3b8'}}><span style={{fontSize:16}}>⚡</span><span style={{fontSize:11}}>{pts.b}</span></div></div>
    <div className="board-wrap"><div className="board">{bd.map((row,r)=>row.map((cell,c)=>{const fi=flipped?7-c:c,ri=flipped?r:7-r,sq='abcdefgh'[fi]+(ri+1),light=(fi+ri)%2!==0,isSel=sel===sq,isStd=stdM.some(m=>m.to===sq),isAbil=abilM.some(m=>m.to===sq),id=sm[sq],data=id?pd[id]:null,level=data?.level??1,isGhost=data&&data.type==='p'&&level>=3;return(<div key={sq} onClick={()=>click(sq)} className={`cell ${light?'light':'dark'} ${isSel?'sel':''} ${last?.from===sq?'last-from':''} ${last?.to===sq?'last-to':''}`}>{isStd&&!cell&&<div style={{position:'absolute',width:'30%',height:'30%',borderRadius:'50%',background:'#22c55e',boxShadow:'0 0 10px #22c55e',zIndex:1}}/>}{isAbil&&!cell&&<div style={{position:'absolute',width:'30%',height:'30%',borderRadius:'50%',background:'#f59e0b',boxShadow:'0 0 10px #f59e0b',zIndex:1}}/>}{isStd&&cell&&<div style={{position:'absolute',inset:0,border:'3px solid #f43f5e',borderRadius:'3px',zIndex:1}}/>}{isAbil&&cell&&<div style={{position:'absolute',inset:0,border:'3px solid #f59e0b',borderRadius:'3px',zIndex:1}}/>}{cell&&<span className={`piece piece-${cell.color} ${getEvoClass(level)} ${isGhost&&cell.color===turn?'ghost-friendly':''}`} style={{transform:lvlUp===sq?'scale(1.5)':'scale(1)',transition:'transform .15s',animation:lvlUp===sq?'lvlup 1s ease':undefined}}>{ICONS[cell.color][cell.type]}</span>}{level>=2&&<><div style={{position:'absolute',inset:'2px',border:`2px solid ${level===2?'#eab308':level===3?'#a855f7':'#ff4500'}`,borderRadius:'2px',pointerEvents:'none',zIndex:0}}/><div className={`lm ${getLmClass(level)}`}>{'●'.repeat(level-1)}</div></>}</div>);}))}</div></div>
    <div className="player-row"><div className="player-label" style={{borderLeft:`3px solid ${PERSONALITIES[wAI]?.color}`}}><div className="player-name">{thinking&&turn==='w'&&<div className="thinking-dot"/>}⬜ {PERSONALITIES[wAI]?.name}{isAI&&thinking&&<span style={{fontSize:10,color:'#38bdf8',marginLeft:4}}>V2...</span>}</div>{last&&<div className="last-move-hint">{last.from} → {last.to}</div>}</div><div className="energy-badge" style={{borderLeft:'3px solid #38bdf8',color:pts.w>=2?'#22c55e':'#94a3b8'}}><span style={{fontSize:16}}>⚡</span><span style={{fontSize:11}}>{pts.w}</span></div></div>
    <div className="panel"><div><div className="charge-row"><span>🔋 {turn==='w'?'BIANCO':'NERO'}{isAI&&thinking?' · V2 pensa...':''}</span><span style={{color:cp>=2?'#22c55e':'#38bdf8'}}>{cp}/{nextCost}{cp>=nextCost?' • PRONTO':''}</span></div><div className="charge-track"><div style={{width:`${cpct}%`,height:'100%',background:cp>=nextCost?'#22c55e':'#38bdf8',transition:'width .3s',borderRadius:'2px'}}/></div></div><div className="panel-bottom"><div className="piece-label">{sd&&evo?<span style={{fontWeight:700,color:li?.color||'#94a3b8'}}>{sp&&ICONS[sp.color][sp.type]} {li?.name} Lv.{sd.level}<span style={{fontSize:9,color:'#64748b',marginLeft:4}}>{li?.desc}</span></span>:<span style={{color:'#475569'}}>Seleziona un pezzo</span>}</div><button className="evolve-btn" onClick={()=>evolve(sel)} style={{visibility:evo&&sd&&sd.level<4?'visible':'hidden',background:canEvo?(li?.color||'#38bdf8'):'#1e293b',color:canEvo?'#030712':'#475569',cursor:canEvo?'pointer':'default'}}>⚡ EVOLVI ({nextCost})</button><div className="turn-pill" style={{color:turn==='w'?'#38bdf8':'#f43f5e'}}>{game.in_check()?'SCACCO!':turn==='w'?'⬜':'⬛'}</div></div></div>
    <Bar color="w" cur={wAI} onChange={k=>{setWAI(k);setTimeout(reset,0);}}/>
    {game.game_over()&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.9)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',zIndex:99,gap:14,backdropFilter:'blur(8px)'}}><div style={{fontSize:26,fontWeight:900,color:'#f1f5f9'}}>{game.in_checkmate()?(turn==='w'?'⬛ Nero vince!':'⬜ Bianco vince!'):'🤝 Pareggio'}</div><div style={{fontSize:12,color:'#64748b'}}>{game.in_checkmate()?'Scacco matto':'Patta'}</div><button onClick={reset} style={{padding:'12px 40px',background:'#38bdf8',border:'none',borderRadius:9,fontWeight:800,fontSize:15,cursor:'pointer',marginTop:6}}>RIVINCITA</button></div>}
    <div className="debug-bar">🧠 MultiPV 15 | 🌳 RPG {OMEGA_V2.RPG_PLY}ply | 🎲 MC {OMEGA_V2.MONTE_CARLO_SIMS}sim | {debug}</div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
